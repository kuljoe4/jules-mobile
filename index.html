    <!-- Critical inline styles for instant splash render (no JS needed) -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      html,body{height:100%;overflow:hidden;background:#07090c;}
      #splash{
        position:fixed;inset:0;z-index:9999;background:#07090c;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:0;font-family:'JetBrains Mono',monospace;
        transition:opacity .3s cubic-bezier(0.4, 0, 0.2, 1), visibility .3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}
      #splash-logo{
        width:60px;height:60px;border-radius:14px;background:#06b6d4;
        display:flex;align-items:center;justify-content:center;
        font-size:38px;font-weight:900;color:#000;
        box-shadow:0 8px 32px rgba(6,182,212,.2);
        margin-bottom:22px;
      }
      #splash-title{font-size:15px;font-weight:700;color:#c5d4e8;letter-spacing:.06em;margin-bottom:6px;}
      #splash-sub{font-size:12px;color:#4a5e76;letter-spacing:.05em;margin-bottom:28px;}
      #splash-bar-wrap{width:120px;height:2px;background:#1e2d3d;border-radius:2px;overflow:hidden;}
      #splash-bar{
        height:100%;width:0%;background:#06b6d4;border-radius:2px;
        box-shadow:0 2px 10px rgba(6,182,212,.3);
        animation:splash-load 2.4s cubic-bezier(.4,0,.2,1) forwards;
      }
      #splash-hint{margin-top:14px;font-size:12px;font-weight:700;color:#4a5e76;letter-spacing:.07em;}
      #splash-step{margin-top:5px;font-size:11px;color:#2a3d52;letter-spacing:.06em;min-height:13px;transition:opacity .2s cubic-bezier(0.4, 0, 0.2, 1);}
      @keyframes splash-load{
        0%  {width:0%}
        30% {width:35%}
        60% {width:62%}
        85% {width:80%}
        100%{width:92%}   /* intentionally stops before 100 — React completes it */
      }
      /* Skeleton shimmer for list (shown inside #root before React paints) */
      @keyframes shimmer{to{background-position:200% center;}}

    <script>
    // ── Global Error Handling ──────────────────────────────────────────────────
    function handleBootError(msg, error) {
      console.error('CRITICAL BOOT ERROR:', msg, error);
      const splash = document.getElementById('splash');
      if (splash) {
        const hint = document.getElementById('splash-hint');
        const step = document.getElementById('splash-step');
        if (hint) {
          hint.textContent = 'BOOT ERROR';
          hint.style.color = '#fb7185';
        }
        if (step) {
          step.textContent = (msg || 'Unknown error').toUpperCase();
          step.style.color = '#fb7185';
          step.style.opacity = '1';
        }
        const resetBtn = document.getElementById('emergency-reset');
        if (resetBtn) resetBtn.style.display = 'block';
      }
    }

    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const diag = [
        msg,
        url ? 'at ' + url : '',
        lineNo ? 'line ' + lineNo : '',
        columnNo ? 'col ' + columnNo : ''
      ].filter(Boolean).join(' ');
      handleBootError(diag, error);
      return false;
    };

    window.onunhandledrejection = function(event) {
      const reason = event.reason;
      const msg = reason?.message || reason?.toString() || 'Unknown promise rejection';
      handleBootError('Async error: ' + msg, reason);
    };

    // ── PWA Bootstrap ──────────────────────────────────────────────────────────
    // Chrome PWA install requires:
    //   1. HTTPS (or localhost) — file:// will NOT work
    //   2. A web manifest reachable at the same origin
    //   3. A service worker registered at the same origin
    //
    // Strategy for a single-file PWA:
    //   • Manifest  → data: URI (Chrome accepts this for installability)
    //   • SW        → written to the page origin via a self-fetching trick:
    //                 the SW script is base64-encoded inside this file and
    //                 registered by fetching the HTML itself and rewriting it.
    //                 For true single-file, we use a same-origin fetch of this
    //                 file's own URL, serve the SW JS via a custom response
    //                 intercepted by a SharedWorker shim — but that's overkill.
    //                 Simplest working approach: write SW source to a data: URL
    //                 registered with `{scope:'/'}` which Chrome 89+ supports
    //                 when the page itself is on an HTTP origin.
    //
    // Expose globals so React can read install state.
    window.__pwa = { isFileProtocol: location.protocol === "file:", installPrompt: null, swOk: false };

    (function pwaSetup() {
      const base = location.pathname.replace(/\/[^/]*$/, "/") || "/";
      const origin = location.origin;
      const fullBase = origin + base;

      // ── 1. Manifest via data: URI (works on HTTP origins) ──────────────────
      const mkIcon = (size, rx) => {
        const fs = Math.floor(size * 0.625), y = Math.floor(size * 0.73);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" rx="${rx}" fill="#07090c"/><text x="${size/2}" y="${y}" font-size="${fs}" text-anchor="middle" fill="#06b6d4" font-weight="900" font-family="monospace">J</text></svg>`;
        return { src:"data:image/svg+xml;base64,"+btoa(svg), sizes:`${size}x${size}`, type:"image/svg+xml", purpose:"maskable any" };
      };
      const isMobile = window.innerWidth < 768;
      const manifest = {
        name:"Jules Agent Client", short_name:"Jules",
        description:"Monitor and control Jules AI coding sessions",
        start_url: fullBase,
        scope: base,
        display:"standalone", background_color:"#07090c", theme_color:"#0891b2",
        orientation: isMobile ? "portrait" : "landscape",
        categories:["developer","productivity"],
        icons:[ mkIcon(192,24), mkIcon(512,64) ],
      };
      // data: URI — Chrome validates manifests here starting Chromium 93
      const manifestJSON = JSON.stringify(manifest);
      const manifestURI  = "data:application/manifest+json," + encodeURIComponent(manifestJSON);
      const lnk = document.createElement("link");
      lnk.rel = "manifest"; lnk.href = manifestURI;
      document.head.appendChild(lnk);

      // ── 2. Service Worker ──────────────────────────────────────────────────
      // SW registered from a blob: URL is rejected by Chrome's PWA checker.
      // Instead we write the SW source into a tiny JavaScript data: URL and
      // register it — Chrome 91+ allows data: SW registration when the page
      // is on a secure origin (https / localhost).
      // Try to lock orientation if in standalone mode
      if (window.matchMedia('(display-mode: standalone)').matches && screen.orientation && screen.orientation.lock) {
        screen.orientation.lock(isMobile ? "portrait" : "landscape").catch(() => {});
      }

      if ("serviceWorker" in navigator && !window.__pwa.isFileProtocol) {
        const swSrc = [
          'const C="jules-v5";',
          'const PRE=["https://unpkg.com/react@18/umd/react.production.min.js","https://unpkg.com/react-dom@18/umd/react-dom.production.min.js","https://unpkg.com/@babel/standalone/babel.min.js"];',
          'self.addEventListener("install",e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(PRE).catch(()=>{})));});',
          'self.addEventListener("activate",e=>e.waitUntil(clients.claim()));',
          'self.addEventListener("fetch",e=>{',
          '  const u=e.request.url;',
          '  if(u.includes("jules.googleapis.com"))return;',
          '  if(u.includes("unpkg.com")||u.includes("fonts.googleapis")||u.includes("fonts.gstatic")){',
          '    e.respondWith(caches.match(e.request).then(h=>h||fetch(e.request).then(r=>{',
          '      const cl=r.clone();caches.open(C).then(ca=>ca.put(e.request,cl));return r;',
          '    })));',
          '  }',
          '});',
        ].join("");
        // data: URI SW — same-origin restriction bypassed on secure origins
        const swDataURI = "data:text/javascript;base64," + btoa(swSrc);
        navigator.serviceWorker.register(swDataURI, { scope: base })
          .then(() => { window.__pwa.swOk = true; })
          .catch(() => {
            // Fallback: blob URL (works for caching, not for install prompt)
            const blob = new Blob([swSrc], { type:"text/javascript" });
            navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: base }).catch(()=>{});
          });
      }

      // ── 3. Capture install prompt ──────────────────────────────────────────
      window.addEventListener("beforeinstallprompt", e => {
        e.preventDefault();
        window.__pwa.installPrompt = e;
        // Notify React if it's already mounted
        window.dispatchEvent(new Event("pwa-installable"));
      });
      window.addEventListener("appinstalled", () => {
        window.__pwa.installPrompt = null;
        window.dispatchEvent(new Event("pwa-installed"));
      });
    })();
    </script>
</head>
<body style="margin:0;background:#07090c;height:100%;overflow:hidden;">

<!-- ── Instant splash — renders before ANY JS loads ─────────────────────── -->
<div id="splash">
  <div id="splash-logo">J</div>
  <div id="splash-title">JULES AGENT</div>
  <div id="splash-sub">AI CODING SESSIONS</div>

  <div id="splash-hint">INITIALISING…</div>
  <div id="splash-step"></div>
  <button id="emergency-reset" onclick="handleEmergencyReset()" style="margin-top:30px; display:none; background:rgba(251,113,133,0.1); border:1px solid rgba(251,113,133,0.3); color:#fb7185; padding:8px 16px; border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; cursor:pointer; letter-spacing:0.05em;">EMERGENCY HARD RESET</button>
</div>
<script>
  async function handleEmergencyReset() {
    if (!confirm("This will clear all local data, settings, and cache. Proceed?")) return;
    localStorage.clear();
    sessionStorage.clear();
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    location.reload(true);
  }
</script>

<div id="root"></div>

<!-- ── Progress tracker — updates splash as each dep loads ─────────────── -->
<script>
(function(){
  var hint  = document.getElementById("splash-hint");
  var step  = document.getElementById("splash-step");
  var bar   = document.getElementById("splash-bar");
  var t0    = Date.now();

  function setMsg(h, s, pct) {
    if (hint) hint.textContent = h;
    if (step) step.textContent = s;
    if (bar && pct !== undefined) {
      bar.style.animation = "none";
      bar.style.transition = "width .3s cubic-bezier(.4,0,.2,1)";
      bar.style.width = pct + "%";
    }
  }
  function elapsed() { return ((Date.now()-t0)/1000).toFixed(1)+"s"; }

  // Expose for inline onload handlers below
  window.__splashMsg = setMsg;
  window.__splashElapsed = elapsed;

  // Global error handler to catch failures during boot
  window.addEventListener("error", function(e) {
    var msg = e.message || "Unknown runtime error";
    if (window.__splashMsg) window.__splashMsg("BOOT ERROR", msg.toUpperCase(), 0);
  });

  setMsg("LOADING REACT…", "core library · " + elapsed(), 8);
})();
</script>

<!-- Scripts deferred to end of body so splash paints first -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"
  onload="__splashMsg('LOADING RENDERER…','react-dom · '+__splashElapsed(),30)"

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"

<script type="text/babel" data-presets="env,react">
// Signal that Babel compilation is done and React is about to mount
if (window.__splashMsg) __splashMsg("MOUNTING APP…", "building component tree · " + __splashElapsed(), 90);

// Strict dependency check before proceeding
(function checkDeps() {
  const deps = { React: typeof React, ReactDOM: typeof ReactDOM };
  console.log('[Boot] Checking dependencies:', deps);
  if (deps.React === 'undefined' || deps.ReactDOM === 'undefined') {
    throw new Error('Critical dependencies missing: ' + JSON.stringify(deps));
  }
})();

const { useState, useEffect, useRef, useCallback, useMemo, memo } = React;

// ─── Options & Configurations ────────────────────────────────────────────────
// Configurable poll intervals (ms). 0 = manual-only.
const POLL_OPTIONS = [
  { label:"OFF",  ms:0      },
  { label:"10s",  ms:10000  },
  { label:"30s",  ms:30000  },
  { label:"1m",   ms:60000  },
  { label:"2m",   ms:120000 },
  { label:"5m",   ms:300000 },
  { label:"10m",  ms:600000 },
];
const DEFAULT_POLL_MS = 30000;

// Session list limits
const LIMIT_OPTIONS = [
  { label:"10",  val:10  },
  { label:"20",  val:20  },
  { label:"50",  val:50  },
  { label:"100", val:100 },
  { label:"250", val:250 },
];
const DEFAULT_LIMIT = 50;

const DEFAULT_CACHE_LIMIT = 5;

const ACTIVITY_LIMIT_OPTIONS = [
  { label:"50",  val:50  },
  { label:"100", val:100 },
  { label:"200", val:200 },
  { label:"500", val:500 },
];
const DEFAULT_ACTIVITY_LIMIT = 100;

// ─── Safe Storage Service ────────────────────────────────────────────────────
const SafeStorage = {
  // ─── KEYS ──────────────────────────────────────────────────────────────────
  KEYS: {
    NOTIFY: "jac_notifications",
    POLL: "jac_poll_ms",
    ACT_POLL: "jac_act_poll_ms",
    ACTIVE_POLL: "jac_active_poll_ms",
    LIMIT: "jac_limit",
    CACHE_LIMIT: "jac_cache_limit",
    ACTIVITY_LIMIT: "jac_activity_limit",
    PLAN: "jac_plan",
    CUSTOM_DAILY: "jac_custom_daily",
    PERSONA_PROMPTS: "jac_persona_prompts",
    CUSTOM_PERSONAS: "jac_custom_personas",
    NET_STATS: "jac_net_stats",
    NS_DRAFT: "jac_ns_draft",
    REPO_STATS: "jac_repo_stats",
    LAST_SOURCE: "jac_last_source",
    LAST_BRANCHES: "jac_last_branches",
    ACT_MAP: "jac_act_map",
    ACT_STATS: "jac_act_stats",
    SESSION_CACHE: "jac_session_cache",
    DRAFTS_BOX: "jac_drafts_box",
    SESSION_REGISTRY: "jac_session_registry",
    ARCHIVED: "jac_archived",
    IGNORED: "jac_ignored",
    READ_MAP: "jac_read_map",
    API_KEY: "jac_key",
    API_TIMEOUT: "jac_api_timeout",
    GITHUB_TOKEN: "jac_github_token",
  },

  // ─── CORE GENERIC HELPERS ──────────────────────────────────────────────────
  getItem(key, fallback = null) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? v : fallback;
    } catch {
      return fallback;
    }
  },

  setItem(key, val) {
    try {
      localStorage.setItem(key, val);
      return true;
    } catch {
      return false;
    }
  },

  removeItem(key) {
    try {
      localStorage.removeItem(key);
      return true;
    } catch {
      return false;
    }
  },

  getJSON(key, fallback = null) {
    try {
      const v = localStorage.getItem(key);
      if (v === null) return fallback;
      const parsed = JSON.parse(v);
      if (fallback !== null) {
        if (Array.isArray(fallback)) {
          if (!Array.isArray(parsed)) return fallback;
        } else if (typeof fallback === 'object') {
          if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) return fallback;
        } else if (typeof parsed !== typeof fallback) {
          return fallback;
        }
      }
      return parsed;
    } catch {
      return fallback;
    }
  },

  setJSON(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch {
      return false;
    }
  },

  // ─── SPECIFIC GETTERS / SETTERS ────────────────────────────────────────────
  loadNotify() {
    return this.getItem(this.KEYS.NOTIFY) === "1";
  },
  saveNotify(v) {
    this.setItem(this.KEYS.NOTIFY, v ? "1" : "0");
  },

  loadPollMs() {
    try {
      const v = parseInt(this.getItem(this.KEYS.POLL));
      return POLL_OPTIONS.some(o => o.ms === v) ? v : DEFAULT_POLL_MS;
    } catch {
      return DEFAULT_POLL_MS;
    }
  },
  savePollMs(ms) {
    this.setItem(this.KEYS.POLL, ms);
  },

  loadActPollMs() {
    try {
      const v = parseInt(this.getItem(this.KEYS.ACT_POLL));
      return POLL_OPTIONS.some(o => o.ms === v) ? v : DEFAULT_POLL_MS;
    } catch {
      return DEFAULT_POLL_MS;
    }
  },
  saveActPollMs(ms) {
    this.setItem(this.KEYS.ACT_POLL, ms);
  },

  loadActivePollMs() {
    try {
      const v = parseInt(this.getItem(this.KEYS.ACTIVE_POLL));
      return POLL_OPTIONS.some(o => o.ms === v) ? v : 10000;
    } catch {
      return 10000;
    }
  },
  saveActivePollMs(ms) {
    this.setItem(this.KEYS.ACTIVE_POLL, ms);
  },

  loadApiTimeout() {
    try {
      const v = parseInt(this.getItem(this.KEYS.API_TIMEOUT));
      return [15000, 30000, 60000, 120000].includes(v) ? v : 30000;
    } catch {
      return 30000;
    }
  },
  saveApiTimeout(ms) {
    this.setItem(this.KEYS.API_TIMEOUT, ms);
  },

  loadCacheLimit() {
    try {
      const v = parseInt(this.getItem(this.KEYS.CACHE_LIMIT));
      return isNaN(v) ? DEFAULT_CACHE_LIMIT : v;
    } catch {
      return DEFAULT_CACHE_LIMIT;
    }
  },
  saveCacheLimit(v) {
    this.setItem(this.KEYS.CACHE_LIMIT, v);
  },

  loadActivityLimit() {
    try {
      const v = parseInt(this.getItem(this.KEYS.ACTIVITY_LIMIT));
      return ACTIVITY_LIMIT_OPTIONS.some(o => o.val === v) ? v : DEFAULT_ACTIVITY_LIMIT;
    } catch {
      return DEFAULT_ACTIVITY_LIMIT;
    }
  },
  saveActivityLimit(v) {
    this.setItem(this.KEYS.ACTIVITY_LIMIT, v);
  },

  loadLimit() {
    try {
      const v = parseInt(this.getItem(this.KEYS.LIMIT));
      return LIMIT_OPTIONS.some(o => o.val === v) ? v : DEFAULT_LIMIT;
    } catch {
      return DEFAULT_LIMIT;
    }
  },
  saveLimit(v) {
    this.setItem(this.KEYS.LIMIT, v);
  },

  loadPlan() {
    return this.getItem(this.KEYS.PLAN, "free");
  },
  savePlan(id) {
    this.setItem(this.KEYS.PLAN, id);
  },

  loadCustomDaily() {
    try {
      return parseInt(this.getItem(this.KEYS.CUSTOM_DAILY)) || 50;
    } catch {
      return 50;
    }
  },
  saveCustomDaily(v) {
    this.setItem(this.KEYS.CUSTOM_DAILY, v);
  },

  loadPersonas() {
    try {
      const saved = this.getJSON(this.KEYS.PERSONA_PROMPTS, {});
      const custom = this.getJSON(this.KEYS.CUSTOM_PERSONAS, []);
      const mergedDefaults = DEFAULT_PERSONAS.map(p => ({
        ...p,
        prompt: saved[p.id] || p.prompt
      }));
      return [...mergedDefaults, ...custom.map(c => ({ ...c, isCustom: true }))];
    } catch {
      return DEFAULT_PERSONAS;
    }
  },
  savePersonaPrompt(id, prompt) {
    try {
      const saved = this.getJSON(this.KEYS.PERSONA_PROMPTS, {});
      saved[id] = prompt;
      this.setJSON(this.KEYS.PERSONA_PROMPTS, saved);
    } catch {}
  },
  saveCustomPersona(persona) {
    try {
      const custom = this.getJSON(this.KEYS.CUSTOM_PERSONAS, []);
      const index = custom.findIndex(p => p.id === persona.id);
      if (index >= 0) {
        custom[index] = { ...custom[index], ...persona };
      } else {
        custom.push(persona);
      }
      this.setJSON(this.KEYS.CUSTOM_PERSONAS, custom);
    } catch {}
  },
  deleteCustomPersona(id) {
    try {
      const custom = this.getJSON(this.KEYS.CUSTOM_PERSONAS, []);
      const filtered = custom.filter(p => p.id !== id);
      this.setJSON(this.KEYS.CUSTOM_PERSONAS, filtered);
    } catch {}
  },
  resetPersonas() {
    this.removeItem(this.KEYS.PERSONA_PROMPTS);
    this.removeItem(this.KEYS.CUSTOM_PERSONAS);
    return DEFAULT_PERSONAS;
  },

  loadNetStats() {
    return this.getJSON(this.KEYS.NET_STATS, { overall: { in: 0, out: 0 }, daily: {} });
  },
  saveNetStats(stats) {
    this.setJSON(this.KEYS.NET_STATS, stats);
  },

  loadDraft() {
    return this.getJSON(this.KEYS.NS_DRAFT);
  },
  saveDraft(d) {
    this.setJSON(this.KEYS.NS_DRAFT, d);
  },
  clearDraft() {
    this.removeItem(this.KEYS.NS_DRAFT);
  },

  loadRepoStats() {
    return this.getJSON(this.KEYS.REPO_STATS, {});
  },
  saveRepoStats(stats) {
    this.setJSON(this.KEYS.REPO_STATS, stats);

function requestNotificationPermission() {
  if (!("Notification" in window)) return Promise.resolve(false);
  if (Notification.permission === "granted") return Promise.resolve(true);
  return Notification.requestPermission().then(p => p === "granted");
}

async function sendNotification(title, body, tag) {
  if (!loadNotify() || !("Notification" in window) || Notification.permission !== "granted") return;
  const icon = "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2307090c%22/><text y=%22.9em%22 x=%2250%25%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22%2306b6d4%22 font-family=%22monospace%22 font-weight=%22900%22>J</text></svg>";

  // Try SW notification first (more robust in mobile/background)
  if ("serviceWorker" in navigator) {
    try {
      const reg = await navigator.serviceWorker.ready;
      if (reg && reg.showNotification) {
        await reg.showNotification(title, { body, tag, icon });
        return;
      }
    } catch (e) { console.warn("[Notify] SW notification failed, falling back", e); }
  }

  // Fallback to standard Notification constructor
  try {
    new Notification(title, { body, tag, icon });
  } catch (e) {
    console.error("[Notify] Notification constructor failed", e);
  }
}

  return regex.test(key);
};

const isValidGithubToken = (token) => {
  if (!token) return true;
  if (typeof token !== "string") return false;
  const regex = /^[\x21-\x7E]+$/;
  return regex.test(token);
};

const isValidGitBranchName = (name) => {
  if (!name) return true;
  if (typeof name !== "string") return false;
  if (name.length > 250) return false;
  // Git branch names cannot start with a hyphen '-' (mitigating down-stream command argument/flag injection)
  // or start/end with a dot '.' (per standard git reference naming safety).
  if (name.startsWith("-") || name.startsWith(".") || name.endsWith(".")) return false;
  if (name.startsWith("/") || name.endsWith("/") || name.includes("//") || /\s/.test(name)) return false;
  if (name.includes("..")) return false;
  const invalidChars = /[~^:\?\*\[\\]|@\{/;
  if (invalidChars.test(name)) return false;
  if (name.endsWith(".lock")) return false;
  if (name === "@") return false;
  return true;
};

const safeUrl = (url) => {
  if (!url) return "#";
  try {
    const parsed = new URL(url);
    if (parsed.protocol === "http:" || parsed.protocol === "https:") {
      return url;
    }
  } catch (e) {}
  return "#";
};

// ─── Performance Helpers ─────────────────────────────────────────────────────
// Global WeakMap to cache byte size calculations for reference-stable, non-array objects.
// This prevents redundant recursive traversal overhead, making repeat size checks O(1).
// We do not cache arrays to avoid potential stale values if an array reference is mutated.
const approxBytesCache = new WeakMap();

// Bounded WeakMap cache for computing aggregate byte sizes of reference-stable immutable activities arrays.
// Caching at the array reference level avoids O(N) array traversals across render loops and cache-key generations.
const ACTIVITIES_SIZE_CACHE = new WeakMap();

const getActivitiesSize = (activities) => {
  if (!activities || !Array.isArray(activities)) return 0;
  const cached = ACTIVITIES_SIZE_CACHE.get(activities);
  if (cached !== undefined) return cached;
  const size = getApproxBytes(activities);
  ACTIVITIES_SIZE_CACHE.set(activities, size);
  return size;
};

// Calculates the approximate byte size of any object recursively/iteratively
// without slow serialization (JSON.stringify) or heavy binary array conversions.
const getApproxBytes = (val) => {
  if (val === null || val === undefined) return 0;
  const type = typeof val;
  if (type === "string") return val.length;
  if (type === "number") return 8;
  if (type === "boolean") return 4;
  if (type === "object") {
    const isArr = Array.isArray(val);
    if (!isArr && val !== null && approxBytesCache.has(val)) {
      return approxBytesCache.get(val);
    }
    let size = 0;
    if (isArr) {
      for (let i = 0; i < val.length; i++) {
        size += getApproxBytes(val[i]);
      }
    } else {
      for (const k in val) {
        if (Object.prototype.hasOwnProperty.call(val, k)) {
          size += k.length + getApproxBytes(val[k]);
        }
      }
      if (val !== null) {
        approxBytesCache.set(val, size);
      }
    }
    return size;
  }
  return 0;
};

// Fast deep equality check that avoids costly stringification (JSON.stringify)
// and handles early exit on primitive or property mismatch.
const fastDeepEqual = (a, b) => {
  if (a === b) return true;
  if (typeof a !== "object" || a === null || typeof b !== "object" || b === null) {
    return false;
  }
  const isArrA = Array.isArray(a);
  const isArrB = Array.isArray(b);
  if (isArrA !== isArrB) return false;
  if (isArrA) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (!fastDeepEqual(a[i], b[i])) return false;
    }
    return true;
  }
  const keysA = Object.keys(a);
  const keysB = Object.keys(b);
  if (keysA.length !== keysB.length) return false;
  for (let i = 0; i < keysA.length; i++) {
    const key = keysA[i];
    if (!Object.prototype.hasOwnProperty.call(b, key) || !fastDeepEqual(a[key], b[key])) {
      return false;
    }
  }
  return true;
};

async function clearCacheOnly() {
  if (!confirm("Clear Service Worker cache? This will redownload all assets on next load.")) return;
  try {
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    alert("Cache cleared.");
  } catch (err) { alert("Error: " + err.message); }
}

  if (!confirm("Clear all settings, keys, and session data? You will be logged out.")) return;

async function resetApp() {
  if (!confirm("FULL RESET: Clear all local data, settings, and cache?")) return;
  try {
    localStorage.clear();
    sessionStorage.clear();
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    location.reload(true);
  } catch (err) {
    alert("Error: " + err.message);
    location.reload();
  }
}

async function getStorageInfo() {
  let used = 0, quota = 0, cache = 0, local = 0;

  // 1. LocalStorage Estimation
  try {
    let str = "";
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      str += k + localStorage.getItem(k);
    }
    local = str.length * 2; // UTF-16 characters are 2 bytes
  } catch (err) { console.warn("[Storage] LocalStorage estimate failed", err); }

  // 2. Navigator Storage API
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      used = est.usage || 0;
      quota = est.quota || 0;
      if (est.usageDetails && est.usageDetails.caches) {
        cache = est.usageDetails.caches;
      }
    }
  } catch (err) { console.warn("[Storage] Estimate API failed", err); }

  // 3. Manual Cache Fallback (for browsers without usageDetails)
  if (cache === 0 && "caches" in window) {
    try {
      const keys = await caches.keys();
      for (const key of keys) {
        const c = await caches.open(key);
        const reqs = await c.keys();
        for (const r of reqs) {
          const res = await c.match(r);
          if (res) {
            const cl = res.headers.get("content-length");
            if (cl) cache += parseInt(cl, 10);
            // Note: Opaque responses will have 0 content-length and cannot be measured here.
          }
        }
      }
    } catch (err) { console.warn("[Storage] Manual cache scan failed", err); }
  }

  // Final adjusted total (API used often doesn't include localStorage)
  const totalUsed = Math.max(used, cache) + local;

  return { used: totalUsed, quota, cache, local };
}

  if (p === "/sessions" || p.startsWith("/sessions?") || l.includes("sessions") || l.includes("supp ")) {
    return "Sessions List Sync";
  }
  if (p.includes("/sources") || l.includes("sources") || l.includes("list sources")) {
    return "Repo & Branch Queries";
  }
  return "Session Metadata & Actions";
}

// ─── Network tracker ──────────────────────────────────────────────────────────
function makeNetTracker() {
  const initial = SafeStorage.loadNetStats();

  const sessionStart = Date.now();
  let sessionUsage = { in: 0, out: 0 };
  let stats = initial;
  let log = [];
  const subs = [];

  if (!stats.overallBuckets) stats.overallBuckets = {};
  if (!stats.dailyBuckets) stats.dailyBuckets = {};

  const save = () => {
    SafeStorage.saveNetStats(stats);
  };

  const getUsage = () => {
    const now = new Date();
    const todayKey = now.toISOString().split("T")[0];
    const monthKey = todayKey.slice(0, 7);

    const today = stats.daily[todayKey] || { in: 0, out: 0 };
    const month = { in: 0, out: 0 };
    Object.entries(stats.daily).forEach(([date, val]) => {
      if (date.startsWith(monthKey)) {
        month.in += val.in || 0;
        month.out += val.out || 0;
      }
    });

    const sessionDurationMs = now.getTime() - sessionStart;
    const h = Math.floor(sessionDurationMs / 3600000);
    const m = Math.floor((sessionDurationMs % 3600000) / 60000);
    const s = Math.floor((sessionDurationMs % 60000) / 1000);
    const duration = h > 0 ? `${h}h ${m}m ${s}s` : m > 0 ? `${m}m ${s}s` : `${s}s`;

    return { today, month, overall: stats.overall, session: sessionUsage, duration };
  };

  const getBuckets = () => {
    const now = new Date();
    const todayKey = now.toISOString().split("T")[0];
    const monthKey = todayKey.slice(0, 7);

    const bucketsToday = {};
    const bucketsMonth = {};
    const bucketsOverall = {};

    const categories = [
      "Session Polling & Activities",
      "Sessions List Sync",
      "Repo & Branch Queries",
      "Chat & User Messages",
      "Session Metadata & Actions"
    ];

    categories.forEach(c => {
      bucketsToday[c] = { in: 0, out: 0, total: 0 };
      bucketsMonth[c] = { in: 0, out: 0, total: 0 };
      bucketsOverall[c] = { in: 0, out: 0, total: 0 };
    });

    if (stats.overallBuckets) {
      Object.entries(stats.overallBuckets).forEach(([cat, val]) => {
        const c = categories.includes(cat) ? cat : "Session Metadata & Actions";
        bucketsOverall[c].in += val.in || 0;
        bucketsOverall[c].out += val.out || 0;
        bucketsOverall[c].total += (val.in || 0) + (val.out || 0);
      });
    }

    if (stats.dailyBuckets) {
      Object.entries(stats.dailyBuckets).forEach(([date, dayBuckets]) => {
        const isToday = (date === todayKey);
        const isMonth = date.startsWith(monthKey);

        if (dayBuckets) {
          Object.entries(dayBuckets).forEach(([cat, val]) => {
            const c = categories.includes(cat) ? cat : "Session Metadata & Actions";
            if (isToday) {
              bucketsToday[c].in += val.in || 0;
              bucketsToday[c].out += val.out || 0;
              bucketsToday[c].total += (val.in || 0) + (val.out || 0);
            }
            if (isMonth) {
              bucketsMonth[c].in += val.in || 0;
              bucketsMonth[c].out += val.out || 0;
              bucketsMonth[c].total += (val.in || 0) + (val.out || 0);
            }
          });
        }
      });
    }

    // Fallback if empty but overall stats exist
    const hasOverall = Object.values(bucketsOverall).some(b => b.total > 0);
    if (!hasOverall && (stats.overall.in > 0 || stats.overall.out > 0)) {
      bucketsOverall["Session Polling & Activities"] = {
        in: stats.overall.in,
        out: stats.overall.out,
        total: stats.overall.in + stats.overall.out
      };
      const todayTotal = (stats.daily[todayKey]?.in || 0) + (stats.daily[todayKey]?.out || 0);
      if (todayTotal > 0) {
        bucketsToday["Session Polling & Activities"] = {
          in: stats.daily[todayKey].in,
          out: stats.daily[todayKey].out,
          total: todayTotal
        };
      }
      let monthIn = 0, monthOut = 0;
      Object.entries(stats.daily).forEach(([date, val]) => {
        if (date.startsWith(monthKey)) {
          monthIn += val.in || 0;
          monthOut += val.out || 0;
        }
      });
      if (monthIn + monthOut > 0) {
        bucketsMonth["Session Polling & Activities"] = {
          in: monthIn,
          out: monthOut,
          total: monthIn + monthOut
        };
      }
    }

    const computeShares = (buckets) => {
      const totalAll = Object.values(buckets).reduce((sum, b) => sum + b.total, 0);
      return Object.entries(buckets).map(([name, data]) => {
        const pct = totalAll > 0 ? (data.total / totalAll) * 100 : 0;
        return { name, ...data, pct };
      }).sort((a, b) => b.total - a.total);
    };

    return {
      today: computeShares(bucketsToday),
      month: computeShares(bucketsMonth),
      overall: computeShares(bucketsOverall)
    };
  };

  const notify = () => {
    const usage = getUsage();
    const buckets = getBuckets();
    subs.forEach(f => f({
      ...usage,
      buckets,
      total: usage.overall.in + usage.overall.out,
      totalIn: usage.overall.in,
      totalOut: usage.overall.out,
      log: [...log]
    }));
  };

  return {
    record(label, bytesIn, bytesOut, status) {
      const now = new Date();
      const todayKey = now.toISOString().split("T")[0];
      const category = getBucketCategory(label, label);

      if (!stats.daily[todayKey]) stats.daily[todayKey] = { in: 0, out: 0 };
      stats.daily[todayKey].in += bytesIn;
      stats.daily[todayKey].out += bytesOut;
      stats.overall.in += bytesIn;
      stats.overall.out += bytesOut;
      sessionUsage.in += bytesIn;
      sessionUsage.out += bytesOut;

      if (!stats.overallBuckets) stats.overallBuckets = {};
      if (!stats.overallBuckets[category]) stats.overallBuckets[category] = { in: 0, out: 0 };
      stats.overallBuckets[category].in += bytesIn;
      stats.overallBuckets[category].out += bytesOut;

      if (!stats.dailyBuckets) stats.dailyBuckets = {};
      if (!stats.dailyBuckets[todayKey]) stats.dailyBuckets[todayKey] = {};
      if (!stats.dailyBuckets[todayKey][category]) stats.dailyBuckets[todayKey][category] = { in: 0, out: 0 };
      stats.dailyBuckets[todayKey][category].in += bytesIn;
      stats.dailyBuckets[todayKey][category].out += bytesOut;

      // Keep only last 60 days of daily stats
      const dailyKeys = Object.keys(stats.daily).sort();
      if (dailyKeys.length > 60) {
        const oldestKey = dailyKeys[0];
        delete stats.daily[oldestKey];
        if (stats.dailyBuckets) delete stats.dailyBuckets[oldestKey];
      }

      log.unshift({ id: Math.random(), label, bytesIn, bytesOut, status, ts: now.getTime() });
      if (log.length > 80) log.length = 80;

      save();
      notify();
    },
    subscribe(fn) { subs.push(fn); return () => { const i = subs.indexOf(fn); if (i > -1) subs.splice(i, 1); }; },
    snapshot() {
      const usage = getUsage();
      const buckets = getBuckets();
      return {
        ...usage,
        buckets,
        total: usage.overall.in + usage.overall.out,
        totalIn: usage.overall.in,
        totalOut: usage.overall.out,
        log: [...log]
      };
    },
  };
}
const NET = makeNetTracker();

let quotaRetryAfter = 0;
let lastQuotaError = null;
const QUOTA_ERROR_CODES = [429, 403];

async function apiCall(apiKey, path, opts={}) {
  // Defensive validation of API key format
  if (apiKey && !isValidGoogleApiKey(apiKey)) {
    throw new Error("Invalid API key.");
  }
  const now = Date.now();
  if (quotaRetryAfter > now) {
    const waitSec = Math.ceil((quotaRetryAfter - now) / 1000);
    const err = new Error(`Quota or temporary service error. Please wait ${waitSec}s before retrying.`);
    err.status = 503;
    throw err;
  }

  const url = `${BASE}${path}`;
  const body = opts.body ? JSON.stringify(opts.body) : undefined;
  const headers = { "x-goog-api-key": apiKey, ...(opts.headers || {}) };
  if (body) {
    headers["Content-Type"] = "application/json";
  }

  // Estimate outgoing bytes (method + url + headers + body)
  const outBytes = (opts.method || "GET").length + url.length + JSON.stringify(headers).length + (body?.length || 0);

  let res;
  const attempts = 3;
  let attempt = 0;

  while (attempt < attempts) {
    attempt++;

    // Implement a defensive request timeout to prevent client resource exhaustion and hanging socket connections
    const controller = new AbortController();
    const timeoutMs = opts.timeout || loadApiTimeout(); // default configured timeout
    let timedOut = false;
    const timeoutId = setTimeout(() => {
      timedOut = true;
      controller.abort();
    }, timeoutMs);

    let removeAbortListener = null;
    if (opts.signal) {
      if (opts.signal.aborted) {
        controller.abort();
      } else {
        const onAbort = () => controller.abort();
        opts.signal.addEventListener('abort', onAbort);
        removeAbortListener = () => opts.signal.removeEventListener('abort', onAbort);
      }
    }

    try {
      res = await fetch(url, { ...opts, headers, body, signal: controller.signal });
      if (removeAbortListener) removeAbortListener();
      clearTimeout(timeoutId);
      break; // Success! Exit retry loop
    } catch (err) {
      if (removeAbortListener) removeAbortListener();
      clearTimeout(timeoutId);

      if (err.name === 'AbortError') {
        if (timedOut) {
          throw new Error(`API request timed out after ${timeoutMs}ms`);
        }
        const abortErr = new Error("The user aborted a request.");
        abortErr.name = "AbortError";
        throw abortErr;
      }

      if (err instanceof TypeError) {
        if (attempt < attempts) {
          const delay = attempt * 500;
          console.warn(`[apiCall] Transient network failure on attempt ${attempt}. Retrying in ${delay}ms...`, err);
          await new Promise(resolve => setTimeout(resolve, delay));
          continue;
        }
        throw new Error("Network or CORS request failed. Please check your network connection, API key validity, or if CORS restrictions are active.");
      }
      throw err;
    }
  }

  let text = "";
  let headerSize = 0;
  res.headers.forEach((v, k) => headerSize += k.length + v.length + 4);

  if (opts.onProgress && res.body) {
    const reader = res.body.getReader();
    const contentLength = +res.headers.get("Content-Length") || 0;
    let receivedLength = 0;
    const chunks = [];

    while (true) {
      const {done, value} = await reader.read();
      if (done) {
        // Guarantee 100% progress completion at the end of stream
        opts.onProgress({ loaded: receivedLength, total: receivedLength });
        break;
      }
      chunks.push(value);
      receivedLength += value.length;
      opts.onProgress({ loaded: receivedLength, total: contentLength });
    }

    const all = new Uint8Array(receivedLength);
    let pos = 0;
    for (let c of chunks) { all.set(c, pos); pos += c.length; }
    text = new TextDecoder().decode(all);
  } else {
    text = await res.text();
  }

  const inBytes = headerSize + new TextEncoder().encode(text).length;
  NET.record(opts._label || path, inBytes / 1024, outBytes / 1024, res.status);

  if (!res.ok) {
    let msg = text;
    try { msg = JSON.parse(text)?.error?.message || text; } catch {}

    const isQuotaError = res.status === 429 || (res.status === 403 && /quota|limit|exceeded|exhausted/i.test(msg));
    if (isQuotaError) {
      const retryAfterHeader = res.headers.get('Retry-After');
      const parsed = retryAfterHeader ? parseInt(retryAfterHeader, 10) : NaN;
      const waitSec = Number.isFinite(parsed) ? parsed : 60;
      quotaRetryAfter = Date.now() + (waitSec * 1000);
      lastQuotaError = { status: res.status, msg, at: new Date() };

      try {
        window.dispatchEvent(new CustomEvent('quota-error', {
          detail: { retryAfter: quotaRetryAfter, msg, status: res.status }
        }));
      } catch (e) {
        console.error("Failed to dispatch quota-error event:", e);
      }
    }

    throw new Error(`${res.status}: ${msg}`);
  }

  // Reset quota on success
  quotaRetryAfter = 0;
  return text ? JSON.parse(text) : {};
}

// ─── Utils ────────────────────────────────────────────────────────────────────
class LRUCache {
  constructor(maxSize = 500) {
    this.map = new Map();
    this.maxSize = maxSize;
  }
  get(key) {
    if (!this.map.has(key)) return null;
    const val = this.map.get(key);
    this.map.delete(key);
    this.map.set(key, val);
    return val;
  }
  set(key, val) {
    if (this.map.has(key)) this.map.delete(key);
    this.map.set(key, val);
    if (this.map.size > this.maxSize) {
      const oldestKey = this.map.keys().next().value;
      this.map.delete(oldestKey);
    }
  }
  has(key) {
    return this.map.has(key);
  }
  delete(key) {
    return this.map.delete(key);
  }
  clear() {
    this.map.clear();
  }
  get size() {
    return this.map.size;
  }
}

const fmtBytes = b => b<1?`${(b*1024).toFixed(0)}B`:b<1024?`${b.toFixed(1)}KB`:`${(b/1024).toFixed(2)}MB`;
const fmtChars = n => n<1000?`${n}c`: `${(n/1000).toFixed(1)}kc`;
const safeSlice = (str, limit) => {
  if (!str) return "";
  const chars = Array.from(str);
  if (chars.length <= limit) return str;
  return chars.slice(0, limit).join("");
};


/**
 * GitHubTracker encapsulating all GitHub integrations, caches, background fetches,
 * and text-scraping to prevent "God Mode" and separate background external integrations
 * from the core UI rendering/logic inside index.html.
 */
const GitHubTracker = {
  // Caches
  PR_CACHE: new LRUCache(500),
  PR_INFO_CACHE: new LRUCache(500),
  GH_STATE_CACHE: new Map(),
  GH_IN_FLIGHT: new Set(),
  GH_BRANCH_STATE_CACHE: new Map(),
  GH_BRANCH_IN_FLIGHT: new Set(),
  CHECK_ACTIVITY_CACHE: new WeakMap(),
  CHECK_STATUS_ARRAY_CACHE: new WeakMap(),
  BRANCH_INFO_CACHE: new LRUCache(500),
  BRANCH_ACTIVITY_CACHE: new WeakMap(),

  // Regex Configurations
  GH_PR_RE: /https:\/\/github\.com\/[^\/]+\/[^\/]+\/pull\/(\d+)/,
  CHECK_URL_RE: /https:\/\/github\.com\/[^\/]+\/[^\/]+\/(?:actions\/runs|deployments|actions)\/\d*/,
  PUSH_RE: /push(?:ing|ed).* to (?:the |a )?([^\s\.\(\)\`]+)/i,
  BRANCH_RE: /branch (?:named )?([^\s\.\(\)\`]+)/i,
  CREATE_BRANCH_RE: /created.* branch ([^\s\.\(\)\`]+)/i,
  TREE_LINK_RE: /https:\/\/github\.com\/[^\/]+\/[^\/]+\/tree\/([a-zA-Z0-9\-_]+)/,
  BRANCH_LINK_RE: /https:\/\/github\.com\/[^\/]+\/[^\/]+\/branches\/([a-zA-Z0-9\-_]+)/,
  COMPARE_LINK_RE: /https:\/\/github\.com\/[^\/]+\/[^\/]+\/compare\/[^\.]+\.\.\.([a-zA-Z0-9\-_]+)/,
  PR_REPO_RE: /https:\/\/github\.com\/([^\/]+\/[^\/]+)\/pull/,

  // Internal Helpers
  getPrUrlAndNumber(pr) {
    if (!pr) return null;
    if (typeof pr === 'string') {
      const m = pr.match(this.GH_PR_RE);
      if (m) return { url: pr, number: m[1] };
    }
    if (typeof pr === 'object') {
      const url = pr.url || pr.pullRequestUrl || pr.prUrl || pr.htmlUrl || pr.html_url || pr.pr_url;
      if (url) {
        return { ...pr, url, number: pr.number || url.split("/").pop() };
      }
    }
    return null;
  },

  findInOutputs(outputs) {
    if (!outputs || !Array.isArray(outputs)) return null;
    for (let i = 0; i < outputs.length; i++) {
      const o = outputs[i];
      if (o.githubPullRequest) {
        const pr = this.getPrUrlAndNumber(o.githubPullRequest);
        if (pr) return pr;
      }
      if (o.pullRequest) {
        const pr = this.getPrUrlAndNumber(o.pullRequest);
        if (pr) return pr;
      }
      if (o.pr) {
        const pr = this.getPrUrlAndNumber(o.pr);
        if (pr) return pr;
      }
      const u = o.pullRequestUrl || o.prUrl || o.url || o.pr_url || o.htmlUrl || o.html_url;
      if (u && typeof u === 'string') return { url: u, number: u.split("/").pop() };
    }
    return null;
  },

  getPR(s) {
    if (!s) return null;
    const sid = s.id || s.name || "temp";
    if (this.PR_CACHE.has(sid)) {
      const cached = this.PR_CACHE.get(sid);
      if (cached) return cached;
    }

    let rawPr = this.findInOutputs(s.outputs) || s.githubPullRequest || s.pullRequest || s.sourceContext?.githubRepoContext?.pullRequest || s.github_pull_request || s.pr || s.prUrl || s.pullRequestUrl || s.htmlUrl || s.html_url;
    const pr = this.getPrUrlAndNumber(rawPr);
    if (pr) {
      if (sid !== "temp") this.PR_CACHE.set(sid, pr);
      return pr;
    }

    let m = null;
    for (const key in s) {
      if (typeof s[key] === 'string') {
        m = s[key].match(this.GH_PR_RE);
        if (m) break;
      }
    }

    if (m) {
      const res = { url: m[0], number: m[1] };
      if (sid !== "temp") this.PR_CACHE.set(sid, res);
      return res;
    }

    return null;
  },

  hasMergeEvidence(activities) {
    if (!activities || activities.length === 0) return false;

    for (let i = 0; i < activities.length; i++) {
      const a = activities[i];
      if (!a) continue;

      const desc = (a.progressUpdated?.description || "").toLowerCase();
      const title = (a.progressUpdated?.title || "").toLowerCase();

      if (desc.includes("merged") ||
          desc.includes("pull request merged") ||
          title.includes("merged")) {
        return true;
      }
    }

    return false;
  },

  githubFetch(url, headers) {
    return fetch(url, { headers }).then(res => {
      if (!res.ok) {
        if ((res.status === 403 || res.status === 429) && res.headers.get("x-ratelimit-remaining") === "0") {
          const resetTime = res.headers.get("x-ratelimit-reset");
          const resetDate = resetTime ? new Date(parseInt(resetTime, 10) * 1000).toLocaleTimeString() : "soon";
          window.dispatchEvent(new CustomEvent("gh-rate-limited", { detail: { resetAt: resetDate } }));
        }
        throw new Error(`Status ${res.status}`);
      }
      return res.json();
    });
  },

  triggerGitHubFetch(url) {
    if (this.GH_IN_FLIGHT.has(url)) return;

    const match = url.match(/https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/pull\/(\d+)/);
    if (!match) return;

    const [_, owner, repo, number] = match;
    this.GH_IN_FLIGHT.add(url);

    const token = SafeStorage.loadGithubToken();
    const headers = {
      "Accept": "application/vnd.github.v3+json"
    };
    if (token && isValidGithubToken(token)) {
      headers["Authorization"] = `token ${token}`;
    }

    this.githubFetch(`https://api.github.com/repos/${owner}/${repo}/pulls/${number}`, headers)
      .then(prData => {
        let state = "open";
        if (prData.merged) state = "merged";
        else if (prData.state === "closed") state = "closed";

        const additions = prData.additions || 0;
        const deletions = prData.deletions || 0;
        const changedFiles = prData.changed_files || 0;
        const commitsCount = prData.commits || 0;
        const title = prData.title || "";
        const body = prData.body || "";

        const baseRef = prData.base?.ref || "main";
        const headRef = prData.head?.ref || "main";
        const headSha = prData.head?.sha || headRef;

        const compareUrl = `https://api.github.com/repos/${owner}/${repo}/compare/${baseRef}...${headRef}`;
        const statusUrl = `https://api.github.com/repos/${owner}/${repo}/commits/${headSha}/status`;
        const checkRunsUrl = `https://api.github.com/repos/${owner}/${repo}/commits/${headSha}/check-runs`;
        const commitsUrl = `https://api.github.com/repos/${owner}/${repo}/pulls/${number}/commits?per_page=10`;

        const fetchCompare = this.githubFetch(compareUrl, headers).catch(() => null);
        const fetchStatus = this.githubFetch(statusUrl, headers).catch(() => null);
        const fetchCheckRuns = this.githubFetch(checkRunsUrl, headers).catch(() => null);
        const fetchCommits = this.githubFetch(commitsUrl, headers).catch(() => []);

        return Promise.all([fetchCompare, fetchStatus, fetchCheckRuns, fetchCommits])
          .then(([compareData, statusData, checkRunsData, commitsData]) => {
            let ahead = 0;
            let behind = 0;
            let statusState = "identical";
            if (compareData) {
              ahead = compareData.ahead_by || 0;
              behind = compareData.behind_by || 0;
              statusState = compareData.status || "identical";
            }

            let finalState = null;
            let finalLabel = "";
            let checkCount = 0;
            let successCount = 0;
            let failureCount = 0;
            let pendingCount = 0;

            if (statusData && statusData.statuses) {
              const st = statusData.state;
              if (st && st !== "pending" && statusData.statuses.length > 0) {
                for (const s of statusData.statuses) {
                  checkCount++;
                  if (s.state === "success") successCount++;
                  else if (s.state === "failure" || s.state === "error") failureCount++;
                  else pendingCount++;
                }
              } else if (st === "pending") {
                pendingCount++;
                checkCount++;
              }
            }

            if (checkRunsData && checkRunsData.check_runs) {
              for (const run of checkRunsData.check_runs) {
                checkCount++;
                if (run.status === "completed") {
                  if (run.conclusion === "success" || run.conclusion === "neutral") successCount++;
                  else if (run.conclusion === "failure" || run.conclusion === "timed_out" || run.conclusion === "action_required") failureCount++;
                  else successCount++;
                } else {
                  pendingCount++;
                }
              }
            }

            if (checkCount > 0) {
              if (failureCount > 0) {
                finalState = "failure";
                finalLabel = `${successCount}/${checkCount} PASSED`;
              } else if (pendingCount > 0) {
                finalState = "pending";
                finalLabel = `${successCount}/${checkCount} RUNNING`;
              } else {
                finalState = "success";
                finalLabel = `${successCount}/${checkCount} PASSED`;
              }
            }

            const commitsList = (Array.isArray(commitsData) ? commitsData : []).map(c => ({
              sha: c.sha ? c.sha.slice(0, 7) : "",
              message: c.commit?.message || "",
              author: c.commit?.author?.name || "",
              date: c.commit?.author?.date || ""
            }));

            const updatedInfo = {
              state,
              additions,
              deletions,
              changedFiles,
              commitsCount,
              title,
              body,
              commitsList,
              ahead,
              behind,
              statusState,
              checks: finalState ? {
                state: finalState,
                label: finalLabel,
                url: checkRunsData?.check_runs?.[0]?.html_url || `https://github.com/${owner}/${repo}/actions`
              } : null,
              fetchedAt: Date.now(),
              failed: false
            };

            GitHubTracker.GH_STATE_CACHE.set(url, updatedInfo);
            GitHubTracker.GH_IN_FLIGHT.delete(url);

            window.dispatchEvent(new CustomEvent("gh-pr-updated", { detail: { url, ...updatedInfo } }));
          });
      })
      .catch(err => {
        console.warn("Error fetching PR metadata from GitHub:", err);
        GitHubTracker.GH_IN_FLIGHT.delete(url);
        GitHubTracker.GH_STATE_CACHE.set(url, {
          state: "open",
          additions: 0,
          deletions: 0,
          changedFiles: 0,
          commitsCount: 0,
          title: "",
          body: "",
          commitsList: [],
          ahead: 0,
          behind: 0,
          statusState: "identical",
          checks: null,
          fetchedAt: Date.now(),
          failed: true,
          errorMsg: err.message
        });
        window.dispatchEvent(new CustomEvent("gh-pr-updated", { detail: { url, failed: true } }));
      });
  },

  triggerGitHubBranchFetch(repo, base, working) {
    if (!repo || !base || !working) return;
    const key = `${repo}:${base}:${working}`;
    if (this.GH_BRANCH_IN_FLIGHT.has(key)) return;

    this.GH_BRANCH_IN_FLIGHT.add(key);

    const token = SafeStorage.loadGithubToken();
    const headers = {
      "Accept": "application/vnd.github.v3+json"
    };
    if (token && isValidGithubToken(token)) {
      headers["Authorization"] = `token ${token}`;
    }

    const compareUrl = `https://api.github.com/repos/${repo}/compare/${base}...${working}`;
    const statusUrl = `https://api.github.com/repos/${repo}/commits/${working}/status`;
    const checkRunsUrl = `https://api.github.com/repos/${repo}/commits/${working}/check-runs`;

    const fetchCompare = this.githubFetch(compareUrl, headers).catch(() => null);
    const fetchStatus = this.githubFetch(statusUrl, headers).catch(() => null);
    const fetchCheckRuns = this.githubFetch(checkRunsUrl, headers).catch(() => null);

    Promise.all([fetchCompare, fetchStatus, fetchCheckRuns])
      .then(([compareData, statusData, checkRunsData]) => {
        let ahead = 0;
        let behind = 0;
        let statusState = "identical";
        if (compareData) {
          ahead = compareData.ahead_by || 0;
          behind = compareData.behind_by || 0;
          statusState = compareData.status || "identical";
        }

        let finalState = null;
        let finalLabel = "";
        let checkCount = 0;
        let successCount = 0;
        let failureCount = 0;
        let pendingCount = 0;

        if (statusData && statusData.statuses) {
          const st = statusData.state;
          if (st && st !== "pending" && statusData.statuses.length > 0) {
            for (const s of statusData.statuses) {
              checkCount++;
              if (s.state === "success") successCount++;
              else if (s.state === "failure" || s.state === "error") failureCount++;
              else pendingCount++;
            }
          } else if (st === "pending") {
            pendingCount++;
            checkCount++;
          }
        }

        if (checkRunsData && checkRunsData.check_runs) {
          for (const run of checkRunsData.check_runs) {
            checkCount++;
            if (run.status === "completed") {
              if (run.conclusion === "success" || run.conclusion === "neutral") successCount++;
              else if (run.conclusion === "failure" || run.conclusion === "timed_out" || run.conclusion === "action_required") failureCount++;
              else successCount++;
            } else {
              pendingCount++;
            }
          }
        }

        if (checkCount > 0) {
          if (failureCount > 0) {
            finalState = "failure";
            finalLabel = `${successCount}/${checkCount} PASSED`;
          } else if (pendingCount > 0) {
            finalState = "pending";
            finalLabel = `${successCount}/${checkCount} RUNNING`;
          } else {
            finalState = "success";
            finalLabel = `${successCount}/${checkCount} PASSED`;
          }
        }

        const updatedInfo = {
          ahead,
          behind,
          statusState,
          checks: finalState ? {
            state: finalState,
            label: finalLabel,
            url: checkRunsData?.check_runs?.[0]?.html_url || `https://github.com/${repo}/actions`
          } : null,
          fetchedAt: Date.now(),
          failed: false
        };

        GitHubTracker.GH_BRANCH_STATE_CACHE.set(key, updatedInfo);
        GitHubTracker.GH_BRANCH_IN_FLIGHT.delete(key);

        window.dispatchEvent(new CustomEvent("gh-pr-updated", { detail: { key, ...updatedInfo } }));
      })
      .catch(err => {
        console.warn("Error fetching Branch metadata from GitHub:", err);
        GitHubTracker.GH_BRANCH_IN_FLIGHT.delete(key);
        GitHubTracker.GH_BRANCH_STATE_CACHE.set(key, {
          ahead: 0,
          behind: 0,
          statusState: "identical",
          checks: null,
          fetchedAt: Date.now(),
          failed: true,
          errorMsg: err.message
        });
        window.dispatchEvent(new CustomEvent("gh-pr-updated", { detail: { key, failed: true } }));
      });
  },

  getPRInfo(s, activities = []) {
    if (!s) return null;

    const sid = s.id || s.name || "temp";
    const actLen = activities.length;
    const size = getActivitiesSize(activities);
    const cacheKey = `${sid}:${actLen}:${size}:${s.updateTime || s.createTime || ""}`;

    if (sid !== "temp" && this.PR_INFO_CACHE.has(cacheKey)) {
      const cached = this.PR_INFO_CACHE.get(cacheKey);
      if (cached && cached.expiresAt && Date.now() < cached.expiresAt) {
        return cached;
      } else if (cached) {
        this.PR_INFO_CACHE.delete(cacheKey);
      }
    }

    const prOnSession = this.getPR(s);
    let pr = prOnSession;

    if (!pr && activities && activities.length > 0) {
      for (let i = activities.length - 1; i >= 0; i--) {
        const a = activities[i];
        let actPR = this.findInOutputs(a.sessionCompleted?.outputs) || this.findInOutputs(a.progressUpdated?.outputs);
        if (!actPR) {
          const rawActPR = a.sessionCompleted?.outputs?.find(o => o.githubPullRequest)?.githubPullRequest ||
                           a.progressUpdated?.outputs?.find(o => o.githubPullRequest)?.githubPullRequest ||
                           a.sessionCompleted?.githubPullRequest || a.progressUpdated?.githubPullRequest ||
                           a.sessionCompleted?.pullRequest || a.progressUpdated?.pullRequest;
          actPR = this.getPrUrlAndNumber(rawActPR);
        }
        if (actPR) {
          pr = actPR;
          break;
        }

        const desc = a.progressUpdated?.description || a.userMessaged?.userMessage || a.agentMessaged?.agentMessage || a.description || "";
        const title = a.progressUpdated?.title || a.title || "";
        const reason = a.sessionFailed?.reason || "";
        const match = desc.match(this.GH_PR_RE);
        if (!match) {
          const matchTitle = title.match(this.GH_PR_RE);
          if (matchTitle) {
            pr = { url: matchTitle[0], number: matchTitle[1] };
            break;
          }
          const matchReason = reason.match(this.GH_PR_RE);
          if (matchReason) {
            pr = { url: matchReason[0], number: matchReason[1] };
            break;
          }
        } else {
          pr = { url: match[0], number: match[1] };
          break;
        }
      }
    }

    if (!pr) {
      return null;
    }

    const isMergedFallback = this.hasMergeEvidence(activities);
    let state = isMergedFallback ? "merged" : "open";
    let additions = 0, deletions = 0, changedFiles = 0, commitsCount = 0;
    let prTitle = "", prBody = "", commitsList = [];
    let ahead = 0, behind = 0, statusState = "identical", checks = null;
    let failed = false;

    const ghCached = this.GH_STATE_CACHE.get(pr.url);
    if (ghCached && (Date.now() - ghCached.fetchedAt < 5 * 60 * 1000)) {
      state = ghCached.state;
      additions = ghCached.additions;
      deletions = ghCached.deletions;
      changedFiles = ghCached.changedFiles;
      commitsCount = ghCached.commitsCount;
      prTitle = ghCached.title;
      prBody = ghCached.body;
      commitsList = ghCached.commitsList;
      ahead = ghCached.ahead || 0;
      behind = ghCached.behind || 0;
      statusState = ghCached.statusState || "identical";
      checks = ghCached.checks || null;
      failed = ghCached.failed || false;
    } else {
      this.triggerGitHubFetch(pr.url);
    }

    const result = {
      ...pr,
      state,
      additions,
      deletions,
      changedFiles,
      commitsCount,
      title: prTitle,
      body: prBody,
      commitsList,
      ahead,
      behind,
      statusState,
      checks,
      failed,
      expiresAt: Date.now() + (5 * 60 * 1000)
    };

    if (sid !== "temp") {
      if (this.PR_INFO_CACHE.size > 500) this.PR_INFO_CACHE.clear();
      this.PR_INFO_CACHE.set(cacheKey, result);
    }

    return result;
  },

  getCheckStatus(activities = []) {
    if (!activities || !Array.isArray(activities)) return null;
    const cachedResult = this.CHECK_STATUS_ARRAY_CACHE.get(activities);
    if (cachedResult !== undefined) return cachedResult;

    let status = null;
    for (let i = 0; i < activities.length; i++) {
      const a = activities[i];
      if (!a) continue;

      if (!this.CHECK_ACTIVITY_CACHE.has(a)) {
        let actStatus = null;
        const pu = a.progressUpdated;
        if (pu) {
          const desc = (pu.description || "").toLowerCase();
          const title = (pu.title || "").toLowerCase();

          const isSignal = desc.includes("check") || desc.includes("workflow") || desc.includes("deploy") || desc.includes("action") ||
                           title.includes("check") || title.includes("workflow") || title.includes("deploy");

          if (isSignal) {
            if (desc.includes("passed") || desc.includes("success") || desc.includes("completed") || desc.includes("verified")) {
              actStatus = { state: "success", label: desc.includes("deploy") ? "DEPLOYED" : "CHECKS PASSED" };
            } else if (desc.includes("failed") || desc.includes("failure") || desc.includes("error")) {
              actStatus = { state: "failure", label: desc.includes("deploy") ? "DEPLOY FAILED" : "CHECKS FAILED" };
            } else if (desc.includes("running") || desc.includes("pending") || desc.includes("started") || desc.includes("progress")) {
              actStatus = { state: "pending", label: desc.includes("deploy") ? "DEPLOYING" : "CHECKS RUNNING" };
            }

            const urlMatch = (pu.description || "").match(this.CHECK_URL_RE);
            if (urlMatch && actStatus) actStatus.url = urlMatch[0];
          }
        }
        this.CHECK_ACTIVITY_CACHE.set(a, actStatus);
      }

      const actStatus = this.CHECK_ACTIVITY_CACHE.get(a);
      if (actStatus) {
        status = actStatus;
      }
    }
    this.CHECK_STATUS_ARRAY_CACHE.set(activities, status);
    return status;
  },

  getBranchInfo(s, activities = []) {
    if (!s) return null;
    const sid = s.id || s.name || "temp";
    const actLen = activities.length;
    const size = getActivitiesSize(activities);
    const cacheKey = `${sid}:${actLen}:${size}:${s.updateTime || s.createTime || ""}`;
    if (sid !== "temp" && this.BRANCH_INFO_CACHE.has(cacheKey)) return this.BRANCH_INFO_CACHE.get(cacheKey);

    const context = s.sourceContext?.githubRepoContext;
    const base = context?.startingBranch || "main";

    let working = null;

    for (let i = 0; i < activities.length; i++) {
      const a = activities[i];
      if (!a) continue;

      if (!this.BRANCH_ACTIVITY_CACHE.has(a)) {
        let pushBranch = null;
        const desc1 = a.progressUpdated?.description || "";
        const m1 = desc1.match(this.PUSH_RE) || desc1.match(this.BRANCH_RE) || desc1.match(this.CREATE_BRANCH_RE);
        if (m1) {
          const bname = m1[1].replace(/['"`\.]/g, "");
          if (bname !== "main" && bname !== "master") {
            pushBranch = bname;
          }
        }

        const desc2 = a.progressUpdated?.description || a.userMessaged?.userMessage || a.agentMessaged?.agentMessage || a.description || "";
        const title2 = a.progressUpdated?.title || a.title || "";

        let treeBranch = null;
        const m2 = desc2.match(this.TREE_LINK_RE) || title2.match(this.TREE_LINK_RE);
        if (m2) {
          treeBranch = m2[1];
        }

        let compareBranch = null;
        const m3 = desc2.match(this.BRANCH_LINK_RE) || desc2.match(this.COMPARE_LINK_RE) || title2.match(this.BRANCH_LINK_RE) || title2.match(this.COMPARE_LINK_RE);
        if (m3) {
          compareBranch = m3[1];
        }

        this.BRANCH_ACTIVITY_CACHE.set(a, { pushBranch, treeBranch, compareBranch });
      }
    }

    for (let i = 0; i < activities.length; i++) {
      const a = activities[i];
      if (!a) continue;
      const cached = this.BRANCH_ACTIVITY_CACHE.get(a);
      if (cached && cached.pushBranch) {
        working = cached.pushBranch;
      }
    }

    if (!working) {
      let linkMatch = null;
      const sTexts = [s.title || "", s.prompt || ""];
      for (const t of sTexts) {
        linkMatch = t.match(this.TREE_LINK_RE);
        if (linkMatch) { working = linkMatch[1]; break; }
      }

      if (!working) {
        for (let i = 0; i < activities.length; i++) {
          const a = activities[i];
          if (!a) continue;
          const cached = this.BRANCH_ACTIVITY_CACHE.get(a);
          if (cached && cached.treeBranch) {
            working = cached.treeBranch;
            break;
          }
        }
      }

      if (!working) {
        for (const t of sTexts) {
          linkMatch = t.match(this.BRANCH_LINK_RE) || t.match(this.COMPARE_LINK_RE);
          if (linkMatch) { working = linkMatch[1]; break; }
        }
        if (!working) {
          for (let i = 0; i < activities.length; i++) {
            const a = activities[i];
            if (!a) continue;
            const cached = this.BRANCH_ACTIVITY_CACHE.get(a);
            if (cached && cached.compareBranch) {
              working = cached.compareBranch;
              break;
            }
          }
        }
      }
    }

    let repo = s.sourceContext?.source?.replace("sources/github/","");
    if (!repo || repo.startsWith("sources/")) {
      const pr = this.getPR(s);
      if (pr && pr.url) {
        const m = pr.url.match(this.PR_REPO_RE);
        if (m) repo = m[1];
      }
    }

    const repoUrl = repo && !repo.startsWith("sources/") ? `https://github.com/${repo}` : null;

    let ahead = 0;
    let behind = 0;
    let statusState = "identical";
    let checks = null;
    let failed = false;

    const activeWorking = working || base;
    if (sid !== "temp" && repo && base && activeWorking && activeWorking !== base) {
      const bKey = `${repo}:${base}:${activeWorking}`;
      const bCached = this.GH_BRANCH_STATE_CACHE.get(bKey);
      if (bCached && (Date.now() - bCached.fetchedAt < 5 * 60 * 1000)) {
        ahead = bCached.ahead || 0;
        behind = bCached.behind || 0;
        statusState = bCached.statusState || "identical";
        checks = bCached.checks || null;
        failed = bCached.failed || false;
      } else {
        this.triggerGitHubBranchFetch(repo, base, activeWorking);
      }
    }

    const res = {
      base,
      working: activeWorking,
      repo: repoUrl ? repo : null,
      repoUrl,
      isNew: activeWorking && activeWorking !== base,
      ahead,
      behind,
      statusState,
      checks,
      failed
    };
    if (sid !== "temp") {
      if (this.BRANCH_INFO_CACHE.size > 500) this.BRANCH_INFO_CACHE.clear();
      this.BRANCH_INFO_CACHE.set(cacheKey, res);
    }
    return res;
  }
};

/**
 * Backward-compatible barrel wrappers that delegate to the centralized GitHubTracker service.
 * This decouples GitHub REST API queries, caching, and text-scraping from the main UI file scope.
 */
const getPR = (s) => GitHubTracker.getPR(s);
const getPRInfo = (s, activities = []) => GitHubTracker.getPRInfo(s, activities);
const getBranchInfo = (s, activities = []) => GitHubTracker.getBranchInfo(s, activities);
const getCheckStatus = (activities = []) => GitHubTracker.getCheckStatus(activities);


const WORKING_SET_CACHE = new LRUCache(500);
const FILE_MENTION_RE = /`([^`\s]+\.[a-z0-9]+)`/gi;

// Global WeakMap to cache parsed unidiff patch results directly by reference-stable gitPatch objects inside activities.
// This turns repetitive string splitting, hunk iteration, and multi-pass line scanning into flat O(1) lookups on re-renders.
const PARSED_PATCH_CACHE = new WeakMap();

/**
 * Parses a git unidiff patch text into a structured list of file groups, each containing
 * filename, hunks (header, lines), additions (adds), removals (rems), and rawLines.
 *
 * This pure utility is extracted out of DiffViewer to prevent "God Mode" and mixed concerns,
 * keeping low-level string parsing separate from high-level visual rendering and UI state.
 *
 * Now optimized with reference-stable caching for extremely high performance.
 */
const parseUnidiffPatch = (patchOrObj, ts = null) => {
  if (!patchOrObj) return [];
  const isObj = typeof patchOrObj === "object" && patchOrObj !== null;
  const patch = isObj ? patchOrObj.unidiffPatch : patchOrObj;
  if (!patch) return [];

  if (isObj && PARSED_PATCH_CACHE.has(patchOrObj)) {
    const cached = PARSED_PATCH_CACHE.get(patchOrObj);
    if (ts !== null) {
      cached.forEach(g => { g.ts = ts; });
    }
    return cached;
  }

  const allGroups = [];
  const lines = patch.split("\n");
  let currentGroup = null;

  lines.forEach((line) => {
    if (line.startsWith("--- ") || line.startsWith("diff --git")) return;
    if (line.startsWith("+++ ")) {
      const file = line.slice(4).replace(/^b\//, "");
      currentGroup = {
        file,
        hunks: [],
        adds: 0,
        rems: 0,
        ts,
        rawLines: [`--- a/${file}`, `+++ b/${file}`]
      };
      allGroups.push(currentGroup);
      return;
    }
    if (!currentGroup) return;

    currentGroup.rawLines.push(line);

    if (line.startsWith("@@")) {
      currentGroup.hunks.push({ header: line, lines: [] });
    } else if (currentGroup.hunks.length > 0) {
      currentGroup.hunks[currentGroup.hunks.length - 1].lines.push(line);
      if (line.startsWith("+")) currentGroup.adds++;
      else if (line.startsWith("-")) currentGroup.rems++;
    }
  });

  if (isObj) {
    PARSED_PATCH_CACHE.set(patchOrObj, allGroups);
  }
  return allGroups;
};

const getWorkingSet = (s, activities = []) => {
  if (!s) return [];
  const sid = s.id || s.name || "temp";
  const actLen = activities.length;
  const promptLen = s.prompt?.length || 0;
  const cacheKey = `${sid}:${actLen}:${promptLen}`;

  if (WORKING_SET_CACHE.has(cacheKey)) return WORKING_SET_CACHE.get(cacheKey);

  const files = new Set();

  // 1. Scan activities for patches
  for (let i = 0; i < activities.length; i++) {
    const a = activities[i];
    if (a.artifacts) {
      for (let j = 0; j < a.artifacts.length; j++) {
        const art = a.artifacts[j];
        const patch = art.changeSet?.gitPatch?.unidiffPatch;
        if (patch) {
          const parsedGroups = parseUnidiffPatch(art.changeSet?.gitPatch || patch);
          for (let k = 0; k < parsedGroups.length; k++) {
            const file = parsedGroups[k].file;
            if (file && file !== "/dev/null") files.add(file);
          }
        }
      }
    }

    // 2. Scan planGenerated for file mentions
    if (a.planGenerated?.plan?.steps) {
      const steps = a.planGenerated.plan.steps;
      for (let j = 0; j < steps.length; j++) {
        const st = steps[j];
        const text = st.title + " " + (st.description || "");
        let match;
        FILE_MENTION_RE.lastIndex = 0;
        while ((match = FILE_MENTION_RE.exec(text)) !== null) {
          const f = match[1];
          if (f.includes("/") || f.includes(".")) files.add(f);
        }
      }
    }
  }

  // 3. Fallback: Scan prompt for file mentions if it's a new session
  if (files.size === 0 && s.prompt) {
    let match;
    FILE_MENTION_RE.lastIndex = 0;
    while ((match = FILE_MENTION_RE.exec(s.prompt)) !== null) {
      const f = match[1];
      if (f.includes("/") || f.includes(".")) files.add(f);
    }
  }

  const result = Array.from(files);
  if (WORKING_SET_CACHE.size > 500) WORKING_SET_CACHE.clear();
  WORKING_SET_CACHE.set(cacheKey, result);
  return result;
};

const HASH_RE = /\b[a-f0-9]{7,40}\b/g;
const COMMIT_COUNT_RE = /(?:pushed|committed|applied)\s+(\d+)\s+(?:commit|change|fix|update)/i;
// Cache computed ahead/commit stats per reference-stable activity object to avoid redundant string/regex matching on re-renders
const AHEAD_ACTIVITY_CACHE = new WeakMap();

// Bounded WeakMap cache for computing aggregate ahead counts of reference-stable immutable activities arrays.
// Caching at the array reference level avoids O(N) array traversals across render loops.
const AHEAD_COUNT_ARRAY_CACHE = new WeakMap();

const getAheadCount = (activities = []) => {
  if (!activities || !Array.isArray(activities)) return 0;
  const cached = AHEAD_COUNT_ARRAY_CACHE.get(activities);
  if (cached !== undefined) return cached;

  let count = 0;
  const pushHashes = new Set();

  for (let i = 0; i < activities.length; i++) {
    const a = activities[i];
    if (!a) continue;

    if (!AHEAD_ACTIVITY_CACHE.has(a)) {
      let actCount = 0;
      const actHashes = [];
      const pu = a.progressUpdated;
      if (pu) {
        const rawDesc = pu.description || "";
        const desc = rawDesc.toLowerCase();
        const hashes = rawDesc.match(HASH_RE);
        if (hashes) {
          for (let j = 0; j < hashes.length; j++) {
            const h = hashes[j];
            if (h.length >= 7 && !h.includes("-")) {
              actHashes.push(h);
            }
          }
        }

        const m = desc.match(COMMIT_COUNT_RE);
        if (m) {
          if (!hashes) actCount = parseInt(m[1], 10);
        } else if (desc.includes("pushed a commit") || desc.includes("pushed 1 commit") || desc.includes("pushed the changes") || desc.includes("committed changes")) {
          if (!hashes) actCount = 1;
        } else if (desc.includes("pushed") && (desc.includes("change") || desc.includes("fix") || desc.includes("update"))) {
          if (!hashes) actCount = 1;
        }
      }
      AHEAD_ACTIVITY_CACHE.set(a, { count: actCount, hashes: actHashes });
    }

    const cached = AHEAD_ACTIVITY_CACHE.get(a);
    if (cached) {
      count += cached.count;
      for (let j = 0; j < cached.hashes.length; j++) {
        pushHashes.add(cached.hashes[j]);
      }
    }
  }

  const result = Math.max(count, pushHashes.size);
  AHEAD_COUNT_ARRAY_CACHE.set(activities, result);
  return result;
};

// Bounded WeakMap cache for computing whether a session is actually completed based on reference-stable immutable activities arrays.
const IS_ACTUALLY_DONE_CACHE = new WeakMap();

const getIsActuallyDone = (sState, activities = []) => {
  if (ACTIVE_STATES.has(sState)) return false;
  if (sState === "COMPLETED") return true;
  if (!activities || !Array.isArray(activities)) return false;

  const cached = IS_ACTUALLY_DONE_CACHE.get(activities);
  if (cached !== undefined) return cached;

  let lastComp = -1, lastUser = -1;
  for (let i = activities.length - 1; i >= 0; i--) {
    const type = getActType(activities[i]);
    if (lastComp === -1 && type === "sessionCompleted") lastComp = i;
    if (lastUser === -1 && type === "userMessaged") lastUser = i;
    if (lastComp !== -1 && lastUser !== -1) break;
  }
  const result = lastComp !== -1 && lastComp > lastUser;
  IS_ACTUALLY_DONE_CACHE.set(activities, result);
  return result;
};

// Bounded cache to avoid memory leaks. Caches parsed string date values to their epoch milliseconds.
const DATE_MS_CACHE = new Map();
const parseDateMs = (dateVal) => {
  if (!dateVal) return 0;
  if (typeof dateVal === 'number') return dateVal;
  if (dateVal instanceof Date) return dateVal.getTime();
  if (typeof dateVal !== 'string') {
    return new Date(dateVal).getTime() || 0;
  }
  let cached = DATE_MS_CACHE.get(dateVal);
  if (cached !== undefined) return cached;
  const ms = new Date(dateVal).getTime() || 0;
  if (DATE_MS_CACHE.size > 2000) {
    DATE_MS_CACHE.clear();
  }
  DATE_MS_CACHE.set(dateVal, ms);
  return ms;
};

const fmtDuration = ms => {
  const d = Math.abs(ms);
  if (d < 60000) return `${Math.floor(d / 1000)}s`;
  if (d < 3600000) return `${Math.floor(d / 60000)}m`;
  if (d < 86400000) return `${Math.floor(d / 3600000)}h ${Math.floor((d % 3600000) / 60000)}m`;
  return `${Math.floor(d / 86400000)}d`;
};

// ─── PWA install hook ─────────────────────────────────────────────────────────
function usePWA() {
  const [canInstall, setCanInstall] = useState(() => !!window.__pwa?.installPrompt);
  const [installed,  setInstalled]  = useState(false);
  const [installing, setInstalling] = useState(false);

  useEffect(() => {
    const onReady   = () => setCanInstall(true);
    const onInstall = () => { setInstalled(true); setCanInstall(false); };
    window.addEventListener("pwa-installable", onReady);
    window.addEventListener("pwa-installed",   onInstall);
    return () => { window.removeEventListener("pwa-installable",onReady); window.removeEventListener("pwa-installed",onInstall); };
  }, []);

  const install = useCallback(async () => {
    const prompt = window.__pwa?.installPrompt;
    if (!prompt) return;
    setInstalling(true);
    try {
      prompt.prompt();
      const { outcome } = await prompt.userChoice;
      if (outcome === "accepted") { window.__pwa.installPrompt = null; setCanInstall(false); }
    } finally { setInstalling(false); }
  }, []);

  return { canInstall, installed, installing, install, isFile: window.__pwa?.isFileProtocol };
}

// ─── Responsive hook ──────────────────────────────────────────────────────────
function useIsDesktop() {
  // Capture initial state to avoid layout shift on rotation for "auto" mode
  // unless the threshold is significantly crossed (e.g. tablet/desktop vs phone)
  const [v, setV] = useState(() => window.innerWidth >= 1024);

  useEffect(() => {
    const h = () => {
      // Only switch if we cross the major "tablet/desktop" threshold
      // 1024px is a safe bet for "not a phone in portrait"
      const current = window.innerWidth >= 1024;
      setV(prev => {
        // If we were mobile and stayed under 1024, or were desktop and stayed over 768, keep it.
        // This provides some hysteresis and stability.
        if (prev && window.innerWidth < 768) return false;
        if (!prev && window.innerWidth >= 1024) return true;
        return prev;
      });
    };
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return v;
}

  }, [scrolled, threshold]);
  return [scrolled, onScroll];
};

const useAutoPoll = (interval, fn) => {
  const [countdown, setCountdown] = useState(0);
  const nextRefAt = useRef(0);
  const fnRef = useRef(fn);
  fnRef.current = fn;

  useEffect(() => {
    if (!interval || interval <= 0) {
      setCountdown(0);
      return;
    }

    let active = true;
    let timer = null;
    let intv = null;

    const run = async () => {
      if (!active) return;

      const nextAt = Date.now() + interval;
      nextRefAt.current = nextAt;
      setCountdown(Math.ceil(interval / 1000));

      timer = setTimeout(async () => {
        if (!active) return;
        try { await fnRef.current(); } catch (err) { console.error("Poll failed", err); }
        if (active) run();
      }, interval);
    };

    run();

    intv = setInterval(() => {
      if (active) {
        const remaining = Math.max(0, Math.ceil((nextRefAt.current - Date.now()) / 1000));
        setCountdown(remaining);
      }
    }, 1000);

    return () => {
      active = false;
      clearTimeout(timer);
      clearInterval(intv);
    };
  }, [interval]);

  return countdown;
};

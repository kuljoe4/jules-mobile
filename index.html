// OPTIMIZATION: Wrap RecentActivityLog in React.memo to prevent unnecessary re-renders when parent
// state updates but the network log and totals remain reference-stable.
const RecentActivityLog = memo(({ log, total }) => {
  const [mode, setMode] = useState("chrono"); // "chrono", "ranked-indiv", "ranked-group"

  const groupedData = useMemo(() => {
    const groups = {};
    log.forEach(r => {
      const label = r.label || "Unknown Request";
      if (!groups[label]) {
        groups[label] = { label, bytesIn: 0, bytesOut: 0, totalBytes: 0, count: 0 };
      }
      groups[label].bytesIn += r.bytesIn;
      groups[label].bytesOut += r.bytesOut;
      groups[label].totalBytes += (r.bytesIn + r.bytesOut);
      groups[label].count += 1;
    });

    return Object.values(groups)
      .map(g => {
        const pct = total > 0 ? (g.totalBytes / total) * 100 : 0;
        return { ...g, pct };
      })
      .sort((a, b) => b.totalBytes - a.totalBytes);
  }, [log, total]);

  const rankedIndiv = useMemo(() => {
    return log
      .map(r => {
        const totalBytes = r.bytesIn + r.bytesOut;
        const pct = total > 0 ? (totalBytes / total) * 100 : 0;
        return { ...r, totalBytes, pct };
      })
      .sort((a, b) => b.totalBytes - a.totalBytes);
  }, [log, total]);

  return (
    <div style={{marginTop:8}}>
      <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:12}}>
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:T.textDim,letterSpacing:"0.08em",fontWeight:700}}>RECENT ACTIVITY LOG</div>
          <button
            onClick={() => {
              const data = JSON.stringify(log, null, 2);
              navigator.clipboard.writeText(data).then(() => {
                alert("Activity log copied to clipboard");
              });
            }}
            aria-label="Copy all network activity to clipboard"
            style={{
              background:T.surfaceHi, border:`1px solid ${T.border}`, borderRadius:4,
              padding:"3px 8px", cursor:"pointer", color:T.brand,
              fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:700
            }}
          >COPY ALL</button>
        </div>

        <div style={{display:"flex", gap:4, background:T.surface, border:`1px solid ${T.border}`, borderRadius:6, padding:2, width:"fit-content"}}>
          {[
            { id: "chrono", label: "CHRONO (RECENT)" },
            { id: "ranked-indiv", label: "RANKED (INDIV)" },
            { id: "ranked-group", label: "RANKED (GROUPED)" }
          ].map(opt => (
            <button
              key={opt.id}
              onClick={() => setMode(opt.id)}
              style={{
                background: mode === opt.id ? T.brandDim : "none",
                border: "none",
                borderRadius: 4,
                padding: "4px 8px",
                fontSize: 9,
                fontWeight: 700,
                color: mode === opt.id ? T.brandLight : T.textDim,
                cursor: "pointer",
                fontFamily: "'JetBrains Mono',monospace",
                textTransform: "uppercase"
              }}
            >
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{background:T.surfaceHi, borderRadius:12, border:`1px solid ${T.border}`, overflow:"hidden"}} role="list">
        {log.length === 0 ? (
          <div style={{textAlign:"center",padding:"32px",fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:T.textDim}}>No requests recorded</div>
        ) : mode === "chrono" ? (
          log.map((r, i) => (
            <div key={r.id} style={{display:"flex",gap:12,alignItems:"center",padding:"12px 16px",borderBottom:i<log.length-1?`1px solid ${T.border}`:"none"}} role="listitem">
              <div style={{
                width:26,height:26,borderRadius:6,flexShrink:0,
                background: r.status >= 400 ? T.redDim : r.status >= 300 ? T.amberDim : T.brandDim,
                border: `1px solid ${r.status >= 400 ? T.red : r.status >= 300 ? T.amber : T.brand}40`,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontFamily:"'JetBrains Mono',monospace", fontSize:9, fontWeight:900,
                color: r.status >= 400 ? T.red : r.status >= 300 ? T.amber : T.brandLight

// Performance Optimized: Wrapped in React.memo to prevent unnecessary collision
// scanning, prompt evaluation, and layout re-rendering on parent countdown timer
// ticks and background poll cycles when props are reference-stable.
const ConflictRadar = memo(({ currentSource, currentBranch, currentPrompt, allSessions, activitiesMap, currentSessionId, startTime, limit = 20 }) => {
  const [expanded, setExpanded] = useState(false);
  const [debouncedPrompt, setDebouncedPrompt] = useState(currentPrompt);

  useEffect(() => {
    const handler = setTimeout(() => {
      setDebouncedPrompt(currentPrompt);
    }, 400);
    return () => clearTimeout(handler);
  }, [currentPrompt]);

  const collisions = useMemo(() => {
    if (!currentSource) return [];

    const currentFiles = new Set(getWorkingSet({ prompt: debouncedPrompt, id: currentSessionId }, activitiesMap[currentSessionId] || []));
    const results = [];
    const relevantSessions = allSessions
      .filter(s => s.id !== currentSessionId)
      .filter(s => s.sourceContext?.source === currentSource)
      .slice(0, limit);

    for (const s of relevantSessions) {
      const isCompleted = s.state === "COMPLETED";
      if (isCompleted) {
        if (!startTime) continue;
        const compTime = parseDateMs(s.updateTime || s.createTime);
        if (compTime <= startTime) continue;
      }

      const acts = activitiesMap[s.id] || [];
      const sFiles = getWorkingSet(s, acts);
      const overlap = sFiles.filter(f => currentFiles.has(f));
      const sameBranch = currentBranch && s.sourceContext?.githubRepoContext?.startingBranch === currentBranch;

      if (overlap.length > 0 || sameBranch) {
        results.push({
          session: s,
          overlap,
          sameBranch,
          risk: overlap.length > 0 ? "HIGH" : "MEDIUM",
          isDrift: isCompleted
        });
      }
    }
    return results;
  }, [currentSource, currentBranch, debouncedPrompt, allSessions, activitiesMap, currentSessionId, startTime, limit]);

  if (collisions.length === 0) {
    if (!currentSource || !currentPrompt.trim()) return null;
    return (
      <div style={{
        marginTop: 12, padding: "8px 14px", background: "rgba(52, 211, 153, 0.05)",
        border: `1px solid rgba(52, 211, 153, 0.2)`, borderRadius: 10,
        display: "flex", alignItems: "center", gap: 8, animation: "fadeIn .3s ease"
      }}>
        <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#34d399", boxShadow: "0 0 8px #34d399" }}/>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, fontWeight: 800, color: "#34d399", letterSpacing: "0.05em" }}>
          NO CONFLICTS DETECTED · READY TO START
        </span>
      </div>
    );
  }

  return (
    <div style={{
      marginTop: 12, background: "rgba(251, 113, 133, 0.05)",
      border: `1px solid ${T.red}30`, borderRadius: 12,
      overflow: "hidden", animation: "fadeIn .3s ease"
    }}>
      <button
        onClick={() => setExpanded(p => !p)}
        style={{
          width: "100%", background: "none", border: "none", cursor: "pointer",
          display: "flex", alignItems: "center", gap: 8, padding: 16,
          textAlign: "left", outline: "none", color: "inherit",
          transition: "background .2s cubic-bezier(0.4, 0, 0.2, 1)"
        }}
        onMouseEnter={e => e.currentTarget.style.background = "rgba(251, 113, 133, 0.04)"}
        onMouseLeave={e => e.currentTarget.style.background = "none"}
      >
        <Ic n="wifi" s={16} c={T.red}/>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12, fontWeight: 900, color: T.red, letterSpacing: "0.05em" }}>
          CONFLICT RADAR
        </span>
        <div style={{ flex: 1, height: 1, background: `${T.red}20` }}/>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: T.red, fontWeight: 800, marginRight: 4 }}>
          {collisions.length} ACTIVE RISK{collisions.length !== 1 ? "S" : ""}
        </span>
        <Ic n={expanded ? "chevron_up" : "chevron_down"} s={14} c={T.red}/>
      </button>

      <div id="conflict-radar-detail" style={{
        display: expanded ? "block" : "none",
        maxHeight: expanded ? "2000px" : "0px",
        opacity: expanded ? 1 : 0,
        overflow: "hidden",
        transition: "all .3s cubic-bezier(0.4, 0, 0.2, 1)",
        padding: expanded ? "0 16px 16px" : "0 16px"
      }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {collisions.map((c, i) => (
            <div key={i} style={{
              background: T.surface, padding: 10, borderRadius: 8,
              border: `1px solid ${c.risk === "HIGH" ? T.red + "40" : T.amber + "40"}`,
              position: "relative", overflow: "hidden"
            }}>
              {c.risk === "HIGH" && <div style={{ position: "absolute", top: 0, bottom: 0, left: 0, width: 3, background: T.red }}/>}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6, paddingLeft: c.risk === "HIGH" ? 6 : 0 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "'IBM Plex Sans',sans-serif", fontSize: 13, fontWeight: 600, color: T.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {c.session.title || c.session.prompt}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
                    <Pill status={c.session.state} small hideLabel />
                    <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.dim }}>{fmtAgo(parseDateMs(c.session.updateTime || c.session.createTime))}</span>
                  </div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                  <div style={{
                    background: c.isDrift ? `${T.amber}15` : (c.risk === "HIGH" ? `${T.red}15` : `${T.amber}15`),
                    border: `1px solid ${c.isDrift ? T.amber : (c.risk === "HIGH" ? T.red : T.amber)}30`,
                    borderRadius: 4, padding: "2px 6px", fontFamily: "'JetBrains Mono',monospace",
                    fontSize: 8, color: c.isDrift ? T.amber : (c.risk === "HIGH" ? T.red : T.amber), fontWeight: 800
                  }}>
                    {c.isDrift ? "DRIFT" : c.risk + " RISK"}
                  </div>
                  {c.sameBranch && (
                    <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 8, color: T.amber, fontWeight: 700, opacity: 0.8 }}>
                      SAME BASE
                    </div>
                  )}
                </div>
              </div>

              {c.overlap.length > 0 && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 6, paddingLeft: c.risk === "HIGH" ? 6 : 0 }}>
                  {c.overlap.map(f => (
                    <span key={f} style={{
                      fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.red,
                      background: `${T.red}10`, padding: "2px 6px", borderRadius: 4,
                      border: `1px solid ${T.red}20`
                    }}>
                      {f.split("/").pop()}
                    </span>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>

        <div style={{ marginTop: 12, fontFamily: "'IBM Plex Sans',sans-serif", fontSize: 11, color: T.textDim, lineHeight: 1.5 }}>
          <div style={{ color: T.red, fontWeight: 700, marginBottom: 4, fontSize: 10 }}>⚠️ POTENTIAL MERGE CONFLICTS</div>
          Jules is isolated. These sessions touch the same files or branch. To clear:
          <ul style={{ paddingLeft: 18, marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
            <li>Select a different starting branch for this session</li>
            <li>Wait for conflicting sessions to reach <strong>DONE</strong> state</li>
            <li>Refine prompt to avoid overlapping files</li>
          </ul>
        </div>
      </div>
    </div>
  );
});

const QuotaTimeline = ({ todayCount, plan }) => {
  const [now, setNow] = useState(Date.now());
  const [zoomHours, setZoomHours] = useState(12); // Default 12h window

  useEffect(() => {
    const i = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(i);
  }, []);

  const windowStart = now - (zoomHours / 2) * 3600000;
  const windowEnd = now + (zoomHours / 2) * 3600000;
  const totalWidth = zoomHours * 3600000;

  const getPos = (ts) => ((ts - windowStart) / totalWidth) * 100;

  const events = [
    ...(todayCount.recentResets || []).map(r => ({ ts: r.ts, type: "recent" })),
    ...(todayCount.upcomingResets || []).map(r => ({ ts: r.ts, type: "upcoming" })),
  ].filter(e => e.ts >= windowStart && e.ts <= windowEnd)
   .sort((a, b) => a.ts - b.ts);

  // Pinch-to-zoom support
  const touchStartDist = useRef(null);
  const handleTouchStart = (e) => {
    if (e.touches.length === 2) {
      touchStartDist.current = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
    }
  };
  const handleTouchMove = (e) => {
    if (e.touches.length === 2 && touchStartDist.current) {
      const dist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      const ratio = touchStartDist.current / dist;
      const nextZoom = Math.max(1, Math.min(24, zoomHours * ratio));
      setZoomHours(nextZoom);
      touchStartDist.current = dist;
    }
  };

  // Smart Collision Avoidance (Staggered Height)
  const labelSlots = events.map(e => ({ ...e, pos: getPos(e.ts) }));
  labelSlots.forEach((e, i) => {
    const isNearNow = Math.abs(e.pos - 50) < 12;
    const prev = labelSlots[i-1];

    // Base offsets: Stagger top/bottom unless near NOW (where we only stack bottom)
    let v = isNearNow ? 20 : (i % 2 === 0 ? -18 : 18);

    if (prev && Math.abs(e.pos - prev.pos) < 15) {
      // Collision detected with previous label
      if (isNearNow) {
        // Near center 'NOW' marker: Stack deeply downwards
        // Hierarchical offsets: 20, 38, 56...
        let collisionCount = 0;
        for (let j = i - 1; j >= 0; j--) {
          if (Math.abs(e.pos - labelSlots[j].pos) < 15 && Math.abs(labelSlots[j].pos - 50) < 12) collisionCount++;
          else break;
        }
        v = 20 + (collisionCount * 20);
      } else {
        // Outside center: Try to flip or push further
        if (Math.sign(v) === Math.sign(prev.vOffset)) {
          v = prev.vOffset + (20 * Math.sign(v));
        }
      }
    }
    e.vOffset = v;
  });

  const zoomH = Math.round(zoomHours);

  return (
    <div style={{ marginTop: 24, marginBottom: 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10, fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.dim, fontWeight: 800, letterSpacing: "0.05em" }}>
        <span>-{zoomH/2}H</span>
        <span style={{ color: T.brand, opacity: 0.8 }}>NOW</span>
        <span>+{zoomH/2}H</span>
      </div>

      <div
        style={{ position: "relative", height: 60, display: "flex", alignItems: "center", touchAction: "none" }}
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
      >
        {/* Track */}
        <div style={{ position: "absolute", left: 0, right: 0, height: 2, background: T.border, borderRadius: 1 }} />
        <div style={{ position: "absolute", left: 0, width: "50%", height: 2, background: `linear-gradient(to right, transparent, ${T.brand}40)`, borderRadius: 1 }} />

        {/* Graduation Markers */}
        {Array.from({ length: zoomH + 1 }).map((_, h) => (
          <div key={h} style={{
            position: "absolute", left: `${(h / zoomH) * 100}%`, top: "50%",
            width: 1, height: h % (zoomH > 12 ? 4 : 2) === 0 ? 8 : 4, background: T.border,
            transform: "translateY(-50%)", opacity: 0.5
          }} />
        ))}

        {/* Events */}
        {labelSlots.map((e, i) => {
          const color = e.type === "recent" ? T.brand : T.amber;
          const labelDir = e.vOffset > 0 ? "top" : "bottom";

          return (
            <div key={i} style={{
              position: "absolute", left: `${e.pos}%`, top: "50%",
              transform: "translate(-50%, -50%)",
              display: "flex", flexDirection: "column", alignItems: "center",
              zIndex: 2, transition: "all 0.3s cubic-bezier(0.4, 0, 0.2, 1)"
            }}>
              <div style={{
                width: 6, height: 6, borderRadius: "50%", background: color,
                boxShadow: `0 0 10px ${color}80`, border: `1.5px solid ${T.bg}`
              }} />
              <div style={{
                position: "absolute", [labelDir]: Math.abs(e.vOffset),
                whiteSpace: "nowrap",
                fontFamily: "'JetBrains Mono',monospace", fontSize: 7, color: color, fontWeight: 800,
                opacity: 0.95, letterSpacing: "0.02em",
                background: T.bg, padding: "2px 4px", borderRadius: 3,
                boxShadow: `0 0 6px ${T.bg}`, border: `1px solid ${color}30`
              }}>
                {fmtTime(e.ts)}
              </div>
            </div>
          );
        })}

        {/* Current Time Marker */}
        <div style={{
          position: "absolute", left: "50%", top: "50%",
          transform: "translate(-50%, -50%)", zIndex: 10,
          display: "flex", flexDirection: "column", alignItems: "center"
        }}>
          <div style={{
            width: 12, height: 12, borderRadius: "50%", background: T.brand,
            boxShadow: `0 0 20px ${T.brand}`, animation: "dot 1.5s infinite",
            border: `2px solid ${T.bg}`, cursor: "help"
          }} title="Current Time" />
          <div style={{
            position: "absolute", bottom: 18, whiteSpace: "nowrap",
            fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: T.brand, fontWeight: 900,
            background: T.bg, padding: "2px 6px", borderRadius: 4, border: `1px solid ${T.brand}`,
            boxShadow: `0 0 10px ${T.brand}30`
          }}>
            {fmtTime(now)}
          </div>
        </div>
      </div>

      <div style={{ marginTop: 24, display: "flex", alignItems: "center", gap: 20 }}>
        <div style={{ flex: 1, display: "flex", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <div style={{ width: 6, height: 6, borderRadius: "50%", background: T.brand }} />
            <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.dim, fontWeight: 700 }}>RECOVERED</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <div style={{ width: 6, height: 6, borderRadius: "50%", background: T.amber }} />
            <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.dim, fontWeight: 700 }}>UPCOMING</span>
          </div>
        </div>

        {/* Zoom Control */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: T.surfaceHi, padding: "4px 8px", borderRadius: 20, border: `1px solid ${T.border}` }}>
          <button onClick={() => setZoomHours(h => Math.min(24, h + 2))} title="Zoom out" aria-label="Zoom out" style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", display: "flex" }}>
             <Ic n="plus" s={10} c={T.muted} style={{ transform: "rotate(45deg)" }} />
          </button>
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.brand, fontWeight: 800, minWidth: 24, textAlign: "center" }}>
            {Math.round(zoomHours)}H
          </span>
          <button onClick={() => setZoomHours(h => Math.max(1, h - 2))} title="Zoom in" aria-label="Zoom in" style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", display: "flex" }}>
             <Ic n="plus" s={10} c={T.muted} />
          </button>
        </div>
      </div>
      {todayCount.upcomingResets?.length > 0 && (
        <div style={{ marginTop: 16, textAlign: "center", fontFamily: "'JetBrains Mono',monospace", fontSize: 8, color: T.amber, fontWeight: 700, letterSpacing: "0.03em", opacity: 0.8 }}>
          NEXT RECOVERY IN {fmtDuration(todayCount.upcomingResets[0].ts - now).toUpperCase()}
        </div>
      )}
    </div>
  );
};

                <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:T.textDim, opacity:0.8}}>{fmtChars(newPrompt.length)}/5kc</span>

          </div>
        </Modal>
      )}
    </div>
  );
};


// ─── Session List ─────────────────────────────────────────────────────────────

  const [filter,setFilter] = useState("ALL");
  const [scrolled, handleScroll] = useScrollThreshold();
  const [searchOpen, setSearchOpen] = useState(false);
  const searchInputRef = useRef(null);

  const toggleSearch = () => {
    if (searchOpen || searchQuery) {
      setSearchOpen(false);
      setSearchQuery("");
    } else {
      setSearchOpen(true);
    }
  };

  useEffect(() => {
    const handleGlobalKeyDown = (e) => {
      const active = document.activeElement;
      if (active && (
        active.tagName === "INPUT" ||
        active.tagName === "TEXTAREA" ||
        active.tagName === "SELECT" ||
        active.isContentEditable
      )) {
        return;
      }
      if (e.key === "/") {
        e.preventDefault();
        setSearchOpen(true);
      }
    };
    window.addEventListener("keydown", handleGlobalKeyDown);
    return () => window.removeEventListener("keydown", handleGlobalKeyDown);
  }, []);

  useEffect(() => {
    if (searchOpen && searchInputRef.current) {
      searchInputRef.current.focus();
    }
  }, [searchOpen]);
  const baseFiltered = useMemo(() => {
    let list = sessions.filter(s => archivedIds.has(s.id) === showArchived && !ignoredIds.has(s.id));
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      list = list.filter(s => (s.title||"").toLowerCase().includes(q) || (s.prompt||"").toLowerCase().includes(q) || (s.id||"").toLowerCase().includes(q));
    }
    return list;
  }, [sessions, archivedIds, showArchived, searchQuery, ignoredIds]);
  const filtered = useMemo(() => {
    if (filter === "ALL") return baseFiltered;
    if (filter === "HAS_DRAFT") return baseFiltered.filter(s => draftsMap[s.id]);
    return baseFiltered.filter(s => s.state === filter);
  }, [filter, baseFiltered, draftsMap]);
  const active = useMemo(() => sessions.filter(s=>ACTIVE_STATES.has(s.state)).length, [sessions]);

  const hasDrafts = useMemo(() => {

    const map = {};
    sessions.forEach(other => {

        const repo = other.sourceContext?.source;
        if (repo) {
          const completionTime = parseDateMs(other.updateTime || other.createTime);
          if (!map[repo] || completionTime > map[repo]) {
            map[repo] = completionTime;
          }
        }

    });
    return map;

          </div>

        {(searchOpen || searchQuery) && (

            <div style={{position:"relative", display:"flex", alignItems:"center"}}>

            icon = "archive"; color = T.purple; bg = T.purpleDim; titleText = "ARCHIVE EMPTY"; descText = "You have no archived sessions."; ctaText = "VIEW ACTIVE"; ctaAction = () => setShowArchived(false);
          } else {
            icon = "tasks"; color = T.brand; bg = T.brandDim; titleText = "NO ACTIVE SESSIONS"; descText = "There are no active sessions to display."; ctaText = "CREATE SESSION"; ctaAction = onNew;
          }
          return (
            <div role="status" style={{textAlign:"center", padding:"36px 16px", background:T.surface, border:`1px dashed ${T.border}`, borderRadius:12, margin:"12px 4px", display:"flex", flexDirection:"column", alignItems:"center", gap:14, animation:"fadeIn .3s ease"}}>
              <div style={{width:44, height:44, borderRadius:"50%", background:bg, border:`1px solid ${color}30`, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 6px 12px rgba(0,0,0,0.15)"}}><Ic n={icon} s={18} c={color}/></div>
              <div>
                <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:900, color, letterSpacing:"0.08em", marginBottom:4}}>{titleText}</div>
                <div style={{fontFamily:"'IBM Plex Sans',sans-serif", fontSize:13, color:T.textDim, lineHeight:1.4, maxWidth:260, margin:"0 auto"}}>{descText}</div>
              </div>
              {ctaText && ctaAction && (
                <button onClick={ctaAction} title={ctaText} aria-label={ctaText} style={{marginTop:4, padding:"8px 16px", borderRadius:6, border:"none", background:color, color:"#000", cursor:"pointer", fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:900, letterSpacing:"0.06em", transition:"all .15s ease", boxShadow:`0 4px 12px ${color}30`}} onMouseEnter={e=>e.currentTarget.style.transform="translateY(-1px)"} onMouseLeave={e=>e.currentTarget.style.transform="none"}>{ctaText}</button>
              )}
            </div>
          );
        })()}
        {filtered.map((s,i)=><SessionCard key={s.id||s.name} index={i+1} s={s} onPress={()=>onSelect(s)} isSelected={s.id===selectedId} activities={activitiesMap[s.id] || EMPTY_ARR} stats={activityStatsMap[s.id]} lastReadTs={readMap[s.id]} latestCompletedTime={latestCompletedTimeByRepo[s.sourceContext?.source]} hasFollowupDraft={!!draftsMap[s.id]}/>)}
      </div>
    </div>
  );
};

// ─── Quota Tracker hook ────────────────────────────────────────────────────────
/**
 * useQuotaTracker
 *
 * Custom hook that encapsulates the daily quota tracking, session registry management,
 * rolling 24-hour window computations, and upcoming/recent quota resets calculations.
 *
 * Exposes:
 *  - todayCount: { total, done, resetIn, nextResetTs, upcomingResets, recentResets }
 *  - registerSessions(sessionsList)
 *  - registerSession(sessionObj)
 */
const useQuotaTracker = (sessions, plan) => {
  const [sessionRegistry, setSessionRegistry] = useState(() => {
    try {
      const reg = SafeStorage.loadSessionRegistry();
      // Prune old entries on load (older than 48h)
      const now = Date.now();
      const cutoff = now - 48 * 3600000;
      const pruned = {};
      Object.entries(reg).forEach(([id, time]) => {
        if (parseDateMs(time) > cutoff) pruned[id] = time;
      });
      return pruned;
    } catch { return {}; }
  });

  useEffect(() => {
    SafeStorage.saveSessionRegistry(sessionRegistry);
  }, [sessionRegistry]);

  const registerSessions = useCallback((incoming) => {
    if (incoming.length > 0) {
      setSessionRegistry(prev => {
        const next = { ...prev };
        let changed = false;
        incoming.forEach(s => {
          if (!next[s.id]) {
            next[s.id] = s.createTime;
            changed = true;
          }
        });
        return changed ? next : prev;
      });
    }
  }, []);

  const registerSession = useCallback((s) => {
    setSessionRegistry(prev => ({ ...prev, [s.id]: s.createTime }));
  }, []);

  const todayCount = useMemo(() => {
    // Rolling 24h Window Logic using SessionRegistry for accuracy
    const now = Date.now();
    const windowStart = now - 24 * 3600000;

    const allKnown = Object.entries(sessionRegistry).map(([id, time]) => ({
      id, ts: parseDateMs(time)
    })).filter(s => s.ts >= windowStart);

    allKnown.sort((a, b) => a.ts - b.ts);

    let resetIn = "24h 0m";
    let nextResetTs = null;
    const upcomingResets = [];
    const recentResets = [];

    if (allKnown.length > 0) {
      nextResetTs = allKnown[0].ts + 24 * 3600000;
      const msLeft = nextResetTs - now;
      const h = Math.floor(msLeft / 3600000);
      const m = Math.floor((msLeft % 3600000) / 60000);
      resetIn = `${h}h ${m}m`;

      allKnown.slice(0, 4).forEach(s => {
        const rTs = s.ts + 24 * 3600000;
        const diff = rTs - now;
        upcomingResets.push({
          ts: rTs,
          in: `${Math.floor(diff / 3600000)}h ${Math.floor((diff % 3600000) / 60000)}m`
        });
      });
    }

    // ── Find the last 2 resets that happened ───────────────────────────
    const windowEnd = now - 24 * 3600000;
    const recentlyDone = Object.entries(sessionRegistry)
      .map(([id, time]) => ({ id, ts: parseDateMs(time) }))
      .filter(s => s.ts < windowEnd)
      .sort((a, b) => b.ts - a.ts); // sort descending (newest reset first)

    recentlyDone.slice(0, 2).forEach(s => {
      const resetTs = s.ts + 24 * 3600000;
      recentResets.push({ ts: resetTs, ago: fmtAgo(resetTs) });
    });

    const windowIds = new Set(allKnown.map(s => s.id));
    const prCreated = sessions.filter(s => windowIds.has(s.id) && !!getPR(s)).length;

    // Sort upcoming by ts
    upcomingResets.sort((a, b) => a.ts - b.ts);

    return { total: allKnown.length, done: prCreated, resetIn, nextResetTs, upcomingResets, recentResets };
  }, [sessions, sessionRegistry, plan?.daily]);

  return { todayCount, registerSession, registerSessions };
};

// ─── App Settings hook ────────────────────────────────────────────────────────
/**
 * useAppSettings
 *
 * Custom hook that encapsulates all application settings state, their synchronization
 * with browser storage (SafeStorage), and computed plan configurations.
 * This decouples settings management from the main JulesClient component.
 */
const useAppSettings = ({ onSessionLimitChange } = {}) => {
  const [pollInterval, setPollIntervalRaw] = useState(loadPollMs);
  const [actPollInterval, setActPollIntervalRaw] = useState(loadActPollMs);
  const [activePollInterval, setActivePollIntervalRaw] = useState(loadActivePollMs);
  const [sessionLimit, setSessionLimitRaw] = useState(loadLimit);
  const [activityLimit, setActivityLimitRaw] = useState(loadActivityLimit);
  const [cacheLimit, setCacheLimitRaw] = useState(loadCacheLimit);
  const [notifications, setNotificationsRaw] = useState(loadNotify);
  const [planId, setPlanIdRaw] = useState(loadPlan);
  const [customDaily, setCustomDailyRaw] = useState(loadCustomDaily);
  const [apiTimeout, setApiTimeoutRaw] = useState(loadApiTimeout);

  const setPollInterval = useCallback(ms => {
    savePollMs(ms);
    setPollIntervalRaw(ms);
  }, []);

  const setActPollInterval = useCallback(ms => {
    saveActPollMs(ms);
    setActPollIntervalRaw(ms);
  }, []);

  const setActivePollInterval = useCallback(ms => {
    saveActivePollMs(ms);
    setActivePollIntervalRaw(ms);
  }, []);

  const setSessionLimit = useCallback(v => {
    saveLimit(v);
    setSessionLimitRaw(v);
    if (onSessionLimitChange) onSessionLimitChange(v);
  }, [onSessionLimitChange]);

  const setActivityLimit = useCallback(v => {
    saveActivityLimit(v);
    setActivityLimitRaw(v);
  }, []);

  const setCacheLimit = useCallback(v => {
    saveCacheLimit(v);
    setCacheLimitRaw(v);
  }, []);

  const setNotifications = useCallback(async v => {
    if (v) {
      const ok = await requestNotificationPermission();
      if (!ok) { alert("Please enable notifications in your browser settings."); return; }
    }
    saveNotify(v);
    setNotificationsRaw(v);
  }, []);

  const setPlanId = useCallback(id => {
    savePlan(id);
    setPlanIdRaw(id);
  }, []);

  const setCustomDaily = useCallback(v => {
    saveCustomDaily(v);
    setCustomDailyRaw(v);
  }, []);

  const setApiTimeout = useCallback(ms => {
    saveApiTimeout(ms);
    setApiTimeoutRaw(ms);
  }, []);

  const plan = useMemo(() => {
    const p = PLANS.find(p => p.id === planId) || PLANS[0];
    if (p.id === "custom") return { ...p, daily: customDaily };
    return p;
  }, [planId, customDaily]);

  return {
    pollInterval, setPollInterval,
    actPollInterval, setActPollInterval,
    activePollInterval, setActivePollInterval,
    sessionLimit, setSessionLimit,
    activityLimit, setActivityLimit,
    cacheLimit, setCacheLimit,
    notifications, setNotifications,
    planId, setPlanId,
    customDaily, setCustomDaily,
    apiTimeout, setApiTimeout,
    plan
  };
};

// ─── Main App ─────────────────────────────────────────────────────────────────
function JulesClient() {
  const [apiKey,setApiKey]     = useState(() => SafeStorage.loadApiKey());
  const [githubToken,setGithubToken] = useState(() => SafeStorage.loadGithubToken());
  const [ghRateLimitedReset, setGhRateLimitedReset] = useState(null);

  useEffect(() => {
    const handleGhRateLimit = (e) => {
      setGhRateLimitedReset(e.detail?.resetAt || "soon");
    };
    window.addEventListener("gh-rate-limited", handleGhRateLimit);
    return () => window.removeEventListener("gh-rate-limited", handleGhRateLimit);
  }, []);

  const [sessions,setSessions] = useState([]);
  const lastStates = useRef(new Map()); // id -> state
  const [activitiesMap, setActivitiesMap] = useState(() => SafeStorage.loadActivitiesMap());
  const [activityStatsMap, setActivityStatsMap] = useState(() => SafeStorage.loadActStats());
  const [selected,setSelected] = useState(null);
  const [mobileScreen,setMobileRaw] = useState("list");
  const [lastSessionScreen, setLastSessionScreen] = useState("list");
  const [justRefreshed, setJustRefreshed] = useState(false);
  const [supplementalSessions, setSupplementalSessions] = useState([]);
  const allSessions = useMemo(() => {
    const map = new Map();
    [...sessions, ...supplementalSessions].forEach(s => map.set(s.id, s));
    return Array.from(map.values()).sort((a, b) => {
      const aTime = parseDateMs(a.updateTime || a.createTime);
      const bTime = parseDateMs(b.updateTime || b.createTime);
      return bTime - aTime;
    });
  }, [sessions, supplementalSessions]);
  const [desktopView,setDesktop]   = useState("empty");
  const [selectedDraft, setSelectedDraft] = useState(null);

  const [draftsMap, setDraftsMap] = useState(() => {
    const map = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("jac_draft_") && !key.startsWith("jac_drafts_box")) {
          const val = localStorage.getItem(key);
          if (val && val.trim()) {
            const id = key.slice("jac_draft_".length);
            map[id] = true;
          }
        }
      }
    } catch (e) {
      console.error("Error scanning follow-up drafts", e);
    }
    return map;
  });

  const handleDraftChange = useCallback((id, hasDraft) => {
    setDraftsMap(prev => {
      if (prev[id] === hasDraft) return prev;
      return { ...prev, [id]: hasDraft };
    });
  }, []);

  const setMobile = useCallback(s => {
    setMobileRaw(s);
    if (s === "list" || s === "detail") setLastSessionScreen(s);
  }, []);
  const [refreshing,setRefreshing] = useState(false);
  // OPTIMIZATION (Bolt): Removed global root-level `netSnap` state and subscription from JulesClient.
  // Since netSnap was unused for rendering in JulesClient, every network record (NET.record) previously
  // triggered a full root-level re-render of the entire tree. Removing this redundant subscription isolates
  // network updates strictly to SettingsView and NetworkMonitor, eliminating severe CPU/Virtual DOM churn.

  const lastFetchTime = useRef(null);

  const handleSessionLimitChange = useCallback(() => {
    lastFetchTime.current = null; // Force full fetch with new limit
  }, []);

  const settings = useAppSettings({
    onSessionLimitChange: handleSessionLimitChange
  });

  const {
    pollInterval, setPollInterval,
    actPollInterval, setActPollInterval,
    activePollInterval, setActivePollInterval,
    sessionLimit, setSessionLimit,
    activityLimit, setActivityLimit,
    cacheLimit, setCacheLimit,
    notifications, setNotifications,
    planId, setPlanId,
    customDaily, setCustomDaily,
    plan
  } = settings;

  const [archivedIds, setArchivedIds] = useState(() => {
    try { return new Set(SafeStorage.loadArchived()); }
    catch { return new Set(); }
  });
  const [ignoredIds, setIgnoredIds] = useState(() => {
    try { return new Set(SafeStorage.loadIgnored()); }
    catch { return new Set(); }
  });
  const [showArchived, setShowArchived] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [globalErr, setGlobalErr] = useState(null);
  const sessionsAbortRef = useRef(null);
  const [personas, setPersonas] = useState(loadPersonas);
  const [readMap, setReadMap] = useState(() => {
    try { return SafeStorage.loadReadMap(); }
    catch { return {}; }
  });

  const isDesktop = useIsDesktop();

  const { todayCount, registerSession, registerSessions } = useQuotaTracker(sessions, plan);

  useEffect(() => {
    const handleStorage = (e) => {
      if (e.key === "jac_key") setApiKey(e.newValue || "");
      if (e.key === "jac_archived") {
        try { setArchivedIds(new Set(JSON.parse(e.newValue || "[]"))); } catch {}
      }
      if (e.key === SafeStorage.KEYS.ACT_STATS) {
        try { setActivityStatsMap(JSON.parse(e.newValue || "{}")); } catch {}
      }
    };
    const handleCustomStats = (e) => {
      if (e.detail) setActivityStatsMap(e.detail);
    };
    window.addEventListener("storage", handleStorage);
    window.addEventListener("jac_stats_updated", handleCustomStats);
    return () => {
      window.removeEventListener("storage", handleStorage);
      window.removeEventListener("jac_stats_updated", handleCustomStats);
    };
  }, []);

  useEffect(() => {
    cleanupActivityStats(allSessions.map(s => s.id));
  }, [allSessions]);

  useEffect(() => {
    SafeStorage.saveArchived(Array.from(archivedIds));
  }, [archivedIds]);

  useEffect(() => {
    SafeStorage.saveIgnored(Array.from(ignoredIds));
  }, [ignoredIds]);

  useEffect(() => {
    SafeStorage.saveReadMap(readMap);
  }, [readMap]);

  const handleArchive = useCallback(id => {
    setArchivedIds(prev => {
      const next = new Set(prev);
      next.add(id);
      return next;
    });
  }, []);

  const handleUnarchive = useCallback(id => {
    setArchivedIds(prev => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  }, []);

  const handleIgnore = useCallback(id => {
    if (!confirm("Are you sure you want to ignore this session? This will remove it from your active list and stop updates.")) return;
    setIgnoredIds(prev => {
      const next = new Set(prev);
      next.add(id);
      return next;
    });
    setSelected(null);
    setDesktop("empty");
    setMobile("list");
  }, []);

  const fetchSupplemental = useCallback(async (ids) => {
    if (!apiKey || ids.length === 0) return;
    try {
      const missing = ids.filter(id => !sessions.some(s => s.id === id) && !supplementalSessions.some(s => s.id === id));
      if (missing.length === 0) return;

      const batchSize = 5;
      const valid = [];
      for (let i = 0; i < missing.length; i += batchSize) {
        const chunk = missing.slice(i, i + batchSize);
        const results = await Promise.all(chunk.map(id =>
          apiCall(apiKey, `/sessions/${id}`, { _label: `Supp ${id.slice(0,6)}` }).catch(() => null)
        ));
        valid.push(...results.filter(Boolean));
      }
      if (valid.length > 0) setSupplementalSessions(prev => [...prev, ...valid]);
    } catch {}
  }, [apiKey, sessions, supplementalSessions]);

  useEffect(() => {
    if (archivedIds.size > 0) fetchSupplemental(Array.from(archivedIds));
  }, [archivedIds, fetchSupplemental]);

  const fetchSessions = useCallback(async (quiet=false, forceFull=false) => {
    if (!apiKey) return;
    if (sessionsAbortRef.current) {
      sessionsAbortRef.current.abort();
    }
    const controller = new AbortController();
    sessionsAbortRef.current = controller;

    const isFull = !lastFetchTime.current || forceFull;
    if (!quiet) setRefreshing(true);
    try {
      let incoming = [];
      let pageToken = null;
      let iterations = 0;
      const quotaNeeded = plan.daily || 50;

      do {
        const qs = `pageSize=${sessionLimit}${pageToken ? `&pageToken=${pageToken}` : ""}`;
        const d = await apiCall(apiKey, `/sessions?${qs}`, {
          _label:`Sessions ${isFull?"full":"Δ"} p${iterations+1}`,
          signal: controller.signal,
          timeout: loadApiTimeout()
        });
        const batch = d.sessions || [];
        console.log(`[FetchSessions] Fetched page ${iterations + 1} with ${batch.length} sessions.`);
        incoming = [...incoming, ...batch];
        pageToken = d.nextPageToken;

        const windowStart = Date.now() - 24 * 3600000;
        const hasOlderThanWindow = batch.length > 0 && parseDateMs(batch[batch.length-1].createTime) < windowStart;

        // Register batch for quota tracking immediately
        registerSessions(batch);

        // Guard against race conditions if superseded by a newer request
        if (sessionsAbortRef.current !== controller) break;

        // Update sessions state instantly for incremental/one-by-one rendering!
        const currentBatch = batch;
        const currentIsFirstPageOfFull = isFull && (iterations === 0);
        setSessions(prev => {
          const selectedId = selected?.id;
          const prevSelected = selectedId ? prev.find(s => s.id === selectedId) : null;
          let adjustedBatch = currentBatch;
          if (prevSelected) {
            adjustedBatch = currentBatch.map(s => {
              if (s.id === selectedId) {
                const sTs = parseDateMs(s.updateTime || s.createTime);
                const prevTs = parseDateMs(prevSelected.updateTime || prevSelected.createTime);
                if (prevTs > sTs) {
                  return prevSelected;
                }
              }
              return s;
            });
          }

          let merged = [];
          if (currentIsFirstPageOfFull) {
            let oldestTs = 0;
            if (adjustedBatch.length > 0) {
              oldestTs = Math.min(...adjustedBatch.map(s => parseDateMs(s.updateTime || s.createTime)));
            }
            const batchIds = new Set(adjustedBatch.map(s => s.id));
            const preserved = prev.filter(s => {
              if (batchIds.has(s.id)) return false;
              const ts = parseDateMs(s.updateTime || s.createTime);
              const isRecent = (Date.now() - parseDateMs(s.createTime || s.updateTime)) < 300000;
              return ts >= oldestTs || ACTIVE_STATES.has(s.state) || isRecent;
            });
            merged = [...adjustedBatch, ...preserved];
          } else {
            const batchIds = new Set(adjustedBatch.map(s => s.id));
            merged = [
              ...adjustedBatch,
              ...prev.filter(s => !batchIds.has(s.id))
            ];
          }

          // Sort: Active first, then by latest update/create time
          const sorted = [...merged].sort((a, b) => {
            const aActive = ACTIVE_STATES.has(a.state);
            const bActive = ACTIVE_STATES.has(b.state);
            if (aActive && !bActive) return -1;
            if (!aActive && bActive) return 1;
            const aTime = parseDateMs(a.updateTime || a.createTime);
            const bTime = parseDateMs(b.updateTime || b.createTime);
            return bTime - aTime;
          });

          // ── Status Notifications ──
          if (loadNotify()) {
            currentBatch.forEach(s => {
              const lastState = lastStates.current.get(s.id);
              if (lastState && lastState !== s.state) {
                const label = s.title || s.prompt || s.id;
                if (s.state === "AWAITING_PLAN_APPROVAL") sendNotification("PLAN READY", `Session: ${label}`, s.id);
                else if (s.state === "AWAITING_USER_FEEDBACK") sendNotification("INPUT NEEDED", `Session: ${label}`, s.id);
                else if (s.state === "COMPLETED") sendNotification("SESSION DONE", `Session: ${label}`, s.id);
                else if (s.state === "FAILED") sendNotification("SESSION FAILED", `Session: ${label}`, s.id);
              }
              lastStates.current.set(s.id, s.state);
            });
          }

          console.log(`[FetchSessions] Populated state with ${sorted.length} sessions total (increment: ${currentBatch.length}).`);
          return sorted;
        });

        iterations++;

        if (!isFull) break;
        if (hasOlderThanWindow) break;
        if (incoming.length >= Math.max(sessionLimit, quotaNeeded * 2)) break;
        if (iterations > 15) break;
      } while (pageToken);

      if (sessionsAbortRef.current !== controller) return;

      setGlobalErr(null); // Clear error on success
      console.log(`[FetchSessions] Loading sequence completed successfully. Total processed: ${incoming.length}`);

      // Update lastFetchTime with the latest timestamp from the incoming results
      if (incoming.length > 0) {
        const latestTs = incoming.reduce((max, s) => {
          const ts = s.updateTime || s.createTime;
          return ts > max ? ts : max;
        }, incoming[0].updateTime || incoming[0].createTime);
        lastFetchTime.current = latestTs;
      } else if (forceFull) {
        lastFetchTime.current = null;
      }

      if (!quiet) {
        setJustRefreshed(true);
        setTimeout(() => setJustRefreshed(false), 2000);
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error("[FetchSessions] Error:", err);
      if (!quiet) setGlobalErr(err.message);
    } finally {
      if (sessionsAbortRef.current === controller) {
        if (!quiet) setRefreshing(false);
      }
    }
  }, [apiKey, sessionLimit, plan.daily]);

  useEffect(() => { if (apiKey) fetchSessions(); }, [apiKey, fetchSessions]);

  useEffect(() => {
    return () => {
      if (sessionsAbortRef.current) sessionsAbortRef.current.abort();
    };
  }, []);

  // Combined polling: use activePollInterval if any session is in progress, else pollInterval
  const isBoosted = useMemo(() => sessions.some(s => ACTIVE_STATES.has(s.state)) && activePollInterval > 0, [sessions, activePollInterval]);
  const effectivePollInterval = useMemo(() => {
    if (!apiKey) return 0;
    return isBoosted ? activePollInterval : pollInterval;
  }, [apiKey, isBoosted, activePollInterval, pollInterval]);

  const countdown = useAutoPoll(effectivePollInterval, useCallback(() => fetchSessions(true), [fetchSessions]));

  const handleSessionUpdate = useCallback(updated => {
    const lastState = lastStates.current.get(updated.id);
    if (loadNotify() && lastState && lastState !== updated.state) {
      const label = updated.title || updated.prompt || updated.id;
      if (updated.state === "AWAITING_PLAN_APPROVAL") sendNotification("PLAN READY", `Session: ${label}`, updated.id);
      else if (updated.state === "AWAITING_USER_FEEDBACK") sendNotification("INPUT NEEDED", `Session: ${label}`, updated.id);
      else if (updated.state === "COMPLETED") sendNotification("SESSION DONE", `Session: ${label}`, updated.id);
      else if (updated.state === "FAILED") sendNotification("SESSION FAILED", `Session: ${label}`, updated.id);
    }
    lastStates.current.set(updated.id, updated.state);
    setSessions(prev => prev.map(s=>s.id===updated.id?updated:s));
  }, []);

  const handleStatsUpdate = useCallback((id, stats) => {
    setActivityStatsMap(prev => ({ ...prev, [id]: stats }));
  }, []);

  const handleDelete = useCallback(id => {
    lastStates.current.delete(id);
    setSessions(prev => prev.filter(s=>s.id!==id));
    try { SafeStorage.clearFollowupDraft(id); } catch {}
    setDraftsMap(prev => {
      if (!prev[id]) return prev;
      const next = { ...prev };
      delete next[id];
      return next;
    });
    setSelected(null);
    setDesktop("empty");
    setMobile("list");
  }, []);

  const handleSelect = useCallback(s => {
    setSelected(s);
    // If selected from supplemental, ensure it doesn't duplicate if primary list updates
    const ts = s.updateTime || s.createTime;
    setReadMap(prev => ({ ...prev, [s.id]: ts }));
    if (isDesktop) setDesktop("detail"); else setMobile("detail");
  }, [isDesktop]);

  const handleCreate = useCallback(s => {
    registerSession(s);
    lastStates.current.set(s.id, s.state);
    setSessions(prev => [s, ...prev]);
    setSelected(s);
    if (isDesktop) setDesktop("detail"); else setMobile("list");
  }, [isDesktop, registerSession]);

  const saveKey = k => {
    SafeStorage.saveApiKey(k);
    lastFetchTime.current = null;
    setApiKey(k);
  };

  if (!apiKey) {
    return (
      <Shell>
        <SetupScreen onSave={saveKey}/>
      </Shell>
    );
  }

  // ── Desktop layout: sidebar + main ──────────────────────────────────────────
  if (isDesktop) {
    return (
      <Shell desktop>
        {/* Sidebar */}
        <div style={{width:320,flexShrink:0,borderRight:`1px solid ${T.border}`,display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
          <SessionList
            onSelect={handleSelect} onRefresh={()=>fetchSessions(false)}
            refreshing={refreshing} justRefreshed={justRefreshed} selectedId={selected?.id}
            isDesktop onNew={()=>setDesktop("new")}
            onDrafts={()=>setDesktop("drafts")}
            onSettings={()=>setDesktop("settings")}
            pollInterval={effectivePollInterval}
            sessionLimit={sessionLimit}
            countdown={countdown}
            plan={plan} todayCount={todayCount}
            searchQuery={searchQuery} setSearchQuery={setSearchQuery}
            archivedIds={archivedIds} showArchived={showArchived} setShowArchived={setShowArchived}
            activitiesMap={{...activitiesMap}}
            activityStatsMap={activityStatsMap}
            sessions={allSessions}
            error={globalErr} clearError={() => setGlobalErr(null)}
            isBoosted={isBoosted}
            readMap={readMap}
            draftsMap={draftsMap}
            ignoredIds={ignoredIds}
          />
        </div>
        {/* Main panel */}
        <div style={{flex:1,display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden",minWidth:0}}>
          {desktopView==="empty"&&(
            <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:32}}>
              <div style={{width:48,height:48,borderRadius:11,background:T.brandDim,border:`1px solid ${T.brand}25`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'JetBrains Mono',monospace",fontSize:26,fontWeight:900,color:T.brand}}>J</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:T.textDim,textAlign:"center",lineHeight:2}}>
                SELECT A SESSION ←{"\u00A0"}{"\u00A0"}OR{"\u00A0"}{"\u00A0"}NEW ↖
              </div>
            </div>
          )}
          {desktopView==="detail"&&selected&&(
            <SessionDetail key={selected.id} session={selected} apiKey={apiKey}
              personas={personas}
              allSessions={allSessions}
              activitiesMap={activitiesMap}
              onBack={()=>setDesktop("empty")} onDelete={handleDelete}
              onSessionUpdate={handleSessionUpdate}
              onStatsUpdate={handleStatsUpdate}
              isDesktop
              pollInterval={actPollInterval} setPollInterval={setActPollInterval}
              cacheLimit={cacheLimit} activityLimit={activityLimit}
              isArchived={archivedIds.has(selected.id)}
              onArchive={handleArchive} onUnarchive={handleUnarchive}
              onIgnore={handleIgnore}
              onDraftChange={handleDraftChange}/>
          )}
          {desktopView==="new"&&(
            <NewSession
              apiKey={apiKey} personas={personas}
              onBack={()=>setDesktop("empty")}
              onCreate={handleCreate}
              isDesktop plan={plan} todayCount={todayCount}
              allSessions={allSessions} activitiesMap={activitiesMap}
              initialDraft={selectedDraft}
              onDraftSaved={() => { setSelectedDraft(null); if (desktopView === "new") setDesktop("drafts"); }}
            />
          )}

          {desktopView==="drafts"&&(
            <DraftsBox
              onBack={()=>setDesktop("empty")}
              isDesktop
              allSessions={allSessions}
              activitiesMap={activitiesMap}
              draftsMap={draftsMap}
              onDraftChange={handleDraftChange}
              onSelectSession={handleSelect}
              onResume={(d) => { setSelectedDraft(d); setDesktop("new"); }}
              onCreate={async (d) => {
                setSelectedDraft(d);
                setDesktop("new");
                // The actual creation happens inside NewSession but we can also trigger a direct create here if we want.
                // Resuming into NewSession is safer to allow final tweaks.
              }}
            />
          )}

          {desktopView==="network"&&( <NetworkMonitor onBack={()=>setDesktop("empty")} isDesktop/> )} {desktopView==="settings"&&(
            <SettingsView onBack={()=>setDesktop("empty")} isDesktop
              apiKey={apiKey} setApiKey={setApiKey}
              githubToken={githubToken} setGithubToken={setGithubToken}
              ghRateLimitedReset={ghRateLimitedReset}
              settings={settings}
              personas={personas} setPersonas={setPersonas}
              todayCount={todayCount} />
          )}
        </div>
      </Shell>
    );
  }

  // ── Mobile layout: single panel + bottom nav ──────────────────────────────
  return (
    <Shell>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>
        {mobileScreen==="list"&&(
          <SessionList sessions={allSessions} onSelect={handleSelect} onRefresh={()=>fetchSessions(false)}
            refreshing={refreshing} justRefreshed={justRefreshed} selectedId={selected?.id} isDesktop={false}
            onNew={() => { setSelectedDraft(null); setMobile("new"); }}
            onDrafts={()=>setMobile("drafts")}
            onSettings={()=>setMobile("settings")}
            pollInterval={effectivePollInterval}
            sessionLimit={sessionLimit}
            countdown={countdown}
            plan={plan} todayCount={todayCount}
            searchQuery={searchQuery} setSearchQuery={setSearchQuery}
            archivedIds={archivedIds} showArchived={showArchived} setShowArchived={setShowArchived}
            activitiesMap={activitiesMap}
            activityStatsMap={activityStatsMap}
            error={globalErr} clearError={() => setGlobalErr(null)}

            isBoosted={isBoosted}
            readMap={readMap}
            draftsMap={draftsMap}
            ignoredIds={ignoredIds} />
        )}
        {mobileScreen==="detail"&&selected&&(
          <SessionDetail key={selected.id} session={selected} apiKey={apiKey}
            personas={personas}
            allSessions={allSessions}
            activitiesMap={activitiesMap}
            onBack={()=>{ setMobile("list"); fetchSessions(true); }}
            onDelete={handleDelete} onSessionUpdate={handleSessionUpdate}
            onStatsUpdate={handleStatsUpdate}
            isDesktop={false}
            pollInterval={actPollInterval} setPollInterval={setActPollInterval}
            cacheLimit={cacheLimit} activityLimit={activityLimit}
            isArchived={archivedIds.has(selected.id)}
            onArchive={handleArchive} onUnarchive={handleUnarchive}
            onIgnore={handleIgnore}
            onDraftChange={handleDraftChange}/>
        )}
        {mobileScreen==="new"&&(
          <NewSession
            apiKey={apiKey} personas={personas}
            onBack={()=>setMobile("list")}
            onCreate={s=>{ setSessions(prev=>[s,...prev]); setMobile("list"); }}
            isDesktop={false} plan={plan} todayCount={todayCount}
            allSessions={allSessions} activitiesMap={activitiesMap}
            initialDraft={selectedDraft}
            onDraftSaved={() => { setSelectedDraft(null); if (mobileScreen === "new") setMobile("drafts"); }}
          />
        )}

        {mobileScreen==="drafts"&&(
          <DraftsBox
            onBack={()=>setMobile("list")}
            isDesktop={false}
            allSessions={allSessions}
            activitiesMap={activitiesMap}
            draftsMap={draftsMap}
            onDraftChange={handleDraftChange}
            onSelectSession={handleSelect}
            onResume={(d) => { setSelectedDraft(d); setMobile("new"); }}
            onCreate={async (d) => {
              setSelectedDraft(d);
              setMobile("new");
            }}
          />
        )}

        {mobileScreen==="network"&&( <NetworkMonitor onBack={()=>setMobile("list")} isDesktop={false}/> )} {mobileScreen==="settings"&&(
          <SettingsView onBack={()=>setMobile("list")} isDesktop={false}
            apiKey={apiKey} setApiKey={setApiKey}
            githubToken={githubToken} setGithubToken={setGithubToken}
            ghRateLimitedReset={ghRateLimitedReset}
            settings={settings}
            personas={personas} setPersonas={setPersonas}
            todayCount={todayCount} />
        )}
      </div>
      <nav style={{display:"flex",borderTop:`1px solid ${T.border}`,background:T.surface,transform:"translateZ(0)",flexShrink:0}}>
        {[
          {id:"list",    n:"tasks", label:"SESSIONS", onClick:() => {
            const wasDetail = lastSessionScreen === "detail" && selected && !archivedIds.has(selected.id);
            setShowArchived(false);
            setMobile(wasDetail ? "detail" : "list");
          }},
          {id:"archive", n:"archive", label:"ARCHIVE", onClick:() => {
            const wasDetail = lastSessionScreen === "detail" && selected && archivedIds.has(selected.id);
            setShowArchived(true);
            setMobile(wasDetail ? "detail" : "list");
          }},
          {id:"new",     n:"plus",  label:"NEW", onClick:() => { setSelectedDraft(null); setMobile("new"); }},
          {id:"drafts",  n:"layers", label:"DRAFTS", onClick:() => setMobile("drafts")},
          {id:"settings",n:"settings", label:"SETTINGS", onClick:() => setMobile("settings")},
        ].map(({id,n,label,onClick})=>{
          const isAct = (id === "list" && !showArchived && (mobileScreen === "list" || mobileScreen === "detail")) ||
                        (id === "archive" && showArchived && (mobileScreen === "list" || mobileScreen === "detail")) ||
                        (mobileScreen === id && id !== "list" && id !== "archive");

          const hasAlert = id==="list"&&sessions.some(s=>["AWAITING_PLAN_APPROVAL","AWAITING_USER_FEEDBACK"].includes(s.state));
          return (
            <button key={id} onClick={onClick} style={{flex:1,padding:"11px 0 13px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{position:"relative"}}>
                <Ic n={n} s={22} c={isAct?T.brand:T.muted}/>
                {hasAlert&&<div style={{position:"absolute",top:-2,right:-4,width:7,height:7,borderRadius:"50%",background:T.purple,border:`1.5px solid ${T.surface}`,animation:"dot 1.5s ease-in-out infinite"}}/>}
              </div>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:isAct?T.brand:T.muted,fontWeight:isAct?700:400,letterSpacing:"0.07em"}}>{label}</span>
            </button>
          );
        })}
      </nav>
    </Shell>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, errorInfo) { console.error("Uncaught component error:", error, errorInfo); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ height: "100vh", background: "#07090c", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, textAlign: "center" }}>
          <div style={{ width: 60, height: 60, background: T.redDim, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 20 }}>
            <Ic n="x" s={30} c={T.red} />
          </div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 18, fontWeight: 900, color: "#fff", marginBottom: 10 }}>APPLICATION CRASHED</div>
          <div style={{ fontFamily: "'IBM Plex Sans',sans-serif", fontSize: 14, color: T.textDim, marginBottom: 30, maxWidth: 400 }}>
            An unexpected error occurred in the UI. You can try to reload or perform a hard reset if the issue persists.
          </div>
          <div style={{ background: "#040507", border: `1px solid ${T.border}`, borderRadius: 8, padding: 12, marginBottom: 30, width: "100%", maxWidth: 500, overflow: "auto", maxHeight: 200 }}>
            <pre style={{ margin: 0, fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: T.red, textAlign: "left" }}>
              {this.state.error?.toString()}
            </pre>
          </div>
          <div style={{ display: "flex", gap: 12 }}>
            <Btn onClick={() => location.reload()} sm>RELOAD APP</Btn>
            <Btn onClick={() => handleEmergencyReset()} sm color={T.red} outline>HARD RESET</Btn>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Shell ────────────────────────────────────────────────────────────────────
function Shell({ children, desktop=false }) {
  // Dismiss the pre-React splash screen on first paint
  useEffect(() => {
    const splash = document.getElementById("splash");
    if (!splash) return;
    // Fast-complete the progress bar then fade out
    const bar = document.getElementById("splash-bar");
    if (bar) { bar.style.animation = "none"; bar.style.width = "100%"; bar.style.transition = "width .18s ease"; }
    const hint = document.getElementById("splash-hint");
    if (hint) hint.textContent = "READY";
    const t = setTimeout(() => { splash.classList.add("hidden"); }, 180);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{
      width:"100%",background:T.bg,display:"flex",isolation:"isolate",
      fontFamily:"'IBM Plex Sans',sans-serif",overflow:"hidden",
      ...(desktop
        ? { minHeight:"100vh", flexDirection:"row" }
        : { width:"100%", height:"100dvh", flexDirection:"column" }
      ),
    }}>
      <style>{`
        ::-webkit-scrollbar{width:3px;height:3px;}
        ::-webkit-scrollbar-thumb{background:${T.dim};border-radius:3px;}
        ::-webkit-scrollbar-track{background:transparent;}
        select,input,textarea{color-scheme:dark;}
        option{background:${T.surface};color:${T.text};}
        @keyframes dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
        @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        @keyframes zoomIn{from{transform:scale(0.95);opacity:0;}to{transform:scale(1);opacity:1;}}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        @keyframes shimmerPulse {
          0% { opacity: 0.7; transform: translateY(4px); }
          50% { opacity: 1; transform: translateY(-2px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes barShimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        @keyframes barIndeterminate {
          0% { left: -35%; }
          100% { left: 100%; }
        }
        @keyframes pulseRepo {
          0% { border-color: ${T.brand}40; box-shadow: 0 0 0 ${T.brand}00; }
          50% { border-color: ${T.brand}; box-shadow: 0 0 25px ${T.brand}80; transform: scale(1.02); }
          100% { border-color: ${T.brand}40; box-shadow: 0 0 0 ${T.brand}00; }
        }
        @media (prefers-reduced-motion: reduce) {
          *, ::before, ::after {
            animation-delay: -1ms !important;
            animation-duration: 1ms !important;
            animation-iteration-count: 1 !important;
            background-attachment: initial !important;
            scroll-behavior: auto !important;
            transition-duration: 0s !important;
            transition-delay: 0s !important;
          }
        }
        ::selection{background:${T.brandDim};color:${T.brand};}
        textarea::placeholder,input::placeholder{color:${T.muted};}
        button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible, [role="button"]:focus-visible, [tabindex="0"]:focus-visible {
          outline: 2px solid ${T.brand} !important;
          outline-offset: 2px !important;
          box-shadow: 0 0 0 4px ${T.brandDim} !important;
        }

        @media screen and (max-width: 767px) and (orientation: landscape) {
          body { display: flex; align-items: center; justify-content: center; text-align: center; }
          body > #root { display: none; }
          body::after {
            content: "PLEASE ROTATE YOUR PHONE TO PORTRAIT MODE";
            font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: ${T.brand};
            padding: 40px; letter-spacing: 0.1em; line-height: 1.6;
          }
        }
      `}</style>
      <PWABanner/>
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <JulesClient/>
  </ErrorBoundary>
);
</script>
</body>

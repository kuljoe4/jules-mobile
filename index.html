const Markdown = memo(({ text }) => {
  if (!text) return null;
  const parts = text.split(/```/g);
  return parts.map((part, i) => {
    if (i % 2 === 1) { // Code block
      const lines = part.split("\n");
      let lang = lines[0].trim();
      let content = lines.slice(1).join("\n").trim();
      if (!content && lines.length > 0) { content = lines.join("\n").trim(); lang = ""; }

      return (
        <div key={i} style={{
          margin:"10px 0", background:"#040507", border:`1px solid ${T.border}`,
          borderRadius:6, overflow:"hidden", fontFamily:"'JetBrains Mono',monospace", fontSize:13,
        }}>
          {lang && (
            <div style={{padding:"4px 10px", background:T.surface, borderBottom:`1px solid ${T.border}33`, fontSize:11, color:T.textDim, textTransform:"uppercase", letterSpacing:"0.05em"}}>
              {lang}
            </div>
          )}
          <div style={{padding:"12px", color:T.text, whiteSpace:"pre-wrap", overflowWrap:"break-word", wordBreak:"break-word"}}>
            {content}
          </div>
        </div>
      );
    }

    // Process lists and bold text in standard text parts
    const lines = part.split("\n");
    return (
      <span key={i} style={{whiteSpace:"pre-wrap", overflowWrap:"break-word", wordBreak:"break-word"}}>
        {lines.map((line, li) => {
          const trimmed = line.trim();
          if (!trimmed && li > 0 && li < lines.length - 1) return <div key={li} style={{height: 12}} />;
          if (!trimmed) return <div key={li} />;

          const isListItem = trimmed.startsWith("- ") || trimmed.startsWith("* ");
          const isNumItem = /^\d+\.\s/.test(trimmed);
          const isHeader = trimmed.endsWith(":") && !isListItem && !isNumItem && trimmed.length < 80;

          // Support for **bold** text
          const processBold = (txt) => {
            if (typeof txt !== 'string' || !txt.includes("**")) return txt;
            const segments = txt.split("**");
            return segments.map((seg, si) => si % 2 === 1 ? <strong key={si} style={{color:T.textHi, fontWeight:700}}>{seg}</strong> : seg);
          };

          let content = line;

          if (isListItem) {
            const bullet = trimmed.startsWith("- ") ? "- " : "* ";
            const rest = trimmed.substring(bullet.length);
            content = (
              <div style={{display:"flex", gap:12, marginBottom:8, paddingLeft:4, alignItems:"flex-start"}}>
                <div style={{width:6, height:6, borderRadius:"50%", background:T.brand, marginTop:7, flexShrink:0, boxShadow:`0 0 10px ${T.brand}60`}}/>
                <span style={{flex:1, color:T.text, lineHeight:1.6}}>{processBold(rest)}</span>
              </div>
            );
          } else if (isNumItem) {
            const match = trimmed.match(/^(\d+\.\s)(.*)/);
            const num = match[1];
            const rest = match[2];
            content = (
              <div style={{display:"flex", gap:8, marginBottom:8, paddingLeft:2, alignItems:"flex-start"}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:900, color:T.brandLight, flexShrink:0, width:22}}>{num}</span>
                <span style={{flex:1, color:T.text, lineHeight:1.6}}>{processBold(rest)}</span>
              </div>
            );
          } else if (isHeader) {
            content = (
              <div style={{
                fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:900,
                color:T.brandLight, letterSpacing:"0.08em", marginTop:li===0?0:22, marginBottom:12,
                textTransform:"uppercase", borderBottom:`2px solid ${T.brand}25`,
                display:"inline-block", paddingBottom:4
              }}>{processBold(trimmed)}</div>
            );
          } else {
            content = <div style={{lineHeight:1.6, color:T.textDim, marginBottom:4}}>{processBold(line)}</div>;
          }

          return <div key={li}>{content}</div>;
        })}
      </span>
    );
  });
});

  return (
    <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:8 }}>
      {mediaItems.map((a, i) => {
        const isVideo = (a.media.mimeType || "").includes("video") || (a.media.mimeType || "").includes("webm");
        return (
          <button
            key={i}
            onClick={() => onMediaClick?.({ ...a.media, ts })}

});

const ChatBubble = memo(({ act, type, onMediaClick, onEdit, onReply, forceExpanded = false }) => {
  const isUser = type === "userMessaged";

  const isTemp = act._temp === true;

    if (copied) return;
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });

  const key = getActKey(act);

    <div id={`chat-activity-${key}`} style={{ marginBottom: 24, width: "100%", animation: "fadeIn .25s ease-out" }}>

const TimelineEvent = memo(({ act, onMediaClick, onReply }) => {
  const type = getActType(act);
  const isMajor = ["sessionCompleted", "sessionFailed", "planGenerated", "planApproved"].includes(type);
  const desc = act.progressUpdated?.description || "";
  const isPush = type === "progressUpdated" && (desc.toLowerCase().includes("pushed") || desc.toLowerCase().includes("pushing"));

  const IC_MAP = {
    planGenerated:{n:"plan",c:T.purple},
    planApproved:{n:"approve",c:T.brandLight},
    progressUpdated:{n:isPush?"branch":"refresh",c:isPush?T.blue:T.muted},
    sessionCompleted:{n:"check",c:T.brandLight},
    sessionFailed:{n:"x",c:T.red},
    system:{n:"code",c:T.muted},
  };
  const ic  = { ...(IC_MAP[type] || IC_MAP.system) };
  const time = fmtTime(parseDateMs(act.createTime));

  let title = "", detail = null;
  switch (type) {
    case "planGenerated": {
      const plan = act.planGenerated?.plan;
      title = "Plan generated";
      detail = plan?.steps && (
        <div style={{marginTop:10}}>
          {plan.steps.map((st,i) => (
            <div key={st.id||i} style={{display:"flex",gap:8,marginBottom:12,alignItems:"flex-start"}}>
              <div style={{
                width:20,height:20,borderRadius:3,flexShrink:0,
                background:T.purpleDim,border:`1px solid ${T.purple}40`,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:T.purple,
                marginTop: 1,
              }}>{i+1}</div>
              <div style={{flex: 1, minWidth: 0}}>
                <div style={{fontSize:14,color:T.text,fontWeight:700,lineHeight:1.5,wordBreak:"break-word",marginBottom:4}}>{st.title}</div>
                {st.description&&<div style={{fontSize:13,color:T.textDim,lineHeight:1.6,wordBreak:"break-word"}}>{st.description}</div>}
              </div>
            </div>
          ))}
        </div>
      );
      break;
    }
    case "progressUpdated": {
      const p = act.progressUpdated;
      const lowerT = (p?.title || "").toLowerCase();
      const isReview = lowerT.includes("review");
      const isMerge = lowerT.includes("merge");
      const isResearch = lowerT.includes("research");
      const isPush = lowerT.includes("pushed") || lowerT.includes("pushing");
      const highlight = isReview || isMerge || isResearch || isPush;
      title = p?.title || "Progress";
      detail = act.progressUpdated?.description && (
        <div style={{
          fontSize:14, color:highlight?T.text:T.muted,
          lineHeight:isReview?1.75:1.6, padding:highlight?"20px 24px":"0",
          background:isReview?`linear-gradient(165deg, ${T.brand}0d, ${T.surface}44)` : isMerge?`${T.purple}0a`:isResearch?`${T.amber}0a`:isPush?`${T.blue}0a`:"transparent",
          border:isReview?`1px solid ${T.brand}35`:isMerge?`1px solid ${T.purple}15`:isResearch?`1px solid ${T.amber}15`:isPush?`1px solid ${T.blue}15`:"none",
          borderRadius:highlight?12:0,
          boxShadow:isReview?`0 16px 48px ${T.brandDark}15, inset 0 0 20px ${T.brand}05` : (highlight?"inset 0 0 12px rgba(255,255,255,0.01)":"none"),
          fontFamily:"'IBM Plex Sans',sans-serif",
          letterSpacing:isReview?"0.015em":"0",
        }}>
          {highlight && (
            <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:12}}>
              <span style={{

                background:isReview?T.brandDim:(isMerge?T.purpleDim:(isResearch?T.amberDim:(isPush?T.blueDim:T.muted))),
                color:isReview?T.brandLight:(isMerge?T.purple:(isResearch?T.amber:(isPush?T.blue:T.muted))),
                fontSize:10, fontWeight:800, letterSpacing:"0.05em"
              }}>{isReview?"REVIEW":isMerge?"MERGE":isResearch?"RESEARCH":isPush?"PUSH":"EVENT"}</span>
              <div style={{height:1, flex:1, background:`linear-gradient(90deg, ${isReview?T.brandLight:(isMerge?T.purple:(isResearch?T.amber:(isPush?T.blue:T.muted)))}30, transparent)`}}/>

const MediaModal = ({ media, onClose }) => {
  if (!media) return null;

  const handleDownload = (e) => {
    e.stopPropagation();
    const link = document.createElement("a");
    link.href = `data:${media.mimeType};base64,${media.data}`;
    link.download = `jules-artifact-${Date.now()}.${media.mimeType.split("/")[1] || "png"}`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const isVideo = (media.mimeType || "").includes("video") || (media.mimeType || "").includes("webm");
  const dataSize = media.data ? media.data.length * 0.75 : 0; // Approx base64 to bytes

  return (
    <div
      onClick={onClose}
      style={{
        position:"fixed", inset:0, zIndex:10000,
        background:"rgba(4,5,7,0.95)", backdropFilter:"blur(10px)",
        display:"flex", flexDirection:"column",
        animation:"fadeIn .2s ease",
      }}
    >
      <style>{`
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      `}</style>

      {/* Header */}
      <div style={{
        display:"flex", alignItems:"center", gap:12, padding:"16px 20px",
        background:"linear-gradient(to bottom, rgba(7,9,12,0.8), transparent)",
      }}>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:T.text, fontWeight:700 }}>
            MEDIA ARTIFACT
          </div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:T.textDim }}>
            {media.mimeType} · {fmtBytes(dataSize/1024)} · {fmtTime(parseDateMs(media.ts))}
          </div>
        </div>
        <button
          onClick={handleDownload}
          style={{
            background:T.surfaceHi, border:`1px solid ${T.borderHi}`, borderRadius:8,
            padding:"8px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:8,
            color:T.brand, fontFamily:"'JetBrains Mono',monospace", fontSize:12, fontWeight:700,
          }}
        >
          <Ic n="download" s={14} c={T.brand}/>
          SAVE
        </button>
        <button
          onClick={onClose}
          title="Close Preview"
          aria-label="Close Preview"
          style={{
            background:T.surfaceHi, border:`1px solid ${T.borderHi}`, borderRadius:8,
            padding:"8px", cursor:"pointer", display:"flex",
          }}
        >
          <Ic n="x" s={18} c={T.text}/>
        </button>
      </div>

      {/* Content */}
      <div style={{
        flex:1, display:"flex", alignItems:"center", justifyContent:"center",
        padding:20, overflow:"hidden",
      }}>
        {isVideo ? (
          <video
            src={`data:${media.mimeType};base64,${media.data}`}
            controls autoPlay loop playsInline
            style={{
              maxWidth:"100%", maxHeight:"100%", objectFit:"contain",
              borderRadius:4, boxShadow:"0 20px 50px rgba(0,0,0,0.5)",
              animation:"zoomIn .25s cubic-bezier(0.2, 0, 0.2, 1)",
            }}
            onClick={(e) => e.stopPropagation()}
          />
        ) : (
          <img
            src={`data:${media.mimeType};base64,${media.data}`}
            alt="artifact-preview"
            style={{
              maxWidth:"100%", maxHeight:"100%", objectFit:"contain",
              borderRadius:4, boxShadow:"0 20px 50px rgba(0,0,0,0.5)",
              animation:"zoomIn .25s cubic-bezier(0.2, 0, 0.2, 1)",
            }}
            onClick={(e) => e.stopPropagation()}
          />
        )}
      </div>

      {/* Footer / Hint */}
      <div style={{
        padding:20, textAlign:"center", fontFamily:"'JetBrains Mono',monospace",
        fontSize:11, color:T.textDim, letterSpacing:"0.05em",
      }}>
        TAP OUTSIDE TO CLOSE
      </div>
    </div>
  );
};

// ─── Activity Feed ────────────────────────────────────────────────────────────
const COLLAPSE_THRESHOLD = 35;
const COLLAPSE_SHOW      = 25;

const ActivityFeed = memo(({ activities, showAll, onShowAll, onMediaClick, onEditMessage, onReply, driftSessions = [], justUpdated = false, scrolledActivityId = null }) => {
  const collapse  = !showAll && activities.length > COLLAPSE_THRESHOLD;

  // OPTIMIZATION: Memoize the sliced visible activities array. Since activities is reference-stable
  // and collapse is a boolean, memoizing the slice prevents recreating a new array reference on
  // every render. This prevents downstream useMemo hooks (deduped, combined) from being re-evaluated
  // during active countdown ticks or parent polling ticks.
  const visible   = useMemo(() => {
    return collapse ? activities.slice(activities.length - COLLAPSE_SHOW) : activities;
  }, [activities, collapse]);

  const hidden    = activities.length - visible.length;

  const deduped = useMemo(() => {
    const list = [];
    let lastPKey = null;
    let lastType = null;
    for (const a of visible) {
      const type = getActType(a);
      if (type === "planApproved" && lastType === "planApproved") continue;
      if (type === "sessionCompleted" && lastType === "sessionCompleted") continue;

      if (a.progressUpdated) {
        const p = a.progressUpdated;
        const pKey = `${p.title || ""}:${p.description || ""}`;
        if (lastPKey === pKey) continue;
        lastPKey = pKey;
      } else {
        lastPKey = null;
      }
      list.push(a);
      lastType = type;
    }
    return list;
  }, [visible]);

  const combined = useMemo(() => {
    const list = [...deduped.map(a => ({ type: "activity", data: a, ts: parseDateMs(a.createTime) }))];
    driftSessions.forEach(s => {
      list.push({ type: "drift", data: s, ts: parseDateMs(s.updateTime || s.createTime) });
    });
    return list.sort((a, b) => a.ts - b.ts);
  }, [deduped, driftSessions]);

  return (
    <>
      {collapse && (
        <button onClick={onShowAll} style={{
          display:"block",width:"100%",marginBottom:14,
          background:T.surfaceHi,border:`1px solid ${T.border}`,
          borderRadius:6,padding:"8px 12px",cursor:"pointer",
          fontFamily:"'JetBrains Mono',monospace",fontSize:11,
          color:T.textDim,textAlign:"center",letterSpacing:"0.08em",
        }}>
          ↑ SHOW {hidden} EARLIER {hidden===1?"EVENT":"EVENTS"}
        </button>
      )}
      {combined.map((item, idx) => {
        if (item.type === "drift") {
          return (
            <div key={`drift-${item.data.id}-${idx}`} style={{
              margin: "12px 0 20px", padding: "10px 14px", background: "rgba(252, 211, 77, 0.03)",
              border: `1px dashed ${T.amber}30`, borderRadius: 8, display: "flex", gap: 10, alignItems: "center"
            }}>
              <div style={{ width: 20, height: 20, borderRadius: "50%", background: T.amberDim, display: "flex", alignItems: "center", justifyContent: "center", border: `1px solid ${T.amber}40` }}>
                <Ic n="wifi" s={11} c={T.amber}/>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontFamily: "'JetBrains Mono',monospace", fontSize: 10, fontWeight: 800, color: T.amber, letterSpacing: "0.05em",
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap"
                }} title={item.data.title || item.data.prompt}>
                  BASE DRIFT · {item.data.title || item.data.prompt}
                </div>
                <div style={{ fontFamily: "'IBM Plex Sans',sans-serif", fontSize: 11, color: T.dim }}>
                  Merged {fmtAgo(item.ts)}
                </div>
              </div>
            </div>
          );
        }
        const act = item.data;
        const type = getActType(act);
        const key  = getActKey(act);
        if (type === "userMessaged" || type === "agentMessaged") {
          return <ChatBubble key={key} act={act} type={type} onMediaClick={onMediaClick} onEdit={onEditMessage} onReply={onReply} forceExpanded={scrolledActivityId === key}/>;
        }
        return (
          <div key={key} id={`chat-activity-${key}`} style={{
            animation: justUpdated && idx >= combined.length - 5 ? "shimmerPulse 0.8s ease-out" : "none"
          }}>
            <TimelineEvent act={act} onMediaClick={onMediaClick} onReply={onReply}/>
          </div>
        );
      })}
    </>
  );
});

// ─── Interactive Plan View ────────────────────────────────────────────────────
// Lets the user review steps, annotate individual ones, compose a revision
// request via sendMessage, or approve the plan directly.
const PlanView = memo(({ activities, session, apiKey, onApprove, onSendFeedback, busy, allSessions = [], activitiesMap = {} }) => {
  const [stepNotes, setStepNotes]     = useState({}); // stepId → note string
  const [activeNote, setActiveNote]   = useState(null); // stepId currently expanded
  const [globalNote, setGlobalNote]   = useState("");
  const [sending, setSending]         = useState(false);
  const [sent, setSent]               = useState(false);

  // Find the most recent planGenerated activity
  const planAct = useMemo(() => {
    for (let i = activities.length - 1; i >= 0; i--) {
      if (activities[i].planGenerated?.plan) return activities[i];
    }
    return null;
  }, [activities]);

  const plan  = planAct?.planGenerated?.plan;
  const steps = plan?.steps || [];

  // Check if plan already approved in activity history (must be after the plan was generated)
  const approved = useMemo(() => {
    if (!planAct) return false;
    const planTs = parseDateMs(planAct.createTime);
    return activities.some(a => a.planApproved && parseDateMs(a.createTime) >= planTs);
  }, [activities, planAct]);

  const hasFeedback = globalNote.trim() || Object.values(stepNotes).some(n => n.trim());

  const buildFeedbackMessage = () => {
    const parts = ["Please revise the plan based on my feedback:"];
    const stepFeedback = steps
      .filter(st => stepNotes[st.id]?.trim())
      .map((st, i) => `Step ${i + 1} (${st.title}): ${stepNotes[st.id].trim()}`);
    if (stepFeedback.length) parts.push(...stepFeedback);
    if (globalNote.trim()) parts.push("Overall: " + globalNote.trim());
    return parts.join("\n");
  };

  const handleRequestRevision = async () => {
    if (!hasFeedback || sending) return;
    setSending(true);
    try {
      await onSendFeedback(buildFeedbackMessage());
      setStepNotes({});
      setGlobalNote("");
      setActiveNote(null);
      setSent(true);
      setTimeout(() => setSent(false), 3000);
    } finally { setSending(false); }
  };

  if (!plan) return (
    <div style={{textAlign:"center",padding:"50px 24px",fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:T.textDim}}>
      {session.state === "PLANNING" ? "Jules is generating a plan…" : "No plan available"}
    </div>
  );

  const pendingApproval = session.state === "AWAITING_PLAN_APPROVAL";
  const annotatedCount  = Object.values(stepNotes).filter(n=>n.trim()).length;

  return (
    <div style={{paddingBottom:16}}>
      <ConflictRadar
        currentSource={session.sourceContext?.source}
        currentBranch={session.sourceContext?.githubRepoContext?.startingBranch}
        currentPrompt={session.prompt}
        allSessions={allSessions}
        activitiesMap={activitiesMap}
        currentSessionId={session.id}
        startTime={parseDateMs(session.createTime)}
      />

      {/* Plan header */}
      <div style={{
        marginBottom:14,padding:"10px 14px",borderRadius:7,
        background:approved?T.brandDim:pendingApproval?T.purpleDim:T.surfaceHi,
        border:`1px solid ${approved?T.brand+"40":pendingApproval?T.purple+"40":T.border}`,
      }}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:approved||!pendingApproval?0:8}}>
          <div style={{flex:1,fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:700,
            color:approved?T.brand:pendingApproval?T.purple:T.muted,letterSpacing:"0.06em"}}>
            {approved?"✓ PLAN APPROVED":pendingApproval?"PLAN READY FOR REVIEW":"PLAN PREVIEW"}
          </div>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:T.textDim}}>
            {steps.length} step{steps.length!==1?"s":""}
          </span>
        </div>
        {pendingApproval&&!approved&&(
          <div style={{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:14,color:T.textDim,lineHeight:1.5}}>
            Review each step below. Tap a step to add feedback, then request a revision or approve.
          </div>
        )}
      </div>

      {/* Steps */}
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
        {steps.map((st, i) => {
          const note     = stepNotes[st.id] || "";
          const isOpen   = activeNote === st.id;
          const hasNote  = note.trim().length > 0;

          return (
            <div key={st.id||i} style={{
              background:T.surface,border:`1px solid ${hasNote?T.amber+"50":T.border}`,
              borderLeft:`2px solid ${hasNote?T.amber:T.purple+"60"}`,
              borderRadius:6,overflow:"hidden",transition:"border-color .15s cubic-bezier(0.4, 0, 0.2, 1)",
            }}>
              {/* Step row */}
              <div style={{display:"flex",gap:10,alignItems:"flex-start",padding:"10px 12px"}}>
                <div style={{
                  width:24,height:24,borderRadius:4,flexShrink:0,marginTop:1,
                  background:hasNote?T.amberDim:T.purpleDim,
                  border:`1px solid ${hasNote?T.amber+"50":T.purple+"40"}`,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,
                  color:hasNote?T.amber:T.purple,
                }}>{i+1}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:15,fontWeight:500,
                    color:T.text,lineHeight:1.35,marginBottom:st.description?10:0}}>
                    {st.title}
                  </div>
                  {st.description&&(
                    <div style={{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:13,color:T.textDim,lineHeight:1.45}}>
                      {st.description}
                    </div>
                  )}
                  {hasNote&&!isOpen&&(
                    <div style={{marginTop:5,padding:"4px 8px",borderRadius:4,
                      background:T.amberDim,border:`1px solid ${T.amber}30`,
                      fontFamily:"'IBM Plex Sans',sans-serif",fontSize:13,color:T.amber,lineHeight:1.4}}>
                      📝 {note}
                    </div>
                  )}
                </div>
                {pendingApproval&&!approved&&(
                  <button onClick={()=>setActiveNote(isOpen?null:st.id)} style={{
                    flexShrink:0,padding:"4px 8px",borderRadius:4,border:"none",cursor:"pointer",
                    background:isOpen?(hasNote?T.amberDim:T.purpleDim):"transparent",
                    outline:`1px solid ${isOpen?(hasNote?T.amber+"40":T.purple+"40"):T.border}`,
                    fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,
                    color:isOpen?(hasNote?T.amber:T.purple):T.muted,
                    transition:"all .12s cubic-bezier(0.4, 0, 0.2, 1)",letterSpacing:"0.06em",
                  }}>{hasNote?"EDIT":"NOTE"}</button>
                )}
              </div>

              {/* Per-step feedback textarea */}
              {isOpen&&pendingApproval&&!approved&&(
                <div style={{padding:"0 12px 12px",borderTop:`1px solid ${T.border}`}}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:T.amber,
                    letterSpacing:"0.08em",marginBottom:5,marginTop:8}}>FEEDBACK FOR STEP {i+1}</div>
                  <textarea
                    value={note}
                    onChange={e=>setStepNotes(prev=>({...prev,[st.id]:e.target.value}))}
                    placeholder={`What should change about this step? (e.g. "Use TypeScript instead of JS", "Skip this — not needed")`}
                    aria-label={`Feedback for Step ${i+1}`}
                    rows={2}
                    maxLength={5000}
                    style={{
                      width:"100%",background:T.surfaceHi,border:`1px solid ${T.amber}40`,
                      borderRadius:5,padding:"8px 10px",color:T.text,
                      fontFamily:"'IBM Plex Sans',sans-serif",fontSize:14,lineHeight:1.4,
                      resize:"vertical",outline:"none",boxSizing:"border-box",
                    }}
                    autoFocus
                  />
                  <button onClick={()=>setActiveNote(null)} style={{
                    marginTop:5,padding:"4px 10px",borderRadius:4,border:`1px solid ${T.border}`,
                    background:"transparent",cursor:"pointer",color:T.textDim,
                    fontFamily:"'JetBrains Mono',monospace",fontSize:11,
                  }}>DONE</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Global feedback + actions — only when pending approval */}
      {pendingApproval&&!approved&&(
        <div style={{
          background:T.surface,border:`1px solid ${T.border}`,
          borderRadius:7,padding:"12px 14px",
        }}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:T.textDim,
            letterSpacing:"0.08em",marginBottom:6}}>OVERALL FEEDBACK (optional)</div>
          <textarea
            value={globalNote}
            onChange={e=>setGlobalNote(e.target.value)}
            placeholder="Any overall comments before approving? (e.g. 'Make sure to run tests', 'Keep changes minimal')"
            aria-label="Overall comments or feedback"
            rows={2}
            maxLength={5000}
            style={{
              width:"100%",background:T.surfaceHi,border:`1px solid ${T.border}`,
              borderRadius:5,padding:"8px 10px",color:T.text,
              fontFamily:"'IBM Plex Sans',sans-serif",fontSize:14,lineHeight:1.4,
              resize:"vertical",outline:"none",boxSizing:"border-box",
              transition:"border-color .18s cubic-bezier(0.4, 0, 0.2, 1)",marginBottom:10,
            }}
          />

          {sent&&(
            <div style={{marginBottom:8,padding:"6px 10px",borderRadius:4,
              background:T.brandDim,border:`1px solid ${T.brand}40`,
              fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:T.brand}}>
              ✓ Revision request sent — Jules will update the plan
            </div>
          )}

          <div style={{display:"flex",gap:8}}>
            <Btn
              onClick={handleRequestRevision}
              disabled={!hasFeedback||sending||busy}
              color={T.amber} outline sm
              style={{flex:1}}
            >
              {sending?"SENDING…":`REVISE${annotatedCount>0?` (${annotatedCount} step${annotatedCount>1?"s":""})`:globalNote.trim()?" +note":""}`}
            </Btn>
            <Btn
              onClick={onApprove}
              disabled={busy||sending}
              color={T.purple} sm
              style={{flex:1}}
            >
              <Ic n="approve" s={11} c="#000"/>
              {busy?"APPROVING…":"APPROVE PLAN"}
            </Btn>
          </div>
          <div style={{marginTop:7,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:T.textDim,textAlign:"center",lineHeight:1.6}}>
            Revise → Jules rewrites the plan · Approve → Jules starts executing
          </div>
        </div>
      )}
    </div>
  );
});

// ─── Diff Viewer ──────────────────────────────────────────────────────────────
// Performance Optimized: Wrapped in React.memo to prevent expensive re-rendering
// and heavy virtual DOM diffing of large multi-line diff hunks on parent state
// updates (such as the 1-second timer ticks or polling updates) when props are unchanged.
const DiffViewer = memo(({ activities = [], isDesktop = false }) => {
  const [collapsed, setCollapsed] = useState(null); // null = auto-collapse all on first load
  const [copiedPaths, setCopiedPaths] = useState({}); // gi -> boolean
  const [copiedDiffs, setCopiedDiffs] = useState({}); // gi -> boolean
  const [copiedPlains, setCopiedPlains] = useState({}); // gi -> boolean

  const latestPatch = useMemo(() => {
    // Find only the most recent patch artifact
    for (let i = activities.length - 1; i >= 0; i--) {
      const a = activities[i];
      if (a.artifacts) {
        for (const art of a.artifacts) {
          if (art.changeSet?.gitPatch?.unidiffPatch) {
            return {
              patch: art.changeSet.gitPatch.unidiffPatch,
              gitPatch: art.changeSet.gitPatch,
              ts: a.createTime,
              id: a.id || i
            };
          }
        }
      }
    }
    return null;
  }, [activities]);

  const groups = useMemo(() => {
    if (!latestPatch) return [];
    return parseUnidiffPatch(latestPatch.gitPatch || latestPatch.patch, latestPatch.ts);
  }, [latestPatch]);

  const safeCollapsed = useMemo(() => {
    if (collapsed !== null) return collapsed;
    return new Set(groups.map((_, i) => i));
  }, [collapsed, groups]);

  const totalAdds = useMemo(() => groups.reduce((acc, g) => acc + g.adds, 0), [groups]);
  const totalRems = useMemo(() => groups.reduce((acc, g) => acc + g.rems, 0), [groups]);

  const handleCopyPath = (e, file, gi) => {
    e.stopPropagation();
    navigator.clipboard.writeText(file).then(() => {
      setCopiedPaths(prev => ({ ...prev, [gi]: true }));
      setTimeout(() => {
        setCopiedPaths(prev => ({ ...prev, [gi]: false }));
      }, 2000);
    });
  };

  const handleCopyPlain = (e, hunks, gi) => {
    e.stopPropagation();
    const plainLines = [];
    hunks.forEach(h => {
      h.lines.forEach(line => {
        if (line.startsWith("+")) {
          plainLines.push(line.slice(1));
        }
      });
    });
    const plainText = plainLines.join("\n");
    navigator.clipboard.writeText(plainText).then(() => {
      setCopiedPlains(prev => ({ ...prev, [gi]: true }));
      setTimeout(() => {
        setCopiedPlains(prev => ({ ...prev, [gi]: false }));
      }, 2000);
    });
  };

  const handleCopyDiff = (e, rawLines, gi) => {
    e.stopPropagation();
    const diffText = rawLines.join("\n");
    navigator.clipboard.writeText(diffText).then(() => {
      setCopiedDiffs(prev => ({ ...prev, [gi]: true }));
      setTimeout(() => {
        setCopiedDiffs(prev => ({ ...prev, [gi]: false }));
      }, 2000);
    });
  };

  if (groups.length === 0) return (
    <div style={{textAlign:"center",padding:"50px 0",fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:T.textDim}}>
      No diff available yet
    </div>
  );

  const toggleFile = (idx) => {
    const next = new Set(safeCollapsed);
    if (next.has(idx)) next.delete(idx);
    else next.add(idx);
    setCollapsed(next);
  };

  const toggleAll = (doCollapse) => {
    if (doCollapse) setCollapsed(new Set(groups.map((_, i) => i)));
    else setCollapsed(new Set());
  };

  return (
    <div style={{display:"flex", flexDirection:"column", gap:12}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 4px"}}>
        <div style={{display:"flex", alignItems:"center", gap:10}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:800, color:T.dim, letterSpacing:"0.08em"}}>
            {groups.length} FILE{groups.length!==1?'S':''}
          </div>
          <div style={{display:"flex", alignItems:"center", gap:6, fontFamily:"'JetBrains Mono',monospace", fontSize:10, fontWeight:800}}>
            <span style={{color:T.brand}}>+{totalAdds}</span>
            <span style={{color:T.red}}>-{totalRems}</span>
          </div>
        </div>
        <div style={{display:"flex", gap:6}}>
          <PickerBtn label="EXPAND" isAct={safeCollapsed.size === 0} onClick={() => toggleAll(false)} />
          <PickerBtn label="COLLAPSE" isAct={safeCollapsed.size === groups.length} onClick={() => toggleAll(true)} />
        </div>
      </div>

      {groups.map((g, gi) => {
        const isCollapsed = safeCollapsed.has(gi);
        const parts = g.file.split("/");
        const base = parts.pop();
        const dir = parts.join("/");

        return (
          <div key={gi} style={{
            background:T.surface, border:`1px solid ${isCollapsed ? T.border : T.borderHi}`,
            borderRadius:8, overflow:"hidden", marginBottom: 4,
            boxShadow: isCollapsed ? "none" : "0 4px 20px rgba(0,0,0,0.2), inset 0 0 1px rgba(255,255,255,0.05)",
            transition: "all .2s cubic-bezier(0.4, 0, 0.2, 1)"
          }}>
            <div
              role="button"
              tabIndex={0}
              aria-expanded={!isCollapsed}

              onKeyDown={e => (e.key === "Enter" || e.key === " ") && toggleFile(gi)}

                    onClick={(e) => handleCopyPlain(e, g.hunks, gi)}
                    title="Copy plain text code (added lines)"

                      background: "none", border: "none", padding: "4px 8px", cursor: "pointer",

                    onMouseLeave={e => { e.currentTarget.style.color = copiedPlains[gi] ? T.brand : T.muted; e.currentTarget.style.background = "none"; }}

            <div style={{
              maxHeight: isCollapsed ? 0 : 20000,
              opacity: isCollapsed ? 0 : 1,

            }}>

                <div key={hi} style={{ borderTop: hi > 0 ? `1px solid ${T.border}40` : "none" }}>
                  <div style={{
                    padding:"3px 12px", background:"rgba(30,41,59,0.5)", color:T.blue, fontSize:10,
                    fontWeight:700, borderBottom:`1px solid ${T.border}20`, display:"flex", alignItems:"center", gap:6
                  }}>
                    <div style={{ width:4, height:4, borderRadius:"50%", background:T.blue, opacity:0.5 }}/>
                    {h.header}
                  </div>
                  {h.lines.map((line, li) => {
                    const isAdd = line.startsWith("+");
                    const isRem = line.startsWith("-");
                    const c = isAdd ? T.brandLight : isRem ? T.redLight : T.muted;
                    const bg = isAdd ? "rgba(6, 182, 212, 0.08)" : isRem ? "rgba(255, 113, 133, 0.08)" : "transparent";
                    const symbol = isAdd ? "+" : isRem ? "-" : " ";
                    const content = (isAdd || isRem) ? line.slice(1) : line;

                    return (
                      <div key={li} style={{
                        display:"flex", background:bg, minHeight:20,
                        borderLeft:`3px solid ${isAdd ? T.brand : isRem ? T.red : "transparent"}`,
                        transition: "background .1s cubic-bezier(0.4, 0, 0.2, 1)"
                      }}>
                        <div style={{
                          width:24, flexShrink:0, display:"flex", alignItems:"center",
                          justifyContent:"center", color:c, opacity:0.7, fontSize:11,
                          userSelect:"none", fontWeight:800, fontFamily:"monospace"
                        }}>
                          {symbol}
                        </div>
                        <div style={{
                          padding:"2px 10px", color:isAdd?T.textHi:isRem?T.textHi:T.textDim,
                          whiteSpace:"pre-wrap", wordBreak:"break-all", flex:1,
                          opacity: (isAdd||isRem)?1:0.8,
                          fontSize: 11,
                        }}>
                          {content || " "}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
});

// ─── Session Card ─────────────────────────────────────────────────────────────
const areEqual = (prevProps, nextProps) => {
  return (
    prevProps.isSelected === nextProps.isSelected &&
    prevProps.index === nextProps.index &&
    prevProps.lastReadTs === nextProps.lastReadTs &&
    prevProps.hasFollowupDraft === nextProps.hasFollowupDraft &&
    prevProps.latestCompletedTime === nextProps.latestCompletedTime &&
    prevProps.s.id === nextProps.s.id &&
    prevProps.s.state === nextProps.s.state &&
    prevProps.s.title === nextProps.s.title &&
    prevProps.s.prompt === nextProps.s.prompt &&
    prevProps.s.updateTime === nextProps.s.updateTime &&
    prevProps.s.createTime === nextProps.s.createTime &&
    prevProps.activities === nextProps.activities &&
    prevProps.stats === nextProps.stats
  );
};

const SessionCard = memo(({ s, onPress, isSelected, index, activities = [], stats, lastReadTs, latestCompletedTime, hasFollowupDraft }) => {
  const cardRef = useRef(null);

  useEffect(() => {
    if (isSelected && cardRef.current) {
      cardRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, [isSelected]);

  const isActuallyDone = useMemo(() => {
    return getIsActuallyDone(s.state, activities);
  }, [activities, s.state]);
  const currentState = isActuallyDone ? "COMPLETED" : s.state;

  const driftDetected = useMemo(() => {
    if (currentState === "COMPLETED") return false;
    if (!latestCompletedTime) return false;
    const currentStart = parseDateMs(s.createTime);
    return latestCompletedTime > currentStart;
  }, [s.createTime, latestCompletedTime, currentState]);

  const isWorking = ACTIVE_STATES.has(currentState);
  const isFinished = currentState === "COMPLETED" || currentState === "FAILED";
  const updateTs = s.updateTime || s.createTime;
  const isUnread = isFinished && (!lastReadTs || updateTs > lastReadTs);

  const pct  = pctFromState(currentState);
  const m    = STATUS_META[currentState] || STATUS_META.QUEUED;
  const repo = s.sourceContext?.githubRepoContext ? s.sourceContext.source?.replace("sources/github/","") : null;
  const pri  = useMemo(() => getPRInfo(s, activities), [s, activities]);
  const b    = useMemo(() => getBranchInfo(s, activities), [s, activities]);
  const ahead = useMemo(() => getAheadCount(activities), [activities]);
  const checks = useMemo(() => getCheckStatus(activities), [activities]);

  const activityStats = useMemo(() => {
    if (stats) return stats;
    return {
      count: activities.length,
      size: getActivitiesSize(activities)
    };
  }, [activities, stats]);

  const [flash, setFlash] = useState(false);
  useEffect(() => {
    if (activityStats.count > 0) {
      setFlash(true);
      const t = setTimeout(() => setFlash(false), 20000);
      return () => clearTimeout(t);
    }
  }, [activityStats.count, activityStats.size]);

  const isVHighActivity = activityStats.count >= 300 || activityStats.size >= 5 * 1024 * 1024;
  const isHighActivity = activityStats.count >= 200 || activityStats.size >= 1 * 1024 * 1024;
  const highActivityStyle = isVHighActivity ? { color: T.red, fontWeight: 900 } : isHighActivity ? { color: T.amber, fontWeight: 900 } : {};

  const bg = isSelected
    ? `${T.brand}20`
    : isUnread ? `${T.indigo}0a` : isWorking ? `${T.blue}06` : T.surface;

  const borderColor = isSelected ? `${T.brand}30` : isUnread ? `${T.indigo}20` : isWorking ? `${T.blue}20` : `${T.border}66`;

  return (
    <button ref={cardRef} onClick={onPress}
      aria-label={`Session ${index}: ${s.title || s.prompt}. Status: ${m.label}. ${isUnread ? "New activity." : ""}`}
      style={{
        width:"100%", background:bg, textAlign:"left", cursor:"pointer",
        border:`1px solid ${borderColor}`,
        borderLeft:`2px solid ${isUnread ? T.indigo : (isSelected ? T.brand : T.border)}`,
        borderRadius:6, padding:"8px 12px", marginBottom:4, transition:"all .2s cubic-bezier(0.4, 0, 0.2, 1)",
        position:"relative",
        transform:isSelected?"translateX(4px) scale(1.005)":"none",
        outline:"none",
        boxShadow: "none",
        zIndex: isSelected ? 2 : 1,
      }}
      onFocus={e => e.currentTarget.style.borderColor = T.brand}
      onBlur={e => e.currentTarget.style.borderColor = borderColor}
    >
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
        <div style={{width:16,fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:T.muted,fontWeight:800,opacity:0.6}}>{index}</div>
        <div
          title={m.label}
          aria-label={`Status: ${m.label}`}
          style={{display:"flex",alignItems:"center",justifyContent:"center",width:18,height:18,background:"transparent",flexShrink:0}}
        >
          <div style={{ display: "flex", animation: currentState === "IN_PROGRESS" ? "spin 3s linear infinite" : "none" }}>
            <Ic n={m.icon} s={11} c={m.color}/>
          </div>
        </div>
        <div style={{flex:1,minWidth:0,fontFamily:"'IBM Plex Sans',sans-serif",fontSize:13,fontWeight:600,color:isSelected?T.textHi:T.textDim,lineHeight:1.3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {s.title||s.prompt}
        </div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:T.muted,fontWeight:500,flexShrink:0}}>
          {fmtAgo(parseDateMs(s.updateTime||s.createTime))}
        </div>
      </div>

      <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:4, marginLeft:26, flexWrap:"wrap"}}>
        {repo && (
          <div style={{display:"flex", alignItems:"center", gap:4, opacity:0.7}}>
            <Ic n="code" s={10} c={T.muted}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:T.muted,fontWeight:700}}>{repo}</span>
          </div>
        )}
        {pri && (
          <div style={{display:"flex", alignItems:"center", gap:4, color:pri.state==="merged"?T.purple:T.brand, opacity:0.9}}>
            <Ic n={pri.state==="merged"?"git_merge":"git_pull"} s={10} c={pri.state==="merged"?T.purple:T.brand}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,fontWeight:900}}>#{pri.number}</span>
            {pri.ahead > 0 && <span aria-label={`${pri.ahead} commits ahead`} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900,color:T.brandLight,background:T.brandDim,padding:"1px 3px",borderRadius:2}}>↑{pri.ahead}</span>}
            {pri.behind > 0 && <span aria-label={`${pri.behind} commits behind`} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900,color:T.amber,background:T.amberDim,padding:"1px 3px",borderRadius:2}}>↓{pri.behind}</span>}
          </div>
        )}
        {(!pri || pri.state === "closed") && b?.isNew && (
          <div style={{display:"flex", alignItems:"center", gap:4, color:T.blue, opacity:0.9}}>
            <Ic n="branch" s={10} c={T.blue}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,fontWeight:900}}>{b.working}</span>
            {b.ahead > 0 && <span aria-label={`${b.ahead} commits ahead`} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900,color:T.brandLight,background:T.brandDim,padding:"1px 3px",borderRadius:2}}>↑{b.ahead}</span>}
            {b.behind > 0 && <span aria-label={`${b.behind} commits behind`} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900,color:T.amber,background:T.amberDim,padding:"1px 3px",borderRadius:2}}>↓{b.behind}</span>}
            {!(b.ahead > 0 || b.behind > 0) && ahead > 0 && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900,color:T.blue}}>+{ahead}</span>}
          </div>
        )}
        {(pri?.checks || b?.checks || checks) && (
          (() => {
            const ck = pri?.checks || b?.checks || checks;
            return (
              <div style={{display:"flex", alignItems:"center", gap:3, color:ck.state==="success"?T.brandLight:ck.state==="failure"?T.red:T.amber, opacity:0.9}}>
                <Ic n={ck.state==="success"?"check":ck.state==="failure"?"x":"refresh"} s={9} c={ck.state==="success"?T.brandLight:ck.state==="failure"?T.red:T.amber}/>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900}}>{ck.label}</span>
              </div>
            );
          })()
        )}
        {driftDetected && (
          <div style={{display:"flex", alignItems:"center", gap:3, color:T.amber, opacity:0.9}}>
            <Ic n="wifi" s={9} c={T.amber}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900}}>STALE</span>
          </div>
        )}
        {hasFollowupDraft && (
          <div style={{
            display:"flex", alignItems:"center", gap:3, color:T.amberLight, opacity:0.95,
            background:`${T.amber}15`, padding:"1px 6px", borderRadius:4, border:`1px solid ${T.amber}30`
          }}>
            <Ic n="layers" s={9} c={T.amberLight}/>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,fontWeight:900}}>DRAFT MSG</span>
          </div>
        )}
        {isUnread && <div style={{width:4,height:4,borderRadius:"50%",background:T.indigo,animation:"dot 1s infinite"}}/>}
      </div>

      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:0,marginLeft:26,fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:T.dim,opacity:0.6}}>
        <div style={{
          display:"flex", alignItems:"center", gap:6,
          background: flash ? `${T.brand}25` : "transparent",
          padding: "2px 6px", margin: "-2px -6px", borderRadius: 4,
          transition: flash ? "none" : "background 5s cubic-bezier(0.4, 0, 0.2, 1)",
          color: flash ? T.brandLight : T.dim,
          fontWeight: flash ? 800 : 500,
        }}>
          <span style={highActivityStyle}>{activityStats.count} ITEMS</span>
          <span>·</span>
          <span style={highActivityStyle}>{fmtBytes(activityStats.size/1024)}</span>
        </div>
        <div style={{marginLeft:"auto"}}>

        </div>
      </div>

}, areEqual);

/**
 * useSessionPolling
 *
 * Extracted custom hook that encapsulates the polling, countdown timer, and refresh logic
 * for the SessionDetail view. It manages the effective interval state transitions, coordinates
 * the useAutoPoll lifecycle, and handles the manual handleRefresh action without polluting
 * the main component's state or render loops.
 */
const useSessionPolling = (
  session,
  pollInterval,
  loadSession,
  loadActivities,
  lastTsRef,
  isFinished,
  busy,
  setBusy,
  setErr,
  setJustUpdated
) => {
  const effectiveInterval = (isFinished && !busy) ? 0 : pollInterval;

  const countdown = useAutoPoll(
    effectiveInterval,
    useCallback(() => Promise.all([loadSession(), loadActivities(lastTsRef.current)]), [loadSession, loadActivities, lastTsRef])
  );

  const handleRefresh = useCallback(async () => {
    setBusy(true);
    setErr(null);
    try {
      await Promise.all([loadSession(), loadActivities(null)]);
      setJustUpdated(true);
      setTimeout(() => setJustUpdated(false), 2000);
    } catch (err) {
      setErr(err.message);
    } finally {
      setBusy(false);
    }
  }, [loadSession, loadActivities, setBusy, setErr, setJustUpdated]);

  return { countdown, handleRefresh };
};

// ─── Session Detail ───────────────────────────────────────────────────────────
const SessionDetail = ({ session:initSession, apiKey, personas, onBack, onDelete, onSessionUpdate, onStatsUpdate, isDesktop, pollInterval, setPollInterval, isArchived, onArchive, onUnarchive, onIgnore, cacheLimit, activityLimit, allSessions = [], activitiesMap = {}, onDraftChange }) => {

  const contentRef = useRef(null);
  const composerRef = useRef(null);

  const handleScroll = useCallback(e => {
    const y = e.target.scrollTop;
    const h = e.target.scrollHeight;
    const vh = e.target.offsetHeight;
    const diff = y - lastScrollY.current;

    if (Math.abs(diff) > 5) {
      scrollDir.current = diff > 0 ? 1 : -1;
    }

    const isNearBottom = h - y - vh < 100;
    const canHeaderShrink = h - vh > 250; // Only allow shrinking if there's significant content

    // Scrolled state for visual transitions
    if (y > 10 !== scrolled) setScrolled(y > 10);

    // Visibility logic:
    if (isNearBottom) {
      setComposerVisible(true);
      setHeaderExpanded(true);
    } else if (y > 150 && canHeaderShrink) {
      if (scrollDir.current === 1) {
        setComposerVisible(false);
        setHeaderExpanded(false);
      } else if (scrollDir.current === -1) {
        setComposerVisible(true);
        setHeaderExpanded(true);
      }
    } else if (y < 50) {
      setComposerVisible(true);
      setHeaderExpanded(true);
    }

    const isCloseToBottom = h - y - vh < 150;
    const isCloseToTop = y < 150;
    const canScroll = h - vh > 250;

    if (canScroll) {
      if (isCloseToBottom) {
        setShowScroll(true);
        setScrollDirMode("top");
      } else if (isCloseToTop) {
        setShowScroll(true);
        setScrollDirMode("bottom");
      } else {
        setShowScroll(true);
        setScrollDirMode(scrollDir.current === -1 ? "bottom" : "top");

    if (!repo) return false;

  useEffect(() => {
    if (driftDetected && !isArchived) setShowDriftWarning(true);

  const txtRef       = useRef(null);

  // Performance Optimization: Wrap callbacks in reference-stable useCallback
  // to avoid breaking React.memo for the ActivityFeed child component.
  const handleShowAll = useCallback(() => {
    setShowAll(true);
  }, []);

  const handleEditMessage = useCallback((text) => {

    setComposerVisible(true);

  const handleReply = useCallback((act, sender) => {
    setReplyingTo({ act, sender });
    setComposerMinimized(false);
    setComposerVisible(true);

      if (txtRef.current) {

  }, []);

  const feedEndRef   = useRef(null);
  const actMapRef    = useRef(new Map());      // id → activity (dedup)
  const prevLenRef   = useRef(0);
  const activitiesAbortRef = useRef(null);

  // ── Optimized activity loader: createTime cursor + Map dedup ──────────────
  // First load fetches all; subsequent loads fetch only new (createTime filter)
  const lastTsRef = useRef(null);
  const loadActivities = useCallback(async (sinceTs=null) => {
    if (activitiesAbortRef.current) {
      activitiesAbortRef.current.abort();
    }
    const controller = new AbortController();
    activitiesAbortRef.current = controller;

    setIsSyncing(true); setIsStale(true);
    setSyncProgress(sinceTs ? (busy ? "SYNC" : "FETCH") : "CACHE");
    setSyncPhaseStats({ count: 0, pages: 0, bytes: 0, newItems: 0, newBytes: 0, loaded: 0, total: 0 });
    let currentPages = 0;
    let currentCount = 0;
    let currentBytes = 0;
    let currentLoaded = 0;
    let currentTotal = 0;
    let newItems = 0;
    let newBytes = 0;

    try {
      let pageToken = null;
      let changed = false;
      let latestTs = lastTsRef.current;

      do {
        currentPages++;
        if (!sinceTs) setSyncProgress("FETCH");
        const pageSize = Math.min(activityLimit, 100);
        // The /activities API does not support createTime query parameter
        const qs = `pageSize=${pageSize}${pageToken ? `&pageToken=${pageToken}` : ""}`;

        const d = await apiCall(apiKey, `/sessions/${session.id}/activities?${qs}`, {
          _label:`Acts ${sinceTs?"Δ":"full"} ${session.id?.slice(0,6)}`,
          signal: controller.signal,
          onProgress: ({ loaded, total }) => {
            currentLoaded = loaded;
            currentTotal = total;
            setSyncPhaseStats(prev => ({ ...prev, loaded: currentLoaded, total: currentTotal }));
          }
        });

        if (activitiesAbortRef.current !== controller) return;

        const incoming = d.activities || [];
        const batchBytes = getActivitiesSize(incoming);

        currentCount += incoming.length;
        currentBytes += batchBytes;

        for (const act of incoming) {
          const k = getActKey(act);
          const existing = actMapRef.current.get(k);
          // Upsert: update if content changed or is new
          if (!existing || !fastDeepEqual(existing, act)) {
            const actSize = getApproxBytes(act);
            newItems++;
            newBytes += actSize;
            actMapRef.current.set(k, act);
            changed = true;
            if (!latestTs || act.createTime > latestTs) latestTs = act.createTime;
          }
        }
        setSyncPhaseStats({ count: currentCount, pages: currentPages, bytes: currentBytes, newItems, newBytes, loaded: currentLoaded, total: currentTotal });

        pageToken = d.nextPageToken;

        // Respect activityLimit
        if (actMapRef.current.size >= activityLimit) {
          pageToken = null;
        }

        // On incremental loads (sinceTs), we don't need to follow tokens as new
        // activities are added to the end of the history.
        if (sinceTs) break;

      } while (pageToken);

      if (activitiesAbortRef.current !== controller) return;

      if (latestTs) lastTsRef.current = latestTs;
      if (changed) {
        setSyncProgress("SYNC");
        let sorted = Array.from(actMapRef.current.values())
          .filter(a => !a._temp)
          .sort((a,b) => parseDateMs(a.createTime) - parseDateMs(b.createTime));

        // Enforce limit if we exceeded it during this load
        if (sorted.length > activityLimit) {
          sorted = sorted.slice(-activityLimit);
          // Sync map back
          actMapRef.current = new Map();
          sorted.forEach(a => actMapRef.current.set(getActKey(a), a));
        }
        setActivities(sorted);
        setJustUpdated(true);
        setTimeout(() => setJustUpdated(false), 3000);
        setIsStale(false);

        // Persist stats
        try {
          const size = getActivitiesSize(sorted);
          const stats = { count: sorted.length, size };
          const allStats = SafeStorage.loadActStats();
          allStats[session.id] = stats;
          SafeStorage.saveActStats(allStats);
          onStatsUpdate?.(session.id, stats);
          window.dispatchEvent(new CustomEvent("jac_stats_updated", { detail: allStats }));
        } catch (e) { console.error("Failed to save stats", e); }
      }

      // Update Session Cache
      if (cacheLimit > 0) {
        try {
          const cache = SafeStorage.loadSessionCache();
          cache[session.id] = { activities: Array.from(actMapRef.current.values()).filter(a => !a._temp).sort((a,b) => parseDateMs(a.createTime) - parseDateMs(b.createTime)).slice(-activityLimit), ts: Date.now() };
          // Strict LRU Strategy
          let keys = Object.keys(cache);
          if (keys.length > cacheLimit) {
            keys.sort((a, b) => (cache[a].ts || 0) - (cache[b].ts || 0));
            while (keys.length > cacheLimit) {
              delete cache[keys.shift()];
            }
          }
          SafeStorage.saveSessionCache(cache);
        } catch {}
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error("[LoadActivities] Error:", err);
    } finally {
      if (activitiesAbortRef.current === controller) {
        setIsSyncing(false); setIsStale(false);
        setSyncProgress("DONE");
        setTimeout(() => setSyncProgress("IDLE"), 2000);
      }
    }
  }, [apiKey, session.id, activityLimit, cacheLimit]);

  const loadSession = useCallback(async () => {

      onSessionUpdate?.(d);

  // On mount (keyed by session.id, so fresh per-session)
  useEffect(() => {
    actMapRef.current = new Map();
    // Seed Map from initial activities (cached)

    lastTsRef.current = activities.length > 0 ? activities[activities.length-1].createTime : null;
    prevLenRef.current = 0;
    setShowAll(false);
    setErr(null);

    // If we have cached activities, report their stats immediately
    if (activities.length > 0) {
      try {
        const size = getActivitiesSize(activities);
        onStatsUpdate?.(session.id, { count: activities.length, size });
      } catch {}
    }

    // Set stale immediately if we have cache, to trigger syncing cue
    if (activities.length > 0) setIsStale(true);

    loadActivities(null); // full load on first open
    loadSession();

    return () => {
      if (activitiesAbortRef.current) activitiesAbortRef.current.abort();
    };
  }, []); // intentional: component is keyed by session.id

  // Auto-scroll to bottom when new messages arrive
  useEffect(() => {
    const len = activities.length;
    if (len > prevLenRef.current && tab === "activity" && feedEndRef.current) {
      const el = contentRef.current;
      const isNearBottom = el ? (el.scrollHeight - el.scrollTop - el.offsetHeight < 150) : false;

      if (userSentRef.current || isNearBottom) {
        feedEndRef.current.scrollIntoView({ behavior: len - prevLenRef.current > 8 ? "instant" : "smooth" });
      }
    }
    userSentRef.current = false;
    prevLenRef.current = len;
  }, [activities, tab]);

  // Ensure non-activity tabs start at the top
  useEffect(() => {
    if (tab !== "activity" && contentRef.current) {
      contentRef.current.scrollTop = 0;
    }
  }, [tab]);

  const togglePersona = (id) => {
    const next = new Set(selectedPersonas);
    if (next.has(id)) next.delete(id); else next.add(id);

  const handleExpandComposer = useCallback(() => {
    setComposerMinimized(false);
    setComposerVisible(true);

  // Persist draft follow-up message

  useEffect(() => {
    clearTimeout(draftRef.current);

      try {
        if (msg.trim()) {

          if (onDraftChange) onDraftChange(session.id, true);
        } else {
          SafeStorage.clearFollowupDraft(session.id);
          if (onDraftChange) onDraftChange(session.id, false);

      } catch {}
    }, 400);
    return () => clearTimeout(draftRef.current);
  }, [msg, session.id, onDraftChange]);

  // ── Actions ─────────────────────────────────────────────────────────────────
  const handleSend = async () => {
    if (!msg.trim() || busy) return;
    userSentRef.current = true;

    if (replyingTo) {
      let quoteText = "";
      const replyAct = replyingTo.act;
      if (replyAct.agentMessaged) {
        quoteText = replyAct.agentMessaged.agentMessage;
      } else if (replyAct.progressUpdated) {
        quoteText = replyAct.progressUpdated.description || replyAct.progressUpdated.title || "";
      } else if (replyAct.planGenerated) {
        quoteText = "Plan Generated";
      } else {
        quoteText = replyAct.description || "System Event";
      }

      // Limit quoteText length
      if (Array.from(quoteText).length > 200) {
        quoteText = safeSlice(quoteText, 197) + "...";
      }

      const headerLine = `> **Replying to ${replyingTo.sender || "JULES"}**: *"${quoteText.replace(/\n/g, " ")}"*`;
      text = `${headerLine}\n\n${text}`;
    }

    if (selectedPersonas.size > 0) {
      const personaPrompts = Array.from(selectedPersonas)
        .map(id => personas.find(p => p.id === id)?.prompt)
        .filter(Boolean);
      if (personaPrompts.length > 0) {
        const personaText = `(Persona: ${Array.from(selectedPersonas).map(id => personas.find(p => p.id === id)?.label).join(", ")})\n\n${personaPrompts.join("\n\n")}`;
        text = text ? `${text}\n\n${personaText}` : personaText;
      }

    setMsg("");
    setComposerMinimized(true);
    setExpanded(false);
    setReplyingTo(null);
    setBusy(true); setErr(null);

    // Optimistic: add temp bubble immediately
    const tempKey = `_temp_${Date.now()}`;
    const tempAct = {
      id: tempKey,
      createTime: new Date().toISOString(),
      userMessaged: { userMessage: text },
      _temp: true
    };
    actMapRef.current.set(tempKey, tempAct);
    setActivities(prev => [...prev, tempAct]);

    try {
      await apiCall(apiKey, `/sessions/${session.id}:sendMessage`, {
        method: "POST",
        body: { prompt: text },
        _label: `Msg -> ${session.id?.slice(0,6)}`
      });
      // Success: clear local draft
      try {
        SafeStorage.clearFollowupDraft(session.id);
        if (onDraftChange) onDraftChange(session.id, false);
      } catch (e) {}
      // Switch back to chat to show Jules' response
      setTab("activity");
      // Remove temp, fetch real activities with smart polling
      actMapRef.current.delete(tempKey);
      setTimeout(() => {
        loadActivities(lastTsRef.current);
        loadSession();
      }, 1200);
    } catch (err) {
      setErr(err.message);
      setMsg(text); // restore draft on error
      if (onDraftChange) onDraftChange(session.id, true);
      actMapRef.current.delete(tempKey);
      setActivities(prev => prev.filter(a => a.id !== tempKey));
    } finally {
      setBusy(false);
    }
  };

  const handleApprove = async () => {
    if (busy) return;
    let planTs = null;
    for (let i = activities.length - 1; i >= 0; i--) {
      if (activities[i].planGenerated) { planTs = activities[i].createTime; break; }
    }
    const alreadyApproved = activities.some(a => a.planApproved && (!planTs || a.createTime >= planTs));
    if (alreadyApproved) {
      setTab("activity");
      return;
    }

    setBusy(true); setErr(null);
    try {
      await apiCall(apiKey, `/sessions/${session.id}:approvePlan`, {
        method: "POST",
        body: {},
        _label: `Approve ${session.id?.slice(0,6)}`
      });
      await loadSession();
      await loadActivities(lastTsRef.current);
      setTab("activity");
    } catch (err) {
      const isAlready = err.message?.includes("400") && err.message.toLowerCase().includes("already approved");
      if (isAlready) {
        await loadSession();
        await loadActivities(lastTsRef.current);
        setTab("activity");
      } else {
        setErr(err.message);
      }
    } finally {
      setBusy(false);
    }
  };

  useEffect(() => {
    const el = contentRef.current;
    if (el) {
      const check = () => {
        const y = el.scrollTop;
        const h = el.scrollHeight;
        const vh = el.offsetHeight;
        const canScroll = h - vh > 200;
        setShowScroll(canScroll && (y > 100 || h - y - vh > 100));
        setScrollDirMode(y > (h - vh) / 2 ? "top" : "bottom");

      window.addEventListener("resize", check);
      return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", check); };

  // Used by PlanView to send revision requests
  const handleSendFeedback = useCallback(async (prompt, stayOnTab = false) => {
    let text = prompt;

        .map(id => personas.find(p => p.id === id)?.prompt)
        .filter(Boolean);
      if (personaPrompts.length > 0) {
        const personaText = `(Persona: ${Array.from(selectedPersonas).map(id => personas.find(p => p.id === id)?.label).join(", ")})\n\n${personaPrompts.join("\n\n")}`;
        text = text ? `${text}\n\n${personaText}` : personaText;
      }
    }
    const tempKey = `_temp_${Date.now()}`;
    const tempAct = {
      id: tempKey,
      createTime: new Date().toISOString(),
      userMessaged: { userMessage: text },
      _temp: true
    };
    actMapRef.current.set(tempKey, tempAct);
    setActivities(prev => [...prev, tempAct]);
    try {
      await apiCall(apiKey, `/sessions/${session.id}:sendMessage`, {
        method: "POST",
        body: { prompt: text },
        _label: `Msg -> ${session.id?.slice(0,6)}`
      });
      actMapRef.current.delete(tempKey);
      setComposerMinimized(true);
      setExpanded(false);
      if (stayOnTab !== true) setTab("activity");
      setTimeout(() => {
        loadActivities(lastTsRef.current);
        loadSession();
      }, 1500);
    } catch (err) {
      setErr(err.message);
      actMapRef.current.delete(tempKey);
      setActivities(prev => prev.filter(a => a.id !== tempKey));
      throw err;
    }

          }}

          title={scrollDirMode === "top" ? "Scroll to top" : "Scroll to bottom"}
          aria-label={scrollDirMode === "top" ? "Scroll to top" : "Scroll to bottom"}

};

function cleanupActivityStats(validIds) {
  try {
    const stats = SafeStorage.loadActStats();
    const validSet = new Set(validIds);
    let changed = false;
    for (const id in stats) {
      if (!validSet.has(id)) {
        delete stats[id];
        changed = true;
      }
    }
    if (changed) {
      SafeStorage.saveActStats(stats);
      window.dispatchEvent(new CustomEvent("jac_stats_updated", { detail: stats }));
    }
  } catch {}
}

function loadDraft() { return SafeStorage.loadDraft(); }
function loadRepoStats() { return SafeStorage.loadRepoStats(); }
function incRepoStat(name) { SafeStorage.incRepoStat(name); }
function loadLastSource() { return SafeStorage.loadLastSource(); }
function saveLastSource(name) { SafeStorage.saveLastSource(name); }
function loadLastBranches() { return SafeStorage.loadLastBranches(); }
function saveLastBranch(source, branch) { SafeStorage.saveLastBranch(source, branch); }
function saveDraft(d) { SafeStorage.saveDraft(d); }
function clearDraft() { SafeStorage.clearDraft(); }

function loadDraftsBox() { return SafeStorage.loadDraftsBox(); }
function saveDraftToBox(draft) { return SafeStorage.saveDraftToBox(draft); }
function deleteDraftFromBox(id) { SafeStorage.deleteDraftFromBox(id); }
function clearDraftsBox() { SafeStorage.clearDraftsBox(); }

/**
 * React custom hook `useNewSessionFlow` extracts and encapsulates all state management,
 * repository and branch fetching/sorting, fuzzy filtering, and multi-tiered template
 * auto-saving lifecycles from the NewSession component. This separates background orchestration,
 * data flows, and persistence concerns from layout rendering to resolve "God Mode" complexity.
 */
const useNewSessionFlow = ({ apiKey, personas, onCreate, initialDraft, onDraftSaved }) => {
  const draft = useMemo(() => initialDraft || loadDraft(), [initialDraft]);
  const hasSavedOrSubmitted = useRef(false);
  const [sources,setSources]       = useState([]);
  const [loadingSrc,setLoadSrc]    = useState(true);
  const [source,setSource]         = useState(draft?.source ?? "");
  const [sourceSearch,setSourceSearch] = useState("");
  const [showSources,setShowSources] = useState(false);
  const [branch,setBranch]         = useState(draft?.branch ?? "");
  const [branches,setBranches]     = useState([]);   // [{displayName}] from Jules API
  const [showBranches,setShowBranches] = useState(false);
  const [defaultBranch,setDefault] = useState("");   // e.g. "main"
  const [prompt,setPrompt]         = useState(draft?.prompt ?? "");
  const [autoMode,setAutoMode]     = useState(draft?.autoMode ?? true);
  const [reqApproval,setReqApp]    = useState(draft?.reqApproval ?? false);
  const [selectedPersonas, setSelectedPersonas] = useState(new Set(draft?.selectedPersonas || []));
  const [submitting,setSub]        = useState(false);
  const [err,setErr]               = useState(null);
  const [savedFlash,setSavedFlash] = useState(false);
  const [expanded,setExpanded]     = useState(false);
  const [showConfirm,setShowConfirm] = useState(false);
  const [sourceInteracted, setSourceInteracted] = useState(false);

  // ── Derive branches whenever selected source changes ─────────────────────
  const srcObj = useMemo(() => sources.find(s => s.name === source) || null, [sources, source]);

  const getSourceDisplay = useCallback((s) => {
    if (!s) return "No repo (repoless)";
    return s.githubRepo ? `${s.githubRepo.owner}/${s.githubRepo.repo}` : s.id || s.name;
  }, []);

  useEffect(() => {
    if (srcObj) setSourceSearch(getSourceDisplay(srcObj));
    else if (source === "") setSourceSearch("No repo (repoless)");
  }, [srcObj, source, getSourceDisplay]);

  const filteredSources = useMemo(() => {
    const search = sourceSearch.toLowerCase();
    const isSelectedMatch = (srcObj && sourceSearch === getSourceDisplay(srcObj)) || (source === "" && sourceSearch === "No repo (repoless)");

    let base = [...sources];
    const stats = loadRepoStats();
    base.sort((a,b) => (stats[b.name]||0) - (stats[a.name]||0));

    const all = [...base, null]; // null represents "repoless"
    if (!sourceSearch || isSelectedMatch) return all;
    return all.filter(s => getSourceDisplay(s).toLowerCase().includes(search));
  }, [sources, sourceSearch, getSourceDisplay, srcObj, source]);

  useEffect(() => {
    if (!srcObj) { setBranches([]); setDefault(""); return; }
    const repo = srcObj.githubRepo;
    if (!repo) { setBranches([]); setDefault(""); return; }
    const bs   = (repo.branches || []).map(b => b.displayName).filter(Boolean);
    const def  = repo.defaultBranch?.displayName || bs[0] || "main";
    setBranches(bs);
    setDefault(def);
    if (!draft?.branch || draft?.source !== source) {
      const lastBranch = loadLastBranches()[source];
      setBranch(lastBranch || def);
    }
  }, [srcObj, source]);

  const filteredBranches = useMemo(() => {
    if (!branch || branches.includes(branch)) return branches;
    const s = branch.toLowerCase();
    return branches.filter(b => b.toLowerCase().includes(s));
  }, [branches, branch]);

  const togglePersona = (id) => {
    const next = new Set(selectedPersonas);
    if (next.has(id)) next.delete(id); else next.add(id);
    setSelectedPersonas(next);
  };

  useEffect(() => {
    if (!source && autoMode) setAutoMode(false);
  }, [source, autoMode]);

  const draftRef = useRef(null);
  useEffect(() => {
    clearTimeout(draftRef.current);
    draftRef.current = setTimeout(() => {
      saveDraft({ source, branch, prompt, autoMode, reqApproval, selectedPersonas: Array.from(selectedPersonas) });
    }, 400);
    return () => clearTimeout(draftRef.current);
  }, [source, branch, prompt, autoMode, reqApproval]);

  const stateRef = useRef({ source, branch, prompt, autoMode, reqApproval, selectedPersonas, defaultBranch, initialDraft });
  useEffect(() => {
    stateRef.current = { source, branch, prompt, autoMode, reqApproval, selectedPersonas, defaultBranch, initialDraft };
  }, [source, branch, prompt, autoMode, reqApproval, selectedPersonas, defaultBranch, initialDraft]);

  useEffect(() => {
    return () => {
      if (!hasSavedOrSubmitted.current) {
        const current = stateRef.current;
        if (current.prompt.trim()) {
          const d = {
            id: current.initialDraft?.id,
            source: current.source,
            branch: current.branch || current.defaultBranch || "main",
            prompt: current.prompt,
            autoMode: current.autoMode,
            reqApproval: current.reqApproval,
            selectedPersonas: Array.from(current.selectedPersonas),
            title: (() => {
              const firstLine = current.prompt.trim().split("\n")[0];
              const truncated = safeSlice(firstLine, 50);
              const hasMore = Array.from(current.prompt.trim()).length > 50 || firstLine !== current.prompt.trim();
              return truncated + (hasMore ? "..." : "");
            })()
          };
          saveDraftToBox(d);
          clearDraft();
        }
      }
    };
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const d = await apiCall(apiKey, "/sources?pageSize=50", { _label:"List sources" });
        const s = d.sources || [];
        const stats = loadRepoStats();
        const sorted = [...s].sort((a,b) => (stats[b.name]||0) - (stats[a.name]||0));
        setSources(sorted);
        if (!draft?.source) {
          const last = loadLastSource();
          if (last && sorted.some(x => x.name === last)) setSource(last);
          else if (sorted.length > 0) setSource(sorted[0].name);
        }
      } catch (err) { setErr(err.message); }
      finally { setLoadSrc(false); }
    })();
  }, []);

  const handleClearDraft = () => {
    hasSavedOrSubmitted.current = true;
    clearDraft();
    setSource(""); setBranch(""); setPrompt("");
    setAutoMode(true); setReqApp(false); setSelectedPersonas(new Set());
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 1500);
    if (onDraftSaved) onDraftSaved();
  };

  const handleSaveToBox = () => {
    if (!prompt.trim()) return;
    hasSavedOrSubmitted.current = true;
    const d = {
      id: initialDraft?.id,
      source,
      branch: branch || defaultBranch || "main",
      prompt,
      autoMode,
      reqApproval,
      selectedPersonas: Array.from(selectedPersonas),
      title: (() => {
        const firstLine = prompt.trim().split("\n")[0];
        const truncated = safeSlice(firstLine, 50);
        const hasMore = Array.from(prompt.trim()).length > 50 || firstLine !== prompt.trim();
        return truncated + (hasMore ? "..." : "");
      })()
    };
    saveDraftToBox(d);
    handleClearDraft();
    if (onDraftSaved) onDraftSaved();
  };

  const handleCreate = async () => {
    setSub(true); setErr(null); setShowConfirm(false);

    const activeBranch = branch || defaultBranch || "main";
    if (source && !isValidGitBranchName(activeBranch)) {
      setErr("Invalid branch name format. Branch names cannot contain spaces, consecutive dots, or characters like ~, ^, :, ?, *, [, \\.");
      setSub(false);
      return;
    }

    let finalPrompt = prompt.trim();
    if (selectedPersonas.size > 0) {
      const personaPrompts = Array.from(selectedPersonas)
        .map(id => personas.find(p => p.id === id)?.prompt)
        .filter(Boolean);
      if (personaPrompts.length > 0) {
        finalPrompt += "\n\n" + personaPrompts.join("\n\n");
      }
    }

    const idempotencyKey = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);

    const body = {
      idempotencyKey,
      prompt: finalPrompt,
      ...(source&&{
        sourceContext:{ source, githubRepoContext:{ startingBranch:branch||defaultBranch||"main" } },
        ...(autoMode&&{automationMode:"AUTO_CREATE_PR"}),
      }),
      requirePlanApproval: reqApproval,
    };
    try {
      const d = await apiCall(apiKey, "/sessions", {
        method: "POST",
        headers: { "Idempotency-Key": idempotencyKey },
        body,
        timeout: 60000,
        _label: "Create session"
      });
      hasSavedOrSubmitted.current = true;
      clearDraft();
      if (source) {
        incRepoStat(source);
        saveLastSource(source);
        saveLastBranch(source, branch || defaultBranch || "main");
      }
      onCreate(d);
    } catch (err) { setErr(err.message); setSub(false); }
  };

  return {
    draft,
    sources, setSources,
    loadingSrc, setLoadSrc,
    source, setSource,
    sourceSearch, setSourceSearch,
    showSources, setShowSources,
    branch, setBranch,
    branches, setBranches,
    showBranches, setShowBranches,
    defaultBranch, setDefault,
    prompt, setPrompt,
    autoMode, setAutoMode,
    reqApproval, setReqApp,
    selectedPersonas, setSelectedPersonas,
    submitting, setSub,
    err, setErr,
    savedFlash, setSavedFlash,
    expanded, setExpanded,
    showConfirm, setShowConfirm,
    sourceInteracted, setSourceInteracted,
    srcObj,
    getSourceDisplay,
    filteredSources,
    filteredBranches,
    togglePersona,
    handleClearDraft,
    handleSaveToBox,
    handleCreate
  };
};

            const isOverQuota = plan && todayCount.total >= plan.daily;
            let startBtnTitle = undefined;
            if (!prompt.trim()) {
              startBtnTitle = "Please enter a task prompt first";
            } else if (submitting) {
              startBtnTitle = "Assigning task to Jules...";
            } else if (loadingSrc) {
              startBtnTitle = "Loading repositories...";
            } else if (isOverQuota) {
              startBtnTitle = `Daily quota limit reached (${todayCount.total} of ${plan.daily} started). Reset in ${todayCount.resetIn || "24h"}.`;
            } else {
              startBtnTitle = "Assign task to Jules";
            }

            let draftBtnTitle = undefined;
            if (!prompt.trim()) {
              draftBtnTitle = "Please enter a task prompt first";
            } else if (submitting) {
              draftBtnTitle = "Submitting task...";
            } else {
              draftBtnTitle = "Save current session draft";
            }

            return (
              <div style={{display:"flex", gap:10}}>
                <Btn onClick={handleSaveToBox} disabled={!prompt.trim()||submitting} outline title={draftBtnTitle} aria-label={draftBtnTitle} style={{flex:1}}>

                  {submitting?"SENDING…":"ASSIGN TO JULES →"}
                </Btn>
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
};
